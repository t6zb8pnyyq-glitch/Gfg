<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NASA급 통합 전산 물리학 연구소</title>
    <style>
:root {
                --bg: #000000;
                --text: #e0e0e0;
                --panel: rgba(10, 10, 15, 0.9);
                --border: #38bdf8;
                --accent: #0284c7;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
            }
            body {
                margin: 0; padding: 0; background: var(--bg); color: var(--text);
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', monospace; overflow: hidden;
                display: flex; flex-direction: column; height: 100vh;
            }
            /* Layout — canonical DOM mapping */
            html, body { width:100%; height:100%; }
            body { overflow:hidden; }
            #layout-container { position:relative; width:100%; height:100dvh; min-height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; isolation:isolate; }
            #module-bar { grid-row:1; min-height:44px; display:flex; align-items:center; gap:6px; padding:4px 8px; box-sizing:border-box; overflow-x:auto; overflow-y:hidden; white-space:nowrap; background:var(--panel); border-bottom:1px solid var(--border); position:relative; z-index:50; touch-action:pan-x; }
            #viewport-container { grid-row:2; position:relative; min-width:0; min-height:0; overflow:hidden; background:#000; z-index:1; contain:layout paint; }
            #universe-canvas { position:absolute; inset:0; display:block; width:100%; height:100%; z-index:1; pointer-events:auto; touch-action:none; }
            #diagnostics-overlay { position:absolute; left:8px; top:8px; z-index:5; pointer-events:none; }
            .side-panel { position:absolute; top:0; bottom:0; width:min(320px,30vw); box-sizing:border-box; overflow-x:hidden; overflow-y:auto; padding:10px; background:var(--panel); z-index:20; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
            #creator-panel { left:0; border-right:1px solid var(--border); }
            #inspector-panel { right:0; border-left:1px solid var(--border); }
            #control-bar { grid-row:3; min-height:48px; display:flex; align-items:center; gap:6px; padding:4px 8px; box-sizing:border-box; overflow-x:auto; overflow-y:hidden; background:var(--panel); border-top:1px solid var(--border); position:relative; z-index:50; -webkit-overflow-scrolling:touch; }
            #control-bar > * { flex:0 0 auto; }
            #control-bar select, #control-bar input { width:auto; }
            button, select, input, label { position:relative; z-index:2; }
            button, select { touch-action:manipulation; }
            button { -webkit-tap-highlight-color:transparent; }
            .lab-btn, #btn-pause, #btn-audit { pointer-events:auto; }
            @media (max-width: 900px) {
                #creator-panel, #inspector-panel { width:min(42vw,280px); }
            }
            @media (max-width: 700px) {
                #module-bar { min-height:40px; }
                .side-panel { width:calc(100vw - 16px); top:auto; bottom:56px; height:min(42vh,330px); max-height:330px; border:1px solid var(--border); border-radius:8px; left:8px; right:8px; }
                #creator-panel { left:8px; }
                #inspector-panel { left:8px; right:8px; top:auto; bottom:56px; }
                #control-bar { min-height:52px; }
                #viewport-container { min-height:0; }
            }

            /* Mobile / interaction hardening */
            #module-bar, #control-bar { padding-left:max(8px, env(safe-area-inset-left)); padding-right:max(8px, env(safe-area-inset-right)); }
            #control-bar { padding-bottom:max(4px, env(safe-area-inset-bottom)); }
            button, select, input { min-height:36px; }
            button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:1px; }
            .lab-btn { min-width:max-content; }
            .mobile-panel-btn { display:none; }
            @media (max-width:700px) { .mobile-panel-btn { display:block; width:auto; min-width:64px; } }
            .side-panel h3 { position:sticky; top:-10px; z-index:3; background:var(--panel); padding:4px 0 8px; }
            #validation-modal { position:fixed !important; inset:5vh 5vw !important; width:auto !important; height:auto !important; max-height:90vh; z-index:5000 !important; border-radius:10px; box-sizing:border-box; padding:max(12px, env(safe-area-inset-top)) 16px 16px; overscroll-behavior:contain; }
            #validation-modal button { width:auto; min-width:100px; }
            @media (max-width:700px) {
                #validation-modal { inset: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)) 8px !important; max-height:none; }
                .side-panel { z-index:30; }
                #creator-panel, #inspector-panel { display:none; }
                #creator-panel.mobile-open, #inspector-panel.mobile-open { display:block; }
            }
            @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
            .sys-message { padding:6px 8px; margin:4px 0 8px; border-left:3px solid var(--border); background:rgba(15,23,42,.9); font-size:11px; }
            .sys-message.danger { border-color:var(--danger); color:#fecaca; }

            /* Layout */
            #top-bar { height: 45px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; font-weight: bold; overflow-x: auto; white-space: nowrap; }
            #main-area { display: flex; flex: 1; height: calc(100vh - 85px); position: relative; }
            .panel-col { width: 320px; background: var(--panel); overflow-y: auto; padding: 10px; box-sizing: border-box; font-size: 12px; z-index: 10; border-right: 1px solid var(--border); }
            #right-panel { border-right: none; border-left: 1px solid var(--border); }
            #center-viewport { flex: 1; position: relative; background: #000; overflow: hidden; z-index: 1; }
            #bottom-bar { height: 40px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; z-index: 10; }

            /* Controls */
            select, input, button { background: #1e293b; color: #fff; border: 1px solid var(--border); padding: 5px; font-family: inherit; margin: 3px 0; width: 100%; box-sizing: border-box; }
            button { background: var(--accent); cursor: pointer; font-weight: bold; transition: background 0.2s; }
            button:hover { background: #0369a1; }
            .section { margin-bottom: 15px; border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px; background: rgba(15, 23, 42, 0.6); }
            .section h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--border); border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 5px; }

            canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

            /* UI Elements */
            .lab-btn { margin-right: 5px; background: #1e293b; border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; width: auto; font-size: 11px;}
            .lab-btn.active { background: var(--accent); color: white; }
            table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
            td { padding: 3px 0; border-bottom: 1px dotted #334155; }
            .val { float: right; font-family: monospace; }
            .pass { color: var(--success); }
            .fail { color: var(--danger); }
            .warn { color: var(--warning); }

            /* Modal */
            .modal { display: none; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: var(--panel); border: 2px solid var(--border); z-index: 1000; overflow: auto; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
            #close-modal { float: right; background: var(--danger); width: auto; padding: 5px 15px; border: none;}

            /* Audit UI */
            .audit-tag { display: inline-block; padding: 2px 6px; margin: 2px; border-radius: 3px; font-size: 10px; background: var(--success); color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="layout-container">
        <div id="module-bar" aria-label="물리 실험 모듈"></div>

        <div id="viewport-container">
            <canvas id="universe-canvas"></canvas>
            <div id="diagnostics-overlay">초기화 중...</div>
            <div id="mobile-joystick" style="display:none; position:absolute; bottom:20px; left:20px; width:100px; height:100px; background:rgba(255,255,255,0.1); border-radius:50%; pointer-events:none;"></div>
        </div>

        <div id="creator-panel" class="side-panel">
            <h3>생성기 (Creator)</h3>
            <label>객체 유형</label>
            <select id="type">
                <option value="PLANET">행성 (Planet)</option>
                <option value="STAR">항성 (Star)</option>
                <option value="BLACK_HOLE">블랙홀 (Black Hole)</option>
                <option value="GAS_CLOUD">가스 구름 (Gas)</option>
            </select>
            <label>질량 (kg)</label>
            <input type="number" id="mass" value="5.972e24">
            <label>반지름 (m)</label>
            <input type="number" id="radius" value="6371000">
            <label>속도 X (m/s)</label>
            <input type="number" id="vel_x" value="0">
            <label>속도 Y (m/s)</label>
            <input type="number" id="vel_y" value="0">
            <label>속도 Z (m/s)</label>
            <input type="number" id="vel_z" value="0">
            <button id="btn-create" type="button">생성 (CREATE)</button>
            <hr>
            <p style="font-size:10px; color:#aaa;">* 모바일: 화면을 더블 탭하여 생성 가능</p>
        </div>

        <div id="inspector-panel" class="side-panel">
            <h3>물리 진단 (Diagnostics)</h3>
            <div id="inspector-data">선택된 객체 없음</div>
            <hr>
            <div id="diag-global">
                <div>에너지: <span id="diag-energy">0</span></div>
                <div>에너지 오차: <span id="diag-e-err">0</span></div>
                <div>총 운동량: <span id="diag-mom">0</span></div>
                <div>상태: <span id="diag-status">STABLE</span></div>
            </div>
        </div>

        <div id="control-bar">
            <button id="btn-creator-panel" class="mobile-panel-btn" type="button">생성기</button>
            <button id="btn-inspector-panel" class="mobile-panel-btn" type="button">진단</button>
            <button id="btn-pause" type="button">일시정지 (PAUSE)</button>
            <label>적분기:</label>
            <select id="integrator">
                <option value="rk4">Runge-Kutta 4 (정밀)</option>
                <option value="verlet">Velocity Verlet (안정)</option>
                <option value="euler">Semi-Implicit Euler</option>
            </select>
            <label>가속기:</label>
            <select id="sys-gravity">
                <option value="BARNES_HUT">Barnes-Hut O(N log N)</option>
                <option value="DIRECT">Direct O(N²)</option>
            </select>
            <label>타임스텝(dt):</label>
            <input type="number" id="sys-dt" value="1.0" min="1e-9" step="any" style="width:90px;" aria-label="time step seconds">
            <button id="btn-audit" type="button">검증 (AUDIT)</button>
        </div>
    </div>

    <div id="validation-modal" role="dialog" aria-modal="true" style="display:none; position:absolute; top:10%; left:20%; width:60%; height:80%; background:#1e1e1e; border:2px solid var(--border); z-index:1000; padding:20px; overflow-y:auto;">
        <button id="btn-close-audit" type="button" style="float:right;background:var(--danger);width:auto;">닫기</button>
        <h2>과학적 검증 프레임워크 결과</h2>
        <div id="validation-results"></div>
        
    </div>

    let canvas, ctx;
    let isDragging = false;
    let lastMouse = {x:0, y:0};
    let camera = { distance: 1e9, rot: {x: 0, y: 0} };
class Vec3 {
        constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
        add(v) { return new Vec3(this.x+v.x, this.y+v.y, this.z+v.z); }
        sub(v) { return new Vec3(this.x-v.x, this.y-v.y, this.z-v.z); }
        mult(s) { return new Vec3(this.x*s, this.y*s, this.z*s); }
        div(s) { return new Vec3(this.x/s, this.y/s, this.z/s); }
        dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
        cross(v) { return new Vec3(this.y*v.z - this.z*v.y, this.z*v.x - this.x*v.z, this.x*v.y - this.y*v.x); }
        magSq() { return this.x*this.x + this.y*this.y + this.z*this.z; }
        mag() { return Math.sqrt(this.magSq()); }
        normalize() { let m = this.mag(); return m === 0 ? new Vec3() : this.div(m); }
        clone() { return new Vec3(this.x, this.y, this.z); }
    }

/**
 * src/physics/PhysicalBody.js
 *
 * The single canonical state representation for a physical entity in the Universe Creator.
 * All quantities MUST be in strict SI units.
 */
class PhysicalBody {
    constructor(id, type, mass, radius, pos, vel) {
        this.id = id;
        this.type = type; // e.g., 'star', 'planet', 'blackhole', 'gas'

        // --- Core Mechanical State ---
        this.mass = mass;                 // [kg]
        this.radius = radius;             // [m]
        this.pos = pos;                   // [m] (Vec3)
        this.vel = vel;                   // [m/s] (Vec3)
        this.acc = new Vec3();            // [m/s^2] (Vec3)

        // --- Rigid Body / Rotation ---
        this.spin = new Vec3();           // Angular velocity vector [rad/s]

        // --- Thermodynamics & Fluid State ---
        this.temperature = 2.73;          // Diagnostic/core temperature [K]
        this.surfaceTemperature = 2.73;  // Radiating surface temperature [K]
        this.internalEnergy = 0;          // Total internal energy [J]

        // Fluid/SPH specific
        this.sph_density = 0;             // Local SPH evaluated density [kg/m^3]
        this.sph_pressure = 0;            // Local SPH evaluated pressure [Pa]

        // Derived Mechanical properties (calculated on demand or initialized here)
        this.updateDensity();             // Sets this.density [kg/m^3] based on homogeneous spherical assumption

        // --- Nuclear & Chemical Composition ---
        // Mass fractions must sum to 1.0. X=Hydrogen, Y=Helium, Z=Metals
        this.composition = { X: 0.73, Y: 0.25, Z: 0.02 };
        this.isotopes = {};

        // --- Electromagnetic ---
        this.charge = 0;                  // [C]
        this.magneticField = new Vec3();  // Intrinsic dipole moment / surface field proxy [T]

        // --- Radiation ---
        this.luminosity = 0;              // [W] (J/s)
        this.radiativeLuminosity = 0;      // [W] blackbody estimate
    }

    updateDensity() {
        if (this.radius <= 0) {
            this.density = Infinity;
        } else {
            const volume = (4/3) * Math.PI * Math.pow(this.radius, 3);
            this.density = this.mass / volume; // [kg/m^3]
        }
    }

    // Clone creates a deep copy of the state vector for integrators (like RK4)
    clone() {
        let b = new PhysicalBody(
            this.id,
            this.type,
            this.mass,
            this.radius,
            this.pos.clone(),
            this.vel.clone()
        );
        b.acc = this.acc.clone();
        b.spin = this.spin.clone();
        b.temperature = this.temperature;
        b.surfaceTemperature = this.surfaceTemperature;
        b.internalEnergy = this.internalEnergy;
        b.density = this.density;
        b.sph_density = this.sph_density;
        b.sph_pressure = this.sph_pressure;
        b.composition = { ...this.composition };
        b.isotopes = { ...this.isotopes };
        b.charge = this.charge;
        b.magneticField = this.magneticField.clone();
        b.luminosity = this.luminosity;
        b.radiativeLuminosity = this.radiativeLuminosity;
        return b;
    }
}

const GravityEngine = {
        computeAccelerations: function(objects, useBarnesHut) {
            let accels = new Array(objects.length).fill(null).map(() => new Vec3());

            if(useBarnesHut && objects.length > 50) {
                // Barnes-Hut O(N log N)
                let min = new Vec3(Infinity, Infinity, Infinity);
                let max = new Vec3(-Infinity, -Infinity, -Infinity);
                for(let o of objects) {
                    min.x = Math.min(min.x, o.pos.x); min.y = Math.min(min.y, o.pos.y); min.z = Math.min(min.z, o.pos.z);
                    max.x = Math.max(max.x, o.pos.x); max.y = Math.max(max.y, o.pos.y); max.z = Math.max(max.z, o.pos.z);
                }
                let size = Math.max(max.x - min.x, max.y - min.y, max.z - min.z) + 1;
                let root = new OctreeNode(new BBox(min.x, min.y, min.z, size));
                for(let o of objects) root.insert(o);

                let theta = 0.5; // accuracy param

                function calculateForce(node, body) {
                    if (!node || node.mass === 0) return new Vec3();
                    const containsTarget = node.box.contains(body.pos);
                    if(node.children===null){let acc=new Vec3();for(const source of node.bodies){if(source===body)continue;const rVec=source.pos.sub(body.pos),rSq=rVec.magSq();if(!(rSq>0)||!Number.isFinite(rSq))continue;acc=acc.add(rVec.mult(PhysicsConstants.G*source.mass/Math.pow(rSq,1.5)));}return acc;}
                    const rVec = node.centerOfMass.sub(body.pos);
                    const rSq = rVec.magSq(), r = Math.sqrt(rSq);
                    if (!(r > 0) || !Number.isFinite(r)) return new Vec3();
                    if (!containsTarget && (node.box.size / r) < theta)
                        return rVec.mult(PhysicsConstants.G * node.mass / Math.pow(rSq,1.5));
                    let acc = new Vec3();
                    for(let i=0;i<8;i++) acc=acc.add(calculateForce(node.children[i],body));
                    return acc;
                }

                for(let i=0; i<objects.length; i++) {
                    accels[i] = calculateForce(root, objects[i]);
                }

            } else {
                // Direct O(N^2)
                for(let i=0; i<objects.length; i++) {
                    for(let j=i+1; j<objects.length; j++) {
                        let rVec = objects[j].pos.sub(objects[i].pos);
                        let rSq = rVec.magSq();
                        if(rSq === 0) continue;
                        let r = Math.sqrt(rSq);
                        let fMag = PhysicsConstants.G / rSq;

                        let a_i = rVec.mult(fMag * objects[j].mass / r);
                        let a_j = rVec.mult(-fMag * objects[i].mass / r);

                        accels[i] = accels[i].add(a_i);
                        accels[j] = accels[j].add(a_j);
                    }
                }
            }
            return accels;
        }
    }

const CollisionEngine = {
    merge:function(a,b){
        const mass=a.mass+b.mass;
        const pos=a.pos.mult(a.mass).add(b.pos.mult(b.mass)).div(mass);
        const vel=a.vel.mult(a.mass).add(b.vel.mult(b.mass)).div(mass);
        const radius=Math.cbrt(a.radius**3+b.radius**3);
        let type=a.mass>=b.mass?a.type:b.type;
        if(type!=="BLACK_HOLE"&&mass>=3*PhysicsConstants.M_sun)type="BLACK_HOLE";
        else if(type==="PLANET"&&mass>=0.08*PhysicsConstants.M_sun)type="STAR";
        const id="merge-"+((globalThis.crypto&&typeof crypto.randomUUID==="function")?crypto.randomUUID():Date.now().toString(36));
        const m=new PhysicalBody(id,type,mass,radius,pos,vel);
        const keBefore=.5*a.mass*a.vel.magSq()+.5*b.mass*b.vel.magSq(),keAfter=.5*mass*vel.magSq();
        m.internalEnergy=Math.max(0,a.internalEnergy)+Math.max(0,b.internalEnergy)+Math.max(0,keBefore-keAfter);
        m.composition.X=(a.composition.X*a.mass+b.composition.X*b.mass)/mass;
        m.composition.Y=(a.composition.Y*a.mass+b.composition.Y*b.mass)/mass;
        m.composition.Z=(a.composition.Z*a.mass+b.composition.Z*b.mass)/mass;
        m.charge=a.charge+b.charge;
        const IA=(2/5)*a.mass*a.radius*a.radius,IB=(2/5)*b.mass*b.radius*b.radius,IM=(2/5)*mass*radius*radius;
        m.spin=a.spin.mult(IA).add(b.spin.mult(IB)).div(Math.max(IM,Number.MIN_VALUE));
        m.surfaceTemperature=(a.surfaceTemperature*a.mass+b.surfaceTemperature*b.mass)/mass;
        m.temperature=(a.temperature*a.mass+b.temperature*b.mass)/mass;
        m.isotopes={...a.isotopes};
        for(const [k,v] of Object.entries(b.isotopes))m.isotopes[k]=(m.isotopes[k]||0)+v;
        return m;
    },
    checkAndResolve:function(objects){

        computeAccelerations:function(objects){
            const accels=objects.map(()=>new Vec3()),ke=1/(4*Math.PI*PhysicsConstants.eps_0),km=PhysicsConstants.mu_0/(4*Math.PI);

            }
            return accels;
        }
    }

    computeFusion: function(dt, objs) {

            const thermal=1.5*(o.mass/mp)*PhysicsConstants.k_B*Tc;

const QuantumEngine = {
    // Stable Crank-Nicolson time evolution for the 1D TDSE.
    solve1DSchrodinger: function(V_array, dx, dt, steps, particleMass) {
        const N=V_array.length, hbar=PhysicsConstants.h_bar, m=particleMass;
        if(N<3||!(dx>0)||!(dt>0)||!(m>0)) throw new Error("Invalid quantum grid");
        let re=new Float64Array(N), im=new Float64Array(N);
        const x0=N/4, sigma=Math.max(1,N/20);
        let n2=0; for(let i=1;i<N-1;i++){re[i]=Math.exp(-0.5*((i-x0)/sigma)**2);n2+=re[i]**2;}
        const n=Math.sqrt(n2*dx); for(let i=0;i<N;i++)re[i]/=n;
        const A=hbar*hbar/(2*m*dx*dx), alpha=dt/(2*hbar);
        function solve(dr,di,or,oi,rr,ri){
            const n=rr.length, cr=new Float64Array(n-1),ci=new Float64Array(n-1),qr=new Float64Array(n),qi=new Float64Array(n),xr=new Float64Array(n),xi=new Float64Array(n);
            let den=dr[0]**2+di[0]**2; cr[0]=(or[0]*dr[0]+oi[0]*di[0])/den; ci[0]=(oi[0]*dr[0]-or[0]*di[0])/den; qr[0]=(rr[0]*dr[0]+ri[0]*di[0])/den; qi[0]=(ri[0]*dr[0]-rr[0]*di[0])/den;
            for(let i=1;i<n;i++){const ar=or[i-1],ai=oi[i-1],tr=dr[i]-(ar*cr[i-1]-ai*ci[i-1]),ti=di[i]-(ar*ci[i-1]+ai*cr[i-1]),td=tr*tr+ti*ti;if(!(td>0)||!Number.isFinite(td))throw new Error("Quantum linear solve singular");if(i<n-1){cr[i]=(or[i]*tr+oi[i]*ti)/td;ci[i]=(oi[i]*tr-or[i]*ti)/td;}const br=rr[i]-(ar*qr[i-1]-ai*qi[i-1]),bi=ri[i]-(ar*qi[i-1]+ai*qr[i-1]);qr[i]=(br*tr+bi*ti)/td;qi[i]=(bi*tr-br*ti)/td;}
            xr[n-1]=qr[n-1];xi[n-1]=qi[n-1];for(let i=n-2;i>=0;i--){xr[i]=qr[i]-(cr[i]*xr[i+1]-ci[i]*xi[i+1]);xi[i]=qi[i]-(cr[i]*xi[i+1]+ci[i]*xr[i+1]);}return {re:xr,im:xi};
        }
        for(let s=0;s<steps;s++){const n=N-2,dr=new Float64Array(n),di=new Float64Array(n),or=new Float64Array(n-1),oi=new Float64Array(n-1),rr=new Float64Array(n),ri=new Float64Array(n);
            for(let k=0;k<n;k++){const i=k+1,H=V_array[i]+2*A,hr=H*re[i],hi=H*im[i];dr[k]=1;di[k]=alpha*H;if(k<n-1){or[k]=0;oi[k]=alpha*(-A);}if(i>1){hr+=(-A)*re[i-1];hi+=(-A)*im[i-1];}if(i<N-2){hr+=(-A)*re[i+1];hi+=(-A)*im[i+1];}rr[k]=re[i]+alpha*hi;ri[k]=im[i]-alpha*hr;}
            const z=solve(dr,di,or,oi,rr,ri);for(let k=0;k<n;k++){re[k+1]=z.re[k];im[k+1]=z.im[k];}re[0]=im[0]=re[N-1]=im[N-1]=0;}
        let norm=0;for(let i=0;i<N;i++)norm+=(re[i]**2+im[i]**2);norm=Math.sqrt(norm*dx);if(!(norm>0)||!Number.isFinite(norm))throw new Error("Quantum normalization failed");for(let i=0;i<N;i++){re[i]/=norm;im[i]/=norm;}return {re,im,norm};
    }
};
const CosmologyEngine = {
    solveFriedmann:function(H0_si,Omega_m,Omega_r,Omega_lambda,t_end,dt,a_initial,Omega_k=null){
        if(!(H0_si>0)||!(dt>0)||!(t_end>=0)||!(a_initial>0))throw new Error("Invalid Friedmann parameters");
        const Ok=Omega_k===null?1-Omega_m-Omega_r-Omega_lambda:Omega_k;
        let a=a_initial,t=0,history=[];
        const H=x=>{if(!(x>0)||!Number.isFinite(x))throw new Error("Invalid scale factor");const h2=H0_si**2*(Omega_r*x**-4+Omega_m*x**-3+Ok*x**-2+Omega_lambda);if(!(h2>=0)||!Number.isFinite(h2))throw new Error("Invalid H²");return Math.sqrt(h2);};
        const f=x=>x*H(x);
        while(t<t_end){
            history.push({t,a});
            const h=Math.min(dt,t_end-t,0.02/Math.max(H(a),Number.MIN_VALUE));
            const k1=f(a),k2=f(a+h*k1/2),k3=f(a+h*k2/2),k4=f(a+h*k3);
            a+=h*(k1+2*k2+2*k3+k4)/6;t+=h;
            if(!Number.isFinite(a)||a<=0)throw new Error("Friedmann integration diverged");
        }
        history.push({t,a});return history;
    }
};

const Integrators = {
        eulerSemiImplicit: function(objects, dt, accels) {
            for(let i=0; i<objects.length; i++) {
                objects[i].vel = objects[i].vel.add(accels[i].mult(dt));
                objects[i].pos = objects[i].pos.add(objects[i].vel.mult(dt));
                objects[i].acc = accels[i];
            }
        },
        verlet: function(objects, dt, getAccelsFn) {
            // Velocity Verlet: r(t+dt) = r(t) + v(t)dt + 0.5*a(t)dt^2
            // v(t+dt) = v(t) + 0.5*(a(t) + a(t+dt))dt
            for(let i=0; i<objects.length; i++) {
                objects[i].pos = objects[i].pos.add(objects[i].vel.mult(dt)).add(objects[i].acc.mult(0.5 * dt * dt));
            }
            let newAccels = getAccelsFn(objects);
            for(let i=0; i<objects.length; i++) {
                objects[i].vel = objects[i].vel.add((objects[i].acc.add(newAccels[i])).mult(0.5 * dt));
                objects[i].acc = newAccels[i];
            }
        },
        rk4: function(objects, dt, getAccelsFn) {
            let clones = objects.map(o => o.clone());
            let k1_v = getAccelsFn(clones); let k1_x = clones.map(o => o.vel.clone());
            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k1_x[i].mult(0.5*dt)); clones[i].vel = objects[i].vel.add(k1_v[i].mult(0.5*dt)); }

            let k2_v = getAccelsFn(clones); let k2_x = clones.map(o => o.vel.clone());
            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k2_x[i].mult(0.5*dt)); clones[i].vel = objects[i].vel.add(k2_v[i].mult(0.5*dt)); }

            let k3_v = getAccelsFn(clones); let k3_x = clones.map(o => o.vel.clone());
            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k3_x[i].mult(dt)); clones[i].vel = objects[i].vel.add(k3_v[i].mult(dt)); }

            let k4_v = getAccelsFn(clones); let k4_x = clones.map(o => o.vel.clone());
            for(let i=0; i<objects.length; i++) {
                objects[i].pos = objects[i].pos.add( (k1_x[i].add(k2_x[i].mult(2)).add(k3_x[i].mult(2)).add(k4_x[i])).mult(dt/6) );
                objects[i].vel = objects[i].vel.add( (k1_v[i].add(k2_v[i].mult(2)).add(k3_v[i].mult(2)).add(k4_v[i])).mult(dt/6) );
                objects[i].acc = k1_v[i];
            }
        }
    }

const Diagnostics = {
        initEnergy: null,
        getKineticEnergy: function(objects) { return objects.reduce((sum, o) => sum + 0.5 * o.mass * o.vel.magSq(), 0); },
        getPotentialEnergy:function(objects){
            let u=0;for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){const r=objects[i].pos.sub(objects[j].pos).mag();if(r>0)u-=PhysicsConstants.G*objects[i].mass*objects[j].mass/r;}return u;
        },
        getCoulombEnergy:function(objects){
            let u=0,k=1/(4*Math.PI*PhysicsConstants.eps_0);
            for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){const r=objects[i].pos.sub(objects[j].pos).mag();if(r>0&&objects[i].charge!==0&&objects[j].charge!==0)u+=k*objects[i].charge*objects[j].charge/r;}return u;
        },
        getInternalEnergy:function(objects){return objects.reduce((s,o)=>s+Math.max(0,Number.isFinite(o.internalEnergy)?o.internalEnergy:0),0);},
        getTotalMomentum: function(objects) { return objects.reduce((sum, o) => sum.add(o.vel.mult(o.mass)), new Vec3()); },
        update: function(objects) {
            let totalE=this.getKineticEnergy(objects)+this.getPotentialEnergy(objects)+this.getCoulombEnergy(objects)+this.getInternalEnergy(objects)+(typeof Engine!=="undefined"?Engine.radiatedEnergy:0);
            let mom = this.getTotalMomentum(objects);
            if (this.initEnergy === null && objects.length > 0) this.initEnergy = totalE;
            const denom = Math.max(Math.abs(this.initEnergy ?? 0), Number.MIN_VALUE);
            let eErr = this.initEnergy !== null ? Math.abs((totalE-this.initEnergy)/denom)*100 : 0;

            document.getElementById('diag-energy').innerText = totalE.toExponential(3) + " J";
            document.getElementById('diag-e-err').innerText = eErr.toFixed(6) + " %";
            document.getElementById('diag-mom').innerText = mom.mag().toExponential(3);

            let statusEl = document.getElementById('diag-status');
            if(!Number.isFinite(totalE) || !Number.isFinite(eErr) || eErr > 100) { statusEl.innerText = "FAIL (발산)"; statusEl.className = "val fail"; Engine.status = "FAILED"; }
            else if(eErr > 1) { statusEl.innerText = "WARNING (경고)"; statusEl.className = "val warn"; }
            else { statusEl.innerText = "STABLE (안정)"; statusEl.className = "val pass"; }
        }
    }

                info = "1차원 양자 역학 (슈뢰딩거 방정식). 100 스텝 유한차분법(FD) 시뮬레이션 완료.";
                let V = new Float32Array(100).fill(0); V[50] = 100;
                let m_e = 9.109e-31;
                let q_res = QuantumEngine.solve1DSchrodinger(V, 0.1, 0.01, 100, m_e);
                info += `<br><br>[QUANTUM STATE]<br>Wavepacket Normalized Integration Complete.<br>Max Probability Amplitude: ${Math.max(...q_res.re).toExponential(3)}`;
            }
            else if(labName === 'COSMOLOGY') {
                info = "빅뱅 팽창 (프리드만 우주론). 척도 인자 a(t) 진화 확인 완료.";

                // H0 = 70 km/s/Mpc must be converted to s^-1.
                // We use the centralized PhysicsConstants.H0_s value.
                let history = CosmologyEngine.solveFriedmann(PhysicsConstants.H0_s, 0.3, 0.0, 0.7, PhysicsConstants.yr * 1e9, PhysicsConstants.yr * 1e7, 0.1);
                Diagnostics.cosmologyHistory = history;
                let lastScale = history[history.length-1].a;
                info += `<br><br>[COSMOLOGY STATE]<br>1B Years Integration Complete.<br>Scale Factor a(t=1Byr): ${lastScale.toFixed(4)}`;

            }

            let ins = document.getElementById('inspector-data');
            if(ins) {
                ins.innerHTML = `<b>모듈: ${labName}</b><br><p>${info}</p>
                <br><i>활성 엔진(Active Engines):</i><br> ${Engine.activeModels.join('<br>')}`;
            }
            document.getElementById('sys-dt').value = Engine.dt;
        }
    }

const Renderer = {
        canvas: null, ctx: null, cameraRot: {x: 0, y: 0}, cameraPan: {x: 0, y: 0}, scale: 1e-9,
        isDragging: false, isPanDragging: false, lastMouse: {x: 0, y: 0}, activePointers:new Map(), pinchDistance:0,

        init: function() {
            this.canvas = document.getElementById('universe-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());

            // Map global camera values structurally instead of loosely
            camera.rot = this.cameraRot;
            camera.pan = this.cameraPan;

            // Tap selects; drag rotates. Pointer capture keeps iOS interactions deterministic.
            this.canvas.addEventListener('pointerdown',(e)=>{this.activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(this.activePointers.size===2){const p=[...this.activePointers.values()];this.pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);this.dragMoved=true;return;}this.isDragging=true;this.dragMoved=false;this.pointerId=e.pointerId;this.lastMouse={x:e.clientX,y:e.clientY};this.downPoint={x:e.clientX,y:e.clientY};this.canvas.setPointerCapture(e.pointerId);});
            this.canvas.addEventListener('pointermove',(e)=>{if(this.activePointers.has(e.pointerId))this.activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(this.activePointers.size===2){const p=[...this.activePointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(this.pinchDistance>0)this.scale*=Math.min(1.25,Math.max(.8,d/this.pinchDistance));this.pinchDistance=d;return;}if(!this.isDragging||e.pointerId!==this.pointerId)return;const dx=e.clientX-this.lastMouse.x,dy=e.clientY-this.lastMouse.y;if(Math.hypot(e.clientX-this.downPoint.x,e.clientY-this.downPoint.y)>6)this.dragMoved=true;this.cameraRot.y+=dx*0.01;this.cameraRot.x+=dy*0.01;this.lastMouse={x:e.clientX,y:e.clientY};});
            this.canvas.addEventListener('pointerup',(e)=>{const wasSingle=this.activePointers.size===1&&e.pointerId===this.pointerId;if(wasSingle&&!this.dragMoved)UI.selectAtScreen(e.clientX,e.clientY);this.activePointers.delete(e.pointerId);this.pinchDistance=0;this.isDragging=false;try{this.canvas.releasePointerCapture(e.pointerId);}catch(err){}});
            this.canvas.addEventListener('pointercancel',(e)=>{this.activePointers.delete(e.pointerId);this.isDragging=false;this.pinchDistance=0;});
            this.canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                this.scale = Math.min(1e-2,Math.max(1e-18,this.scale*(e.deltaY>0?0.9:1.1)));
            }, {passive: false});

            let lastTap = 0;
            this.canvas.addEventListener('dblclick', (e) => {
                if (e.target !== this.canvas) return;
                UI.createObject();
            });
            this.canvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length !== 1) return;
                const now = performance.now();
                if (now - lastTap < 280) {
                    e.preventDefault();
                    UI.createObject();
                    lastTap = 0;
                } else lastTap = now;
            }, {passive:false});
        },
        resize: function() {
            const r = this.canvas.parentElement.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            this.canvas.width = Math.max(1, Math.round(r.width * dpr));
            this.canvas.height = Math.max(1, Math.round(r.height * dpr));
            this.canvas.style.width = r.width + 'px';
            this.canvas.style.height = r.height + 'px';
            this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        },
        projectObjects:function(){const w=this.canvas.clientWidth||1,h=this.canvas.clientHeight||1,cx=w/2+this.cameraPan.x,cy=h/2+this.cameraPan.y,sx=Math.sin(this.cameraRot.x),cxr=Math.cos(this.cameraRot.x),sy=Math.sin(this.cameraRot.y),cyr=Math.cos(this.cameraRot.y);return Engine.objects.map(o=>{const x1=o.pos.x*cyr-o.pos.z*sy,z1=o.pos.z*cyr+o.pos.x*sy,y2=o.pos.y*cxr-z1*sx,z2=z1*cxr+o.pos.y*sx;return {obj:o,px:cx+x1*this.scale,py:cy+y2*this.scale,pz:z2,pr:Math.max(1.5,o.radius*this.scale)};});},
        draw: function() {
            this.ctx.fillStyle = "#000";
            const cssW = this.canvas.clientWidth || (this.canvas.width / (window.devicePixelRatio || 1));
            const cssH = this.canvas.clientHeight || (this.canvas.height / (window.devicePixelRatio || 1));
            this.ctx.fillRect(0, 0, cssW, cssH);
            let cx = (this.canvas.clientWidth || this.canvas.width) / 2 + this.cameraPan.x;
            let cy = (this.canvas.clientHeight || this.canvas.height) / 2 + this.cameraPan.y;
            let sinX = Math.sin(this.cameraRot.x), cosX = Math.cos(this.cameraRot.x);
            let sinY = Math.sin(this.cameraRot.y), cosY = Math.cos(this.cameraRot.y);

            let projObjs=this.projectObjects();projObjs.sort((a,b)=>a.pz-b.pz);

            for(let p of projObjs) {
                this.ctx.beginPath();
                this.ctx.arc(p.px, p.py, p.pr, 0, Math.PI*2);
                if(p.obj.type === "STAR") this.ctx.fillStyle = "#facc15";
                else if(p.obj.type === "PLANET") this.ctx.fillStyle = "#0ea5e9";
                else if(p.obj.type === "BLACK_HOLE") { this.ctx.fillStyle = "#000"; this.ctx.strokeStyle="#fff"; this.ctx.stroke(); }
                else if(p.obj.type === "GAS_CLOUD") this.ctx.fillStyle = "rgba(16, 185, 129, 0.5)";
                else this.ctx.fillStyle = "#aaa";
                this.ctx.fill();
                if(p.obj.id===UI.selectedId){this.ctx.beginPath();this.ctx.arc(p.px,p.py,p.pr+4,0,Math.PI*2);this.ctx.strokeStyle="#fff";this.ctx.lineWidth=2;this.ctx.stroke();}
            }
        }
    }

const UI = {
        selectedId:null,
        selectAtScreen:function(x,y){const r=Renderer.canvas.getBoundingClientRect(),sx=x-r.left,sy=y-r.top;const hit=Renderer.projectObjects().filter(p=>Math.hypot(p.px-sx,p.py-sy)<=Math.max(10,p.pr*1.5)).sort((a,b)=>b.pz-a.pz)[0];this.selectedId=hit?hit.obj.id:null;this.updateInspector();},
        init: function() {
            const tabs = [
                ['GRAVITY','중력/궤도'], ['MULTISTAR','다중항성'], ['GALAXY','은하'], ['BLACKHOLE','블랙홀/1PN'],
                ['SPH_FLUID','유체/SPH'], ['ELECTROMAGNETIC','전자기'], ['NUCLEAR','항성/핵'], ['QUANTUM','양자'], ['COSMOLOGY','우주론']
            ];
            const bar = document.getElementById('module-bar');
            bar.innerHTML = '';
            for (const [id,label] of tabs) {
                const b = document.createElement('button');
                b.id = 'btn-lab-' + id;
                b.className = 'lab-btn';
                b.type = 'button';
                b.textContent = label;
                b.addEventListener('click', () => Labs.loadLab(id));
                bar.appendChild(b);
            }
            const creatorBtn = document.getElementById('btn-creator-panel');
            const inspectorBtn = document.getElementById('btn-inspector-panel');
            const toggle = (id) => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('mobile-open');
            };
            if (creatorBtn) creatorBtn.addEventListener('click', () => toggle('creator-panel'));
            if (inspectorBtn) inspectorBtn.addEventListener('click', () => toggle('inspector-panel'));
            const closeAudit = document.getElementById('btn-close-audit');
            if (closeAudit) closeAudit.addEventListener('click', () => {
                document.getElementById('validation-modal').style.display = 'none';
            });
            document.getElementById('validation-modal').addEventListener('click', (e) => {
                if (e.target.id === 'validation-modal') e.currentTarget.style.display = 'none';
            });
            // Each control owns exactly one listener; no document-level duplicate dispatch.
        },
        createObject: function(screenX=null,screenY=null) {
            const type=document.getElementById('type').value;
            const mass=Number(document.getElementById('mass').value),rad=Number(document.getElementById('radius').value);
            const vx=Number(document.getElementById('vel_x').value),vy=Number(document.getElementById('vel_y').value),vz=Number(document.getElementById('vel_z').value);
            if(!Number.isFinite(mass)||mass<=0||!Number.isFinite(rad)||rad<=0||![vx,vy,vz].every(Number.isFinite)){this.setMessage("생성 실패: 유한한 SI 값이 필요합니다.","danger");return false;}
            const vel=new Vec3(vx,vy,vz);if(vel.magSq()>=PhysicsConstants.c**2){this.setMessage("생성 실패: 광속 이상 속도입니다.","danger");return false;}
            const d=1e8;
            let pos;
            if(Number.isFinite(screenX)&&Number.isFinite(screenY)){
                const r=Renderer.canvas.getBoundingClientRect(),sx=(screenX-r.left-(Renderer.canvas.clientWidth/2+Renderer.cameraPan.x))/Renderer.scale,sy=(screenY-r.top-(Renderer.canvas.clientHeight/2+Renderer.cameraPan.y))/Renderer.scale;
                const x=sx,y=sy,z=-d,cy=Math.cos(Renderer.cameraRot.y),syaw=Math.sin(Renderer.cameraRot.y),cx=Math.cos(Renderer.cameraRot.x),sxaw=Math.sin(Renderer.cameraRot.x);
                const z1=z*cx-sy*sxaw,posX=x*cy+z1*syaw,posZ=-x*syaw+z1*cy,posY=sy*cx+z*sxaw;
                pos=new Vec3(posX,posY,posZ);
            }else{
                pos=new Vec3(d*Math.sin(camera.rot.y),d*Math.sin(-camera.rot.x),-d*Math.cos(camera.rot.y));
            }
            const id=(globalThis.crypto&&typeof crypto.randomUUID==='function')?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
            const body=new PhysicalBody('body-'+id,type,mass,rad,pos,vel);
            if(type==='STAR'){body.temperature=1.57e7;body.surfaceTemperature=5778;}
            if(type==='BLACK_HOLE'){body.radius=2*PhysicsConstants.G*mass/(PhysicsConstants.c**2);body.updateDensity();body.temperature=BlackHoleThermodynamics.hawkingTemperature(mass);body.surfaceTemperature=body.temperature;body.luminosity=BlackHoleThermodynamics.hawkingPower(mass);}
            if(type==='GAS_CLOUD'){body.temperature=100;const mu=0.61,mp=1.67262192369e-27;body.internalEnergy=1.5*(mass/(mu*mp))*PhysicsConstants.k_B*body.temperature;}
            Engine.objects.push(body);Diagnostics.initEnergy=null;this.updateInspector();return true;
        },
        setMessage: function(message,kind="info"){const el=document.getElementById('inspector-data');if(el)el.insertAdjacentHTML('afterbegin',`<div class="sys-message ${kind}">${message}</div>`);},
        updateInspector: function() {
            let ins = document.getElementById('inspector-data');
            if(Engine.objects.length === 0) {
                ins.innerHTML = "선택된 객체 없음";
                return;
            }
            let o = Engine.objects[Engine.objects.length - 1]; // just show last created
            ins.innerHTML = `<b>Target: ${o.id} (${o.type})</b><br>
            Mass: ${o.mass.toExponential(3)} kg<br>
            Radius: ${o.radius.toExponential(3)} m<br>
            Temperature: ${(Number.isFinite(o.temperature)?o.temperature:0).toExponential(3)} K<br>
            Luminosity: ${(Number.isFinite(o.luminosity)?o.luminosity:0).toExponential(3)} W`;
        },
        showAudit: function() {
            let results = Validator.runAllTests(true);
            if(!results) results = [];
            let html = "<h4>과학적 검증 프레임워크 결과 (Validation Results)</h4><ul style='list-style:none; padding:0;'>";
            let allPass = true;
            for(let r of results) {
                let isPass = r.status === 'PASS';
                let isWarn = r.status === 'WARNING';
                let tag = isPass ? "<span style='color:#10b981; font-weight:bold;'>[PASS]</span>" :
                         (isWarn ? "<span style='color:#f59e0b; font-weight:bold;'>[WARNING]</span>" : "<span style='color:#ef4444; font-weight:bold;'>[FAIL]</span>");
                if(!isPass && r.status !== 'NOT APPLICABLE') allPass = false;

                html += `<li style='margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:4px;'>
                    ${tag} <b>${r.name}</b><br>
                    <span style='font-size:11px; color:#aaa;'>오차율(Error): ${(r.error*100).toExponential(2)}% | 임계값(Tol): ${r.tolerance}</span>
                </li>`;
            }
            html += "</ul>";
            if(allPass && results.length > 0) html += "<div style='color:#10b981; margin-top:10px;'>모든 현재 검증 항목을 통과했습니다. (자동 검증 결과)</div>";
            else html += "<div style='color:#f59e0b; margin-top:10px;'>시스템이 불완전하거나 검증 중입니다. (INCOMPLETE)</div>";

            document.getElementById('validation-results').innerHTML = html;
            document.getElementById('validation-modal').style.display = 'block';
        }
    }

const Engine = {
        objects: [], time: 0, dt: 120, integratorType: "RK4", gravityAlgorithm: "BARNES_HUT", radiatedEnergy:0,
        status: "STABLE", paused: false, frames: 0, lastFpsTime: 0, lastUiUpdate: 0,
        activeModels: ["Gravity", "Collision", "Thermodynamics"],

        setIntegrator: function(type) { this.integratorType = String(type).toLowerCase(); },
        setDt: function(value) {
            const v = Number(value);
            if (!Number.isFinite(v) || v <= 0) return false;
            this.dt = v;
            return true;
        },

        getAccelerations: function(objs) {
            let accels = new Array(objs.length).fill(null).map(() => new Vec3());

            if(this.activeModels.includes("Gravity")) {
                let gravAcc = GravityEngine.computeAccelerations(objs, this.gravityAlgorithm === "BARNES_HUT");
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(gravAcc[i]);
            }
            if(this.activeModels.includes("Relativity")) {
                let grAcc = RelativityEngine.computeSchwarzschildPrecession(objs);
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(grAcc[i]);
            }
            if(this.activeModels.includes("Electromagnetic")) {
                let emAcc=ElectromagneticEngine.computeAccelerations(objs);
                for(let i=0;i<objs.length;i++) accels[i]=accels[i].add(emAcc[i]);
            }
            if(this.activeModels.includes("Fluid")){
                const fl=FluidEngine.computeAccelerations(objs);
                for(let i=0;i<objs.length;i++){const a=fl.get(objs[i]);if(a)accels[i]=accels[i].add(a);}
            }
            return accels;
        },

        step: function() {
            if(this.status === "FAILED") return;

            // Resolve contacts already present before evaluating a singular/near-singular force.
            CollisionEngine.checkAndResolve(this.objects);
            // Hard numerical validity gate.
            for(const o of this.objects){
                const finite=[o.mass,o.radius,o.pos.x,o.pos.y,o.pos.z,o.vel.x,o.vel.y,o.vel.z,o.acc.x,o.acc.y,o.acc.z].every(Number.isFinite);
                if(!finite||!(o.mass>0)||!(o.radius>0)){this.status="FAILED";throw new Error("Non-finite or invalid body state");}
                if(o.vel.magSq()>=PhysicsConstants.c**2){this.status="FAILED";throw new Error("Superluminal velocity detected");}
            }

            if (!Number.isFinite(this.dt) || this.dt <= 0) { this.status="FAILED"; throw new Error("Invalid simulation timestep"); }
            let t_integrator = this.integratorType.toLowerCase();
            if(t_integrator === "euler") {
                Integrators.eulerSemiImplicit(this.objects, this.dt, this.getAccelerations(this.objects));
            } else if(t_integrator === "verlet") {
                Integrators.verlet(this.objects, this.dt, (obs)=>this.getAccelerations(obs));
            } else if(t_integrator === "rk4") {
                Integrators.rk4(this.objects, this.dt, (obs)=>this.getAccelerations(obs));
            }


            if(this.activeModels.includes("Nuclear")) NuclearEngine.computeFusion(this.dt, this.objects);
            if(this.activeModels.includes("Fluid")) FluidEngine.updateInternalEnergy(this.objects,this.dt);
            if(this.activeModels.includes("Collision")) CollisionEngine.checkAndResolve(this.objects);

            // Thermodynamics and Radiation processing
            if(this.activeModels.includes("Thermodynamics")) {
                ThermoEngine.updateTemperature(this.objects);
                ThermoEngine.computeRadiation(this.dt, this.objects);
            }

            this.time += this.dt;
            Diagnostics.update(this.objects);
            const nowUi=performance.now();
            if(nowUi-this.lastUiUpdate>=125){this.lastUiUpdate=nowUi;UI.updateInspector();}
        },

        togglePause: function() {
            this.paused = !this.paused;
            const b = document.getElementById('btn-pause');
            if (b) {
                b.textContent = this.paused ? "재개 (RESUME)" : "일시정지 (PAUSE)";
                b.setAttribute('aria-pressed', String(this.paused));
            }
        },

        loop: function() {
            requestAnimationFrame(() => this.loop());
            let now = performance.now(); this.frames++;
            if(now - this.lastFpsTime >= 1000) { this.frames = 0; this.lastFpsTime = now; } // FPS tracking decoupled from DOM

            if(!this.paused) {
                const substeps = 1;
                for(let i=0;i<substeps;i++){
                    try {
                        this.step();
                    } catch(err) {
                        this.status="FAILED";
                        this.paused=true;
                        const msg=err&&err.message?err.message:String(err);
                        const statusEl=document.getElementById('diag-status');
                        if(statusEl){statusEl.textContent="FAILED (계산 중단)";statusEl.className="val fail";}
                        if(window.UI&&UI.setMessage)UI.setMessage("수치 계산 중단: "+msg,"danger");
                        break;
                    }
                    if(this.status==="FAILED")break;
                }
            }
            Renderer.draw();
        }
    }



function bindControls() {
    const dt = document.getElementById('sys-dt');
    const integrator = document.getElementById('integrator');
    const gravity = document.getElementById('sys-gravity');
    const pause = document.getElementById('btn-pause');
    const audit = document.getElementById('btn-audit');
    const create = document.getElementById('btn-create');
    if (dt) dt.addEventListener('change', () => { if (!Engine.setDt(dt.value)) dt.value = Engine.dt; });
    if (integrator) integrator.addEventListener('change', () => Engine.setIntegrator(integrator.value));
    if (gravity) gravity.addEventListener('change', () => Engine.gravityAlgorithm = gravity.value);
    if (pause) pause.addEventListener('click', () => Engine.togglePause());
    if (audit) audit.addEventListener('click', () => UI.showAudit());
    if (create) create.addEventListener('click', () => UI.createObject());
    if (pause) pause.setAttribute('aria-pressed','false');
}

window.addEventListener('load', () => {
    UI.init();
    Renderer.init();
    bindControls();
    Labs.loadLab('GRAVITY');
    Engine.loop();
});
