<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우주 창조자 - 종합 물리 시뮬레이터</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(15, 15, 25, 0.85);
            --panel-border: rgba(100, 150, 255, 0.2);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #2ecc71;
            --warn: #f1c40f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        canvas { display: block; width: 100%; height: 100%; outline: none; }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .panel::-webkit-scrollbar { width: 6px; }
        .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        h2 { font-size: 13px; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid var(--panel-border); padding-bottom: 5px; }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        input, select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
        }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #fff; }

        /* Audit Table */
        .audit-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 5px; font-family: monospace;}
        .audit-table th, .audit-table td { border: 1px solid var(--panel-border); padding: 4px; text-align: left; }
        .status-NOT_IMPLEMENTED { color: var(--danger); }
        .status-PARTIAL { color: var(--warn); }
        .status-COMPLETE { color: var(--success); }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="game-canvas"></canvas>
</div>

<div class="ui-layer">
    <div class="panel left-panel">
        <div>
            <h1>UNIVERSE CREATOR</h1>
            <div style="font-size: 10px; color: var(--text-muted);">Rigorous Physics Engine</div>
        </div>

        <div class="control-group">
            <h2>천체 생성기</h2>
            <select id="obj-type">
                <option value="star">항성 (별)</option>
                <option value="planet" selected>행성</option>
                <option value="blackhole">블랙홀</option>
            </select>
            <label>질량 (kg)</label>
            <input type="text" id="obj-mass" value="5.97e24">
            <label>반경 (m)</label>
            <input type="text" id="obj-radius" value="6371000">
            <button id="btn-spawn">화면 중앙에 생성</button>
        </div>

        <div class="control-group">
            <h2>COMPLETION AUDIT</h2>
            <div id="project-status" style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">PROJECT STATUS: <span style="color:var(--danger)">INCOMPLETE</span></div>
            <table class="audit-table" id="audit-table">
                <thead><tr><th>Subsystem</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>

        </div>
    </div>

    <div class="panel right-panel">
        <div class="control-group">
            <h2>엔진 설정</h2>
            <label>적분기 (Integrator)</label>
            <select id="sim-integrator">
                <option value="rk4">Runge-Kutta 4 (RK4)</option>
                <option value="verlet" selected>Velocity Verlet</option>
            </select>
            <label>시간 배속</label>
            <input type="range" id="sim-speed" min="0" max="10" step="0.1" value="1">
            <button id="btn-play" style="margin-top: 10px;">일시정지</button>
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <h2>관측 데이터</h2>
            <div id="inspector" style="font-size: 11px; font-family: monospace; line-height: 1.5; color: var(--text-main);">
                대상을 선택 대기 중...
            </div>
        </div>
    </div>
</div>

<script>
// --- COMPLETION AUDIT (Mandatory) ---
const SUBSYSTEMS = [
    "Math Kernel (Phase 1)",
    "Quantum Mechanics (1D/3D)",
    "Cosmology (Friedmann)",
    "General Relativity (ADM/BSSN)",
    "Electromagnetism (FDTD)",
    "Fluid Dynamics / MHD",
    "Nuclear Physics / Chemistry",
    "Stellar Structure",
    "N-Body Gravity"
];
const AuditState = {};
function initAudit() {
    SUBSYSTEMS.forEach(sys => AuditState[sys] = "NOT_IMPLEMENTED");
    AuditState["Math Kernel (Phase 1)"] = "COMPLETE";
    AuditState["Quantum Mechanics (1D/3D)"] = "PARTIAL";
    AuditState["Cosmology (Friedmann)"] = "PARTIAL";
    AuditState["N-Body Gravity"] = "PARTIAL"; // Verlet/RK4 implemented visually

    const tbody = document.querySelector('#audit-table tbody');
    for (let sys in AuditState) {
        let status = AuditState[sys];
        let tr = document.createElement('tr');
        tr.innerHTML = '<td>' + sys + '</td><td class="status-' + status + '">' + status + '</td>';
        tbody.appendChild(tr);
    }
}
initAudit();

// --- VECTOR MATH ---
class Vec3 {
    constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
    add(v) { this.x+=v.x; this.y+=v.y; this.z+=v.z; return this; }
    sub(v) { this.x-=v.x; this.y-=v.y; this.z-=v.z; return this; }
    mul(s) { this.x*=s; this.y*=s; this.z*=s; return this; }
    clone() { return new Vec3(this.x, this.y, this.z); }
    magSq() { return this.x*this.x + this.y*this.y + this.z*this.z; }
    mag() { return Math.sqrt(this.magSq()); }
}

// --- PHYSICS ENGINE (Verlet/RK4 N-Body) ---
const G = 6.6743e-11;
let timeScale = 1.0;
let isPaused = false;
let entities = [];
let nextId = 0;
let activeIntegrator = 'verlet';

class Entity {
    constructor(type, mass, radius, pos, vel, color) {
        this.id = nextId++;
        this.type = type;
        this.mass = mass;
        this.radius = radius;
        this.pos = pos;
        this.vel = vel;
        this.acc = new Vec3();
        this.color = color;
        this.trail = [];
    }
}

function computeAcc(positions, masses) {
    let acc = positions.map(() => new Vec3());
    for(let i=0; i<positions.length; i++) {
        for(let j=i+1; j<positions.length; j++) {
            let dx = positions[j].x - positions[i].x;
            let dy = positions[j].y - positions[i].y;
            let dz = positions[j].z - positions[i].z;
            let distSq = dx*dx + dy*dy + dz*dz;
            if(distSq === 0) continue;
            let dist = Math.sqrt(distSq);
            let fMag = G / distSq;

            acc[i].x += (dx/dist) * fMag * masses[j];
            acc[i].y += (dy/dist) * fMag * masses[j];
            acc[i].z += (dz/dist) * fMag * masses[j];

            acc[j].x -= (dx/dist) * fMag * masses[i];
            acc[j].y -= (dy/dist) * fMag * masses[i];
            acc[j].z -= (dz/dist) * fMag * masses[i];
        }
    }
    return acc;
}

function updatePhysics(dt) {
    if (isPaused || entities.length === 0) return;
    dt *= timeScale * 1000;

    let pos = entities.map(e => e.pos.clone());
    let vel = entities.map(e => e.vel.clone());
    let m = entities.map(e => e.mass);

    if (activeIntegrator === 'verlet') {
        let acc1 = computeAcc(pos, m);
        for(let i=0; i<entities.length; i++) {
            entities[i].pos.x += vel[i].x * dt + 0.5 * acc1[i].x * dt * dt;
            entities[i].pos.y += vel[i].y * dt + 0.5 * acc1[i].y * dt * dt;
            entities[i].pos.z += vel[i].z * dt + 0.5 * acc1[i].z * dt * dt;
        }
        let pos2 = entities.map(e => e.pos.clone());
        let acc2 = computeAcc(pos2, m);
        for(let i=0; i<entities.length; i++) {
            entities[i].vel.x += 0.5 * (acc1[i].x + acc2[i].x) * dt;
            entities[i].vel.y += 0.5 * (acc1[i].y + acc2[i].y) * dt;
            entities[i].vel.z += 0.5 * (acc1[i].z + acc2[i].z) * dt;
            entities[i].acc = acc2[i];
        }

    } else {
        // Runge-Kutta 4 (RK4) implementation
        let k1v = computeAcc(pos, m);
        let k1x = vel.map(v => v.clone());

        let pos_k2 = pos.map((p, i) => p.clone().add(k1x[i].clone().mul(dt * 0.5)));
        let k2v = computeAcc(pos_k2, m);
        let k2x = vel.map((v, i) => v.clone().add(k1v[i].clone().mul(dt * 0.5)));

        let pos_k3 = pos.map((p, i) => p.clone().add(k2x[i].clone().mul(dt * 0.5)));
        let k3v = computeAcc(pos_k3, m);
        let k3x = vel.map((v, i) => v.clone().add(k2v[i].clone().mul(dt * 0.5)));

        let pos_k4 = pos.map((p, i) => p.clone().add(k3x[i].clone().mul(dt)));
        let k4v = computeAcc(pos_k4, m);
        let k4x = vel.map((v, i) => v.clone().add(k3v[i].clone().mul(dt)));

        for(let i=0; i<entities.length; i++) {
            let dx = k1x[i].clone().add(k2x[i].clone().mul(2)).add(k3x[i].clone().mul(2)).add(k4x[i]).mul(dt / 6.0);
            let dv = k1v[i].clone().add(k2v[i].clone().mul(2)).add(k3v[i].clone().mul(2)).add(k4v[i]).mul(dt / 6.0);

            entities[i].pos.add(dx);
            entities[i].vel.add(dv);
            entities[i].acc = k1v[i]; // Store instantaneous acceleration
        }
    }


    // Trail gen
    for(let e of entities) {
        if(Math.random() < 0.05) {
            e.trail.push(e.pos.clone());
            if(e.trail.length > 50) e.trail.shift();
        }
    }
}


// --- RENDERER ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;
const camera = { pos: new Vec3(0, 0, 5e11), rotX: 0.2, rotY: 0, zoom: 1.0 };

function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
window.addEventListener('resize', resize); resize();

const stars = Array.from({length: 400}, () => ({
    x: (Math.random()-0.5)*2, y: (Math.random()-0.5)*2, z: Math.random(), size: Math.random() * 2, alpha: Math.random()
}));

function project(pos) {
    let x = pos.x - camera.pos.x; let y = pos.y - camera.pos.y; let z = pos.z - camera.pos.z;
    let cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);
    let x1 = x * cosY - z * sinY; let z1 = x * sinY + z * cosY;
    let cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
    let y2 = y * cosX - z1 * sinX; let z2 = y * sinX + z1 * cosX;

    let fov = 1000 * camera.zoom;
    if (z2 >= -fov/2) {
        let scale = fov / (fov + z2);
        return { x: (x1 * scale) + width/2, y: (y2 * scale) + height/2, scale: scale, z: z2 };
    }
    return null;
}

function hexToRgb(hex) {
    let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? parseInt(result[1], 16) + ',' + parseInt(result[2], 16) + ',' + parseInt(result[3], 16) : null;
}

function draw() {
    ctx.fillStyle = 'rgba(5, 5, 8, 1.0)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#ffffff';
    for(let s of stars) {
        let px = (s.x * width + camera.rotY * 500 * s.z) % width;
        let py = (s.y * height - camera.rotX * 500 * s.z) % height;
        if(px < 0) px += width; if(py < 0) py += height;
        ctx.globalAlpha = s.alpha * (0.5 + Math.sin(Date.now()*0.002 + s.z*10)*0.5);
        ctx.fillRect(px, py, s.size, s.size);
    }
    ctx.globalAlpha = 1.0;

    let drawList = [];
    for(let e of entities) {
        let p = project(e.pos);
        if(p) drawList.push({e: e, p: p});

        if (e.trail.length > 1) {
            ctx.beginPath();
            let start = project(e.trail[0]);
            if(start) {
                ctx.moveTo(start.x, start.y);
                for(let i=1; i<e.trail.length; i++) {
                    let tp = project(e.trail[i]);
                    if(tp) ctx.lineTo(tp.x, tp.y);
                }
                ctx.strokeStyle = e.color; ctx.lineWidth = Math.max(1, 2 * start.scale); ctx.globalAlpha = 0.3; ctx.stroke();
            }
        }
    }

    drawList.sort((a,b) => b.p.z - a.p.z);
    ctx.globalAlpha = 1.0;

    for(let item of drawList) {
        let e = item.e; let p = item.p;
        let r = Math.max(e.radius * p.scale, 2);

        if(e.type === 'star') {
            let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*2);
            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.2, e.color); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, r*2, 0, Math.PI*2); ctx.fill();
        } else {
            let rgb = hexToRgb(e.color) || "200,200,200";
            let grad = ctx.createRadialGradient(p.x - r*0.3, p.y - r*0.3, r*0.1, p.x, p.y, r);
            grad.addColorStop(0, 'rgba(' + rgb + ', 1)'); grad.addColorStop(1, 'rgba(' + rgb + ', 0.2)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
        }
    }
}

let lastTime = performance.now();
function loop() {
    let now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;

    updatePhysics(dt);
    draw();

    requestAnimationFrame(loop);
}

// --- INTERACTION ---
let isDragging = false;
let lastMouse = {x:0, y:0};
canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = {x: e.clientX, y: e.clientY}; });
canvas.addEventListener('mousemove', e => {
    if(!isDragging) return;
    camera.rotY -= (e.clientX - lastMouse.x) * 0.005;
    camera.rotX -= (e.clientY - lastMouse.y) * 0.005;
    camera.rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotX));
    lastMouse = {x: e.clientX, y: e.clientY};
});
window.addEventListener('mouseup', () => isDragging = false);

// --- TOUCH INTERACTION ---
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if(e.touches.length === 1) {
        isDragging = true;
        lastMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    } else if(e.touches.length === 2) {
        isDragging = false;
        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTouchDist = Math.sqrt(dx*dx + dy*dy);
    }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(e.touches.length === 1 && isDragging) {
        camera.rotY -= (e.touches[0].clientX - lastMouse.x) * 0.005;
        camera.rotX -= (e.touches[0].clientY - lastMouse.y) * 0.005;
        camera.rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotX));
        lastMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    } else if(e.touches.length === 2) {
        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(lastTouchDist > 0) {
            camera.zoom *= (lastTouchDist / dist);
            camera.zoom = Math.max(0.01, Math.min(100, camera.zoom));
        }
        lastTouchDist = dist;
    }
}, {passive: false});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    isDragging = false;
    lastTouchDist = 0;
});

canvas.addEventListener('wheel', e => { camera.zoom *= (1 - e.deltaY * 0.001); camera.zoom = Math.max(0.01, Math.min(100, camera.zoom)); });

document.getElementById('sim-speed').addEventListener('input', e => { timeScale = parseFloat(e.target.value); });
document.getElementById('sim-integrator').addEventListener('change', e => { activeIntegrator = e.target.value; });
document.getElementById('btn-play').addEventListener('click', e => { isPaused = !isPaused; e.target.innerText = isPaused ? '재생' : '일시정지'; e.target.style.background = isPaused ? '#ef4444' : 'var(--accent)'; });

document.getElementById('btn-spawn').addEventListener('click', () => {
    let type = document.getElementById('obj-type').value;
    let m = parseFloat(document.getElementById('obj-mass').value);
    let r = parseFloat(document.getElementById('obj-radius').value);
    let colors = { 'star': '#fbbf24', 'planet': '#38bdf8', 'blackhole': '#000000' };

    let dist = camera.pos.z * 0.8;
    let spawnPos = new Vec3(0,0,-dist);
    let cx = Math.cos(-camera.rotX), sx = Math.sin(-camera.rotX);
    let y1 = spawnPos.y*cx - spawnPos.z*sx, z1 = spawnPos.y*sx + spawnPos.z*cx;
    let cy = Math.cos(-camera.rotY), sy = Math.sin(-camera.rotY);
    let x2 = spawnPos.x*cy - z1*sy, z2 = spawnPos.x*sy + z1*cy;

    let finalPos = new Vec3(x2, y1, z2).add(camera.pos);
    entities.push(new Entity(type, m, r, finalPos, new Vec3(Math.random()*5000, 0, 0), colors[type]||'#fff'));
});

document.getElementById('obj-type').addEventListener('change', e => {
    let t = e.target.value;
    if (t === 'star') { document.getElementById('obj-mass').value = '1.989e30'; document.getElementById('obj-radius').value = '6.957e8'; }
    if (t === 'planet') { document.getElementById('obj-mass').value = '5.97e24'; document.getElementById('obj-radius').value = '6371000'; }
});

setInterval(() => {
    let ins = document.getElementById('inspector');
    if (entities.length === 0) { ins.innerHTML = "우주가 비어있습니다."; return; }
    let biggest = entities.reduce((max, e) => e.mass > max.mass ? e : max, entities[0]);
    let types = {star:'항성', planet:'행성', blackhole:'블랙홀'};
    ins.innerHTML = '<span style="color:var(--accent)">[포커스 천체]</span><br>' +
        '유형: ' + types[biggest.type] + '<br>' +
        '질량: ' + biggest.mass.toExponential(2) + ' kg<br>' +
        '속도: ' + biggest.vel.mag().toExponential(2) + ' m/s<br>' +
        '좌표: (' + biggest.pos.x.toExponential(1) + ', ' + biggest.pos.y.toExponential(1) + ', ' + biggest.pos.z.toExponential(1) + ')';
}, 500);

// Init Solar System (approx)
entities.push(new Entity('star', 1.989e30, 6.957e8 * 20, new Vec3(), new Vec3(), '#fbbf24'));
entities.push(new Entity('planet', 5.97e24, 6.3e8 * 50, new Vec3(1.49e11,0,0), new Vec3(0, 29800, 0), '#38bdf8'));
entities.push(new Entity('planet', 3.30e23, 2.4e8 * 50, new Vec3(5.79e10,0,0), new Vec3(0, 47400, 0), '#9ca3af'));

requestAnimationFrame(loop);
</script>
</body>
</html>
