<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>대통합 우주 시뮬레이터 (Grand Unified Universe Engine)</title>
    <style>
        /* CSS Definitions */
        :root {
            --bg: #030305;
            --panel-bg: rgba(10, 10, 15, 0.85);
            --panel-border: rgba(60, 100, 200, 0.3);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --danger: #e11d48;
            --success: #10b981;
            --warn: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); overflow: hidden; width: 100vw; height: 100vh; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; justify-content: space-between; padding: 15px;
        }

        .panel {
            background: var(--panel-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px;
            pointer-events: auto; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); width: 340px; max-height: calc(100vh - 30px); overflow-y: auto;
        }

        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        h1 { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
        h2 { font-size: 12px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid var(--panel-border); padding-bottom: 4px; letter-spacing: 0.5px; }

        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; }
        input[type=text], select {
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--panel-border); color: white;
            padding: 6px; border-radius: 4px; font-size: 11px; font-family: monospace;
        }

        button {
            background: var(--accent); color: white; border: none; padding: 8px; border-radius: 4px;
            font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        .btn-danger { background: rgba(225, 29, 72, 0.2); border: 1px solid var(--danger); color: #fda4af; }
        .btn-danger:hover { background: var(--danger); color: white; }

        .audit-table { width: 100%; border-collapse: collapse; font-size: 10px; font-family: monospace; margin-top: 5px; }
        .audit-table th, .audit-table td { border: 1px solid var(--panel-border); padding: 4px; text-align: left; }
        .status-NOT_IMPLEMENTED { color: var(--danger); }
        .status-PARTIAL { color: var(--warn); }
        .status-COMPLETE { color: var(--success); }

        .hud {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: var(--panel-bg); backdrop-filter: blur(8px); border: 1px solid var(--panel-border);
            padding: 8px 20px; border-radius: 20px; display: flex; gap: 20px; pointer-events: auto; align-items: center;
        }
        .hud-item { display: flex; flex-direction: column; align-items: center; }
        .hud-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
        .hud-value { font-size: 14px; font-weight: bold; font-family: monospace; }

        .log-box {
            font-family: monospace; font-size: 10px; color: #a1a1aa; background: #000;
            padding: 8px; border-radius: 4px; height: 100px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #222;
        }

        @media (max-width: 768px) {
            .ui-layer { flex-direction: column; padding: 5px; }
            .panel { width: 100%; max-height: 45vh; }
            .right-panel { display: none; }
            .hud { bottom: 5px; width: 95%; justify-content: space-between; padding: 5px 10px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"><canvas id="sim-canvas"></canvas></div>

<div class="ui-layer">
    <div class="panel left-panel">
        <div>
            <h1>대통합 우주 엔진</h1>
            <div style="font-size: 10px; color: var(--text-muted);">Grand Unified Multi-Physics v4.0</div>
        </div>

        <div class="control-group">
            <h2>물리 시스템 상태 (COMPLETION AUDIT)</h2>
            <div id="project-status" style="font-size: 11px; font-weight: bold;">STATUS: <span style="color:var(--danger)">INCOMPLETE</span></div>
            <table class="audit-table" id="audit-table"><tbody></tbody></table>
        </div>

        <div class="control-group">
            <h2>천체 / 입자 생성기</h2>
            <select id="obj-type">
                <option value="star">항성 (Main Sequence)</option>
                <option value="planet" selected>행성 (Rocky/Gas)</option>
                <option value="blackhole">블랙홀 (Singularity)</option>
                <option value="gas">가스 성운 (SPH Fluid)</option>
                <option value="charge">대전 입자 (Proton/Electron)</option>
            </select>
            <label>질량 (kg) <span id="val-mass">5.97e24</span></label>
            <input type="text" id="obj-mass" value="5.97e24">
            <label>반경 (m) <span id="val-radius">6.37e6</span></label>
            <input type="text" id="obj-radius" value="6371000">
            <label>전하량 (C)</label>
            <input type="text" id="obj-charge" value="0">
            <button id="btn-spawn">화면 중앙에 생성 (더블클릭 가능)</button>
        </div>

        <div class="control-group">
            <h2>프리셋 시나리오</h2>
            <button id="btn-pre-solar">태양계 (Newtonian/Relativistic)</button>
            <button id="btn-pre-galaxy">은하 충돌 (Barnes-Hut N-Body)</button>
            <button id="btn-pre-fluid">가스 성운 응축 (SPH Hydrodynamics)</button>
            <button id="btn-pre-em">플라즈마 전자기력 (Lorentz Force)</button>
        </div>
    </div>

    <div class="panel right-panel">
        <div class="control-group">
            <h2>엔진 전역 설정</h2>
            <label>적분기 (Integrator)</label>
            <select id="sim-integrator">
                <option value="rk4">Runge-Kutta 4 (정밀도 높음)</option>
                <option value="verlet" selected>Velocity Verlet (에너지 보존)</option>
                <option value="euler">Symplectic Euler (빠름)</option>
            </select>
            <label>시간 배속 (Time Scale)</label>
            <input type="range" id="sim-speed" min="-5" max="15" step="0.1" value="0">
            <label>공간 분할 (Barnes-Hut Theta)</label>
            <input type="range" id="sim-theta" min="0" max="1" step="0.1" value="0.5">
            <button id="btn-clear" class="btn-danger">우주 초기화 (빅 크런치)</button>
        </div>

        <div class="control-group">
            <h2>활성화된 물리 모델</h2>
            <label><input type="checkbox" id="mod-relativity" checked> 특수/일반 상대성 이론 근사</label>
            <label><input type="checkbox" id="mod-thermo" checked> 열역학 및 항성 핵융합</label>
            <label><input type="checkbox" id="mod-em" checked> 전자기학 (쿨롱/로렌츠 힘)</label>
            <label><input type="checkbox" id="mod-sph" checked> 유체 역학 (SPH)</label>
            <label><input type="checkbox" id="mod-collisions" checked> 비탄성 충돌 및 병합</label>
        </div>

        <div class="control-group">
            <h2>실시간 관측 및 로그</h2>
            <div id="inspector" style="font-size: 10px; font-family: monospace; color: var(--accent); line-height: 1.4;">대기 중...</div>
            <div class="log-box" id="sys-log">System Initialized.\n</div>
        </div>
    </div>
</div>

<div class="hud">
    <div class="hud-item"><span class="hud-label">FPS</span><span class="hud-value" id="hud-fps">60</span></div>
    <div class="hud-item"><span class="hud-label">총 개체 수</span><span class="hud-value" id="hud-count">0</span></div>
    <div class="hud-item"><span class="hud-label">유체 입자</span><span class="hud-value" id="hud-sph">0</span></div>
    <div class="hud-item"><span class="hud-label">카메라 ZOOM</span><span class="hud-value" id="hud-zoom">1.0x</span></div>
    <button id="btn-play" style="padding: 4px 12px; border-radius: 12px;">일시정지</button>
</div>

<script>
/* =========================================================================================
   대통합 우주 엔진 (Grand Unified Universe Engine)
   Comprehensive Physics Implementation covering required subsystems.
   Lines: ~1500 expected.
========================================================================================= */

// --- 1. COMPLETION AUDIT SYSTEM ---
const AUDIT = {
    "Barnes-Hut Gravity (O(N log N))": "COMPLETE",
    "Newtonian N-Body Dynamics": "COMPLETE",
    "Special Relativity (Lorentz)": "PARTIAL",
    "General Relativity (Schwarzschild proxy)": "PARTIAL",
    "Electromagnetism (Coulomb/Lorentz)": "PARTIAL",
    "Thermodynamics (Stefan-Boltzmann)": "PARTIAL",
    "Fluid Dynamics (SPH Navier-Stokes)": "COMPLETE",
    "Stellar Evolution (Basic pp-chain)": "NOT_IMPLEMENTED",
    "Inelastic Collisions & Mergers": "COMPLETE",
    "Symplectic Integration (Verlet/RK4)": "COMPLETE",
    "Quantum Mechanics": "NOT_IMPLEMENTED",
    "Cosmology": "NOT_IMPLEMENTED"
};

function initAudit() {
    let tbody = document.querySelector('#audit-table tbody');
    for (let sys in AUDIT) {
        let tr = document.createElement('tr');
        tr.innerHTML = '<td>' + sys + '</td><td class="status-' + AUDIT[sys] + '">' + AUDIT[sys] + '</td>';
        tbody.appendChild(tr);
    }
}
initAudit();

const logBox = document.getElementById('sys-log');
function log(msg) {
    logBox.innerHTML += msg + "\n";
    logBox.scrollTop = logBox.scrollHeight;
}

// --- 2. CONSTANTS & UTILITIES ---
const G = 6.67430e-11;
const c = 299792458;
const c2 = c * c;
const k_e = 8.9875517923e9; // Coulomb constant
const sigma_SB = 5.670374419e-8; // Stefan-Boltzmann
const M_SUN = 1.98847e30;
const R_SUN = 6.957e8;
const L_SUN = 3.828e26;
const AU = 1.495978707e11;

class Vec3 {
    constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
    add(v) { this.x+=v.x; this.y+=v.y; this.z+=v.z; return this; }
    sub(v) { this.x-=v.x; this.y-=v.y; this.z-=v.z; return this; }
    mul(s) { this.x*=s; this.y*=s; this.z*=s; return this; }
    div(s) { this.x/=s; this.y/=s; this.z/=s; return this; }
    clone() { return new Vec3(this.x, this.y, this.z); }
    magSq() { return this.x*this.x + this.y*this.y + this.z*this.z; }
    mag() { return Math.sqrt(this.magSq()); }
    normalize() { let m = this.mag(); return m===0 ? this : this.div(m); }
    dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
    cross(v) { return new Vec3(this.y*v.z - this.z*v.y, this.z*v.x - this.x*v.z, this.x*v.y - this.y*v.x); }
    distTo(v) { let dx=this.x-v.x, dy=this.y-v.y, dz=this.z-v.z; return Math.sqrt(dx*dx + dy*dy + dz*dz); }
}

// --- 3. CORE ENTITIES ---
let ENTITIES = [];
let SPH_PARTICLES = [];
let VISUAL_PARTICLES = [];
let nextId = 0;

class PhysicalEntity {
    constructor(type, mass, radius, pos, vel, color, charge=0) {
        this.id = nextId++;
        this.type = type; // star, planet, blackhole, charge
        this.mass = mass;
        this.radius = radius;
        this.pos = pos;
        this.vel = vel;
        this.acc = new Vec3();
        this.color = color;
        this.charge = charge;

        // Thermodynamics & Stellar
        this.temperature = 2.73; // CMB baseline
        this.luminosity = 0;
        this.dead = false;

        this.trail = [];
        this.trailTimer = 0;

        this.calcProperties();
    }

    calcProperties() {
        if(this.type === 'star') {
            // Rough Main Sequence scaling
            let m_ratio = this.mass / M_SUN;
            this.luminosity = L_SUN * Math.pow(m_ratio, 3.5);
            let r_ratio = this.radius / R_SUN;
            // T = (L / (4 pi R^2 sigma))^0.25
            let area = 4 * Math.PI * this.radius * this.radius;
            this.temperature = Math.pow(this.luminosity / (area * sigma_SB), 0.25);
            // Color based on temp
            if(this.temperature > 10000) this.color = '#93c5fd';
            else if(this.temperature > 6000) this.color = '#fef08a';
            else if(this.temperature > 3500) this.color = '#fb923c';
            else this.color = '#ef4444';
        } else if(this.type === 'blackhole') {
            this.schwarzschild = 2 * G * this.mass / c2;
            this.temperature = 0;
            this.color = '#000000';
        }
    }
}

class SphParticle {
    constructor(pos, vel, mass, smoothingRadius) {
        this.pos = pos;
        this.vel = vel;
        this.acc = new Vec3();
        this.mass = mass;
        this.h = smoothingRadius;
        this.density = 0;
        this.pressure = 0;
        this.color = 'rgba(100, 200, 255, 0.5)';
    }
}

class VisualParticle {
    constructor(pos, vel, color, life) {
        this.pos = pos; this.vel = vel; this.color = color;
        this.life = life; this.maxLife = life;
    }
}

// --- 4. BARNES-HUT OCTREE (O(N log N) Gravity) ---
class OctreeNode {
    constructor(center, size) {
        this.center = center;
        this.size = size;
        this.mass = 0;
        this.com = new Vec3(); // Center of mass
        this.entity = null;
        this.children = null;
    }

    insert(e) {
        if (this.mass === 0) {
            this.entity = e;
            this.mass = e.mass;
            this.com = e.pos.clone();
            return;
        }

        if (this.children === null) {
            this.subdivide();
            if (this.entity) {
                this.insertToChild(this.entity);
                this.entity = null;
            }
        }

        this.insertToChild(e);

        // Update Center of Mass
        let totalMass = this.mass + e.mass;
        this.com.x = (this.com.x * this.mass + e.pos.x * e.mass) / totalMass;
        this.com.y = (this.com.y * this.mass + e.pos.y * e.mass) / totalMass;
        this.com.z = (this.com.z * this.mass + e.pos.z * e.mass) / totalMass;
        this.mass = totalMass;
    }

    subdivide() {
        this.children = [];
        let s = this.size / 2;
        let s2 = s / 2;
        for(let i=0; i<8; i++) {
            let cx = this.center.x + ((i&1) ? s2 : -s2);
            let cy = this.center.y + ((i&2) ? s2 : -s2);
            let cz = this.center.z + ((i&4) ? s2 : -s2);
            this.children.push(new OctreeNode(new Vec3(cx, cy, cz), s));
        }
    }

    insertToChild(e) {
        let idx = 0;
        if(e.pos.x > this.center.x) idx |= 1;
        if(e.pos.y > this.center.y) idx |= 2;
        if(e.pos.z > this.center.z) idx |= 4;
        this.children[idx].insert(e);
    }
}

function calculateBarnesHutForce(e, node, theta, eps) {
    if (node.mass === 0) return new Vec3();

    let dx = node.com.x - e.pos.x;
    let dy = node.com.y - e.pos.y;
    let dz = node.com.z - e.pos.z;
    let distSq = dx*dx + dy*dy + dz*dz;
    let dist = Math.sqrt(distSq);

    // If node is a leaf or far enough away (macQ condition)
    if (node.children === null || (node.size / dist) < theta) {
        if (dist === 0) return new Vec3(); // Self
        let fMag = (G * node.mass) / (distSq + eps*eps); // softened

        // Relativistic GR Proxy (Schwarzschild modification)
        if(CONFIG.relativity) {
            let rs = 2 * G * node.mass / c2;
            fMag *= (1 + 3 * rs / (2 * dist));
        }

        return new Vec3((dx/dist)*fMag, (dy/dist)*fMag, (dz/dist)*fMag);
    }

    let force = new Vec3();
    for(let child of node.children) {
        force.add(calculateBarnesHutForce(e, child, theta, eps));
    }
    return force;
}

// --- 5. SPH FLUID DYNAMICS ---
// Smoothing kernel W
function W_poly6(r, h) {
    if(r >= h) return 0;
    let h2 = h*h; let r2 = r*r;
    let coeff = 315.0 / (64.0 * Math.PI * Math.pow(h, 9));
    let term = h2 - r2;
    return coeff * term * term * term;
}

function gradW_spiky(rVec, r, h) {
    if(r >= h || r === 0) return new Vec3();
    let coeff = -45.0 / (Math.PI * Math.pow(h, 6));
    let term = (h - r) * (h - r);
    return rVec.clone().mul(coeff * term / r);
}

function updateSPH() {
    if(!CONFIG.sph || SPH_PARTICLES.length === 0) return;
    const h = 5e10; // Smoothing length
    const k = 1e5; // Gas constant
    const rho0 = 1; // Rest density
    const mu = 0.1; // Viscosity

    // 1. Calculate Density and Pressure
    for(let i=0; i<SPH_PARTICLES.length; i++) {
        let p1 = SPH_PARTICLES[i];
        p1.density = 0;
        for(let j=0; j<SPH_PARTICLES.length; j++) {
            let p2 = SPH_PARTICLES[j];
            let dist = p1.pos.distTo(p2.pos);
            if(dist < h) {
                p1.density += p2.mass * W_poly6(dist, h);
            }
        }
        p1.pressure = k * (p1.density - rho0);
    }

    // 2. Calculate Forces
    for(let i=0; i<SPH_PARTICLES.length; i++) {
        let p1 = SPH_PARTICLES[i];
        let fPress = new Vec3();
        let fVisc = new Vec3();
        let fGrav = new Vec3();

        for(let j=0; j<SPH_PARTICLES.length; j++) {
            if(i===j) continue;
            let p2 = SPH_PARTICLES[j];
            let rVec = p1.pos.clone().sub(p2.pos);
            let r = rVec.mag();
            if(r < h) {
                // Pressure force
                let pTerm = (p1.pressure + p2.pressure) / (2.0 * p2.density);
                let gw = gradW_spiky(rVec, r, h);
                fPress.sub(gw.clone().mul(p2.mass * pTerm));

                // Viscosity force
                let vDiff = p2.vel.clone().sub(p1.vel);
                let wVisc = 45.0 / (Math.PI * Math.pow(h, 6)) * (h - r);
                fVisc.add(vDiff.mul(mu * p2.mass * wVisc / p2.density));
            }

            // Gravity from other gas particles (simplified O(N^2) for gas-gas)
            if(r > 0) {
                let fG = (G * p2.mass) / (r*r + 1e18);
                fGrav.sub(rVec.clone().normalize().mul(fG));
            }
        }

        // Gravity from major entities
        for(let e of ENTITIES) {
            let rVec = e.pos.clone().sub(p1.pos);
            let r = rVec.mag();
            let fG = (G * e.mass) / (r*r + 1e20);
            fGrav.add(rVec.normalize().mul(fG));
        }

        p1.acc = fPress.add(fVisc).add(fGrav).div(p1.density);
    }
}

// --- 6. MAIN PHYSICS LOOP ---
const CONFIG = {
    relativity: true, thermo: true, em: true, sph: true, collisions: true,
    integrator: 'verlet', timeScaleBase: 1.0, theta: 0.5
};

function explode(pos, color, energy) {
    let count = Math.min(100, Math.max(10, Math.floor(energy / 1e30)));
    for(let i=0; i<count; i++) {
        let vel = new Vec3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).normalize().mul(Math.random() * 100000 + 10000);
        VISUAL_PARTICLES.push(new VisualParticle(pos.clone(), vel, color, Math.random() * 3 + 1));
    }
    camera.shake = Math.min(50, energy / 1e32);
}

function computeEntityAccelerations() {
    let accs = ENTITIES.map(() => new Vec3());

    // Build Octree
    let min = new Vec3(Infinity, Infinity, Infinity);
    let max = new Vec3(-Infinity, -Infinity, -Infinity);
    for(let e of ENTITIES) {
        if(e.pos.x < min.x) min.x = e.pos.x; if(e.pos.x > max.x) max.x = e.pos.x;
        if(e.pos.y < min.y) min.y = e.pos.y; if(e.pos.y > max.y) max.y = e.pos.y;
        if(e.pos.z < min.z) min.z = e.pos.z; if(e.pos.z > max.z) max.z = e.pos.z;
    }
    let center = min.clone().add(max).mul(0.5);
    let size = Math.max(max.x - min.x, max.y - min.y, max.z - min.z) + 1e10;

    let octree = new OctreeNode(center, size);
    for(let e of ENTITIES) octree.insert(e);

    for(let i=0; i<ENTITIES.length; i++) {
        let e = ENTITIES[i];

        // 1. Gravity via Barnes-Hut
        let gAcc = calculateBarnesHutForce(e, octree, CONFIG.theta, e.radius);
        accs[i].add(gAcc);

        // 2. Electromagnetism O(N^2) (assuming few charged particles)
        if(CONFIG.em && e.charge !== 0) {
            for(let j=0; j<ENTITIES.length; j++) {
                if(i===j) continue;
                let e2 = ENTITIES[j];
                if(e2.charge !== 0) {
                    let rVec = e.pos.clone().sub(e2.pos);
                    let rSq = rVec.magSq();
                    let fE = (k_e * e.charge * e2.charge) / (rSq + 1e10);
                    accs[i].add(rVec.normalize().mul(fE / e.mass));
                }
            }
        }
    }
    return accs;
}

function handleCollisions() {
    if(!CONFIG.collisions) return;
    for(let i=0; i<ENTITIES.length; i++) {
        for(let j=i+1; j<ENTITIES.length; j++) {
            let e1 = ENTITIES[i], e2 = ENTITIES[j];
            if(e1.dead || e2.dead) continue;

            let dist = e1.pos.distTo(e2.pos);
            if(dist < e1.radius + e2.radius) {
                // Merger
                let bigger = e1.mass >= e2.mass ? e1 : e2;
                let smaller = e1.mass >= e2.mass ? e2 : e1;

                smaller.dead = true;

                let totalMass = bigger.mass + smaller.mass;
                bigger.vel.x = (bigger.vel.x * bigger.mass + smaller.vel.x * smaller.mass) / totalMass;
                bigger.vel.y = (bigger.vel.y * bigger.mass + smaller.vel.y * smaller.mass) / totalMass;
                bigger.vel.z = (bigger.vel.z * bigger.mass + smaller.vel.z * smaller.mass) / totalMass;

                bigger.mass = totalMass;
                bigger.radius = Math.pow(Math.pow(bigger.radius, 3) + Math.pow(smaller.radius, 3), 1/3);
                bigger.charge += smaller.charge;

                // Supernova check (Chandrasekhar mass approx for white dwarfs, but applied universally for fun)
                if(bigger.type === 'star' && bigger.mass > M_SUN * 50) {
                    bigger.type = 'blackhole';
                    log('Supernova! Entity ' + bigger.id + ' collapsed into a Black Hole.');
                    explode(bigger.pos, '#a855f7', bigger.mass * c2 * 0.01);
                } else {
                    explode(smaller.pos, smaller.color, smaller.mass * 1e10);
                }
                bigger.calcProperties();
            }
        }
    }
    ENTITIES = ENTITIES.filter(e => !e.dead);
}

function applyRelativity(e) {
    if(CONFIG.relativity) {
        let v = e.vel.mag();
        if(v > c * 0.999) {
            e.vel.normalize().mul(c * 0.999);
            v = c * 0.999;
        }
        let gamma = 1 / Math.sqrt(1 - (v*v)/c2);
        // Apply effective inertial mass increase implicitly by modifying acc limit,
        // but for pure stability in N-body we just clamp velocity to c.
    }
}

function stepPhysics(dt) {
    if(dt === 0 || isPaused) return;

    if(CONFIG.integrator === 'verlet') {
        let acc1 = computeEntityAccelerations();
        for(let i=0; i<ENTITIES.length; i++) {
            ENTITIES[i].pos.add(ENTITIES[i].vel.clone().mul(dt)).add(acc1[i].clone().mul(0.5*dt*dt));
        }
        handleCollisions();
        let acc2 = computeEntityAccelerations();
        for(let i=0; i<ENTITIES.length; i++) {
            ENTITIES[i].vel.add(acc1[i].clone().add(acc2[i]).mul(0.5*dt));
            ENTITIES[i].acc = acc2[i];
            applyRelativity(ENTITIES[i]);
        }
    } else if(CONFIG.integrator === 'euler') {
        let acc = computeEntityAccelerations();
        for(let i=0; i<ENTITIES.length; i++) {
            ENTITIES[i].vel.add(acc[i].clone().mul(dt));
            ENTITIES[i].pos.add(ENTITIES[i].vel.clone().mul(dt));
            ENTITIES[i].acc = acc[i];
            applyRelativity(ENTITIES[i]);
        }
        handleCollisions();
    } else if(CONFIG.integrator === 'rk4') {
        // Full RK4
        let pos0 = ENTITIES.map(e => e.pos.clone());
        let vel0 = ENTITIES.map(e => e.vel.clone());
        let m = ENTITIES.map(e => e.mass);

        let k1v = computeEntityAccelerations();
        let k1x = vel0.map(v => v.clone());

        for(let i=0; i<ENTITIES.length; i++) ENTITIES[i].pos = pos0[i].clone().add(k1x[i].clone().mul(dt*0.5));
        let k2v = computeEntityAccelerations();
        let k2x = vel0.map((v,i) => v.clone().add(k1v[i].clone().mul(dt*0.5)));

        for(let i=0; i<ENTITIES.length; i++) ENTITIES[i].pos = pos0[i].clone().add(k2x[i].clone().mul(dt*0.5));
        let k3v = computeEntityAccelerations();
        let k3x = vel0.map((v,i) => v.clone().add(k2v[i].clone().mul(dt*0.5)));

        for(let i=0; i<ENTITIES.length; i++) ENTITIES[i].pos = pos0[i].clone().add(k3x[i].clone().mul(dt));
        let k4v = computeEntityAccelerations();
        let k4x = vel0.map((v,i) => v.clone().add(k3v[i].clone().mul(dt)));

        for(let i=0; i<ENTITIES.length; i++) {
            ENTITIES[i].pos = pos0[i].clone().add( k1x[i].clone().add(k2x[i].clone().mul(2)).add(k3x[i].clone().mul(2)).add(k4x[i]).mul(dt/6) );
            ENTITIES[i].vel = vel0[i].clone().add( k1v[i].clone().add(k2v[i].clone().mul(2)).add(k3v[i].clone().mul(2)).add(k4v[i]).mul(dt/6) );
            ENTITIES[i].acc = k1v[i];
            applyRelativity(ENTITIES[i]);
        }
        handleCollisions();
    }

    // Update SPH
    if(CONFIG.sph) {
        updateSPH();
        for(let p of SPH_PARTICLES) {
            p.vel.add(p.acc.clone().mul(dt));
            p.pos.add(p.vel.clone().mul(dt));
        }
    }

    // Trails and Visuals
    for(let e of ENTITIES) {
        e.trailTimer += dt;
        if(e.trailTimer > Math.abs(dt)*10) { // arbitrary trail threshold
            e.trail.push(e.pos.clone());
            if(e.trail.length > 50) e.trail.shift();
            e.trailTimer = 0;
        }
    }

    for(let p of VISUAL_PARTICLES) {
        p.pos.add(p.vel.clone().mul(dt*0.001)); // visual particles move relative to dt
        p.life -= 0.016; // approx 60fps decay
    }
    VISUAL_PARTICLES = VISUAL_PARTICLES.filter(p => p.life > 0);
}


// --- 7. RENDERER & CAMERA ---
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

const camera = { pos: new Vec3(0, 0, 5e11), rotX: 0.2, rotY: 0, zoom: 1.0, shake: 0 };

function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
window.addEventListener('resize', resize); resize();

const bgStars = Array.from({length: 800}, () => ({
    x: (Math.random()-0.5)*2, y: (Math.random()-0.5)*2, z: Math.random(), size: Math.random()*1.5, a: Math.random()
}));

function project(pos) {
    let x = pos.x - camera.pos.x, y = pos.y - camera.pos.y, z = pos.z - camera.pos.z;

    let cy = Math.cos(camera.rotY), sy = Math.sin(camera.rotY);
    let x1 = x * cy - z * sy, z1 = x * sy + z * cy;

    let cx = Math.cos(camera.rotX), sx = Math.sin(camera.rotX);
    let y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;

    let fov = 1000 * camera.zoom;
    if (z2 >= -fov/2) {
        let scale = fov / (fov + z2);
        let shx = (Math.random()-0.5) * camera.shake;
        let shy = (Math.random()-0.5) * camera.shake;
        return { x: (x1 * scale) + width/2 + shx, y: (y2 * scale) + height/2 + shy, scale: scale, z: z2 };
    }
    return null;
}

function hexToRgba(hex, alpha=1) {
    let r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return r ? 'rgba(' + parseInt(r[1],16) + ',' + parseInt(r[2],16) + ',' + parseInt(r[3],16) + ',' + alpha + ')' : 'rgba(255,255,255,' + alpha + ')';
}

function render() {
    ctx.fillStyle = '#020204'; ctx.fillRect(0, 0, width, height);
    if(camera.shake > 0.1) camera.shake *= 0.9; else camera.shake = 0;

    // Parallax stars
    ctx.fillStyle = '#fff';
    for(let s of bgStars) {
        let px = (s.x * width + camera.rotY * 800 * s.z) % width;
        let py = (s.y * height - camera.rotX * 800 * s.z) % height;
        if(px<0) px+=width; if(py<0) py+=height;
        ctx.globalAlpha = s.a * (0.5 + Math.sin(Date.now()*0.002 + s.z*10)*0.5);
        ctx.fillRect(px, py, s.size, s.size);
    }
    ctx.globalAlpha = 1.0;

    let dList = [];

    // Entities
    for(let e of ENTITIES) {
        let p = project(e.pos);
        if(p) dList.push({type:'e', obj: e, p: p});
        if(e.trail.length > 1) {
            ctx.beginPath();
            let start = project(e.trail[0]);
            if(start) {
                ctx.moveTo(start.x, start.y);
                for(let i=1; i<e.trail.length; i++) {
                    let tp = project(e.trail[i]);
                    if(tp) ctx.lineTo(tp.x, tp.y);
                }
                ctx.strokeStyle = hexToRgba(e.color, 0.4);
                ctx.lineWidth = Math.max(1, 2 * start.scale);
                ctx.stroke();
            }
        }
    }
    // SPH
    for(let p of SPH_PARTICLES) { let pr = project(p.pos); if(pr) dList.push({type:'sph', obj: p, p: pr}); }
    // Visuals
    for(let p of VISUAL_PARTICLES) { let pr = project(p.pos); if(pr) dList.push({type:'v', obj: p, p: pr}); }

    dList.sort((a,b) => b.p.z - a.p.z);

    for(let item of dList) {
        let p = item.p;
        if(item.type === 'e') {
            let e = item.obj;
            let r = Math.max(e.radius * p.scale, 1);
            ctx.shadowBlur = 0;

            if(e.type === 'star') {
                ctx.shadowBlur = 30 * p.scale; ctx.shadowColor = e.color;
                let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*2.5);
                g.addColorStop(0, '#fff'); g.addColorStop(0.3, e.color); g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r*2.5, 0, Math.PI*2); ctx.fill();
            } else if(e.type === 'blackhole') {
                let rs = Math.max((e.schwarzschild || r) * p.scale, 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(p.x, p.y, rs*4, 0, Math.PI*2); ctx.stroke(); // Accretion disk proxy
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(p.x, p.y, rs, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = '#a855f7'; ctx.strokeStyle = '#a855f7'; ctx.stroke();
            } else if(e.type === 'charge') {
                ctx.fillStyle = e.charge > 0 ? '#ef4444' : '#3b82f6';
                ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(r, 2), 0, Math.PI*2); ctx.fill();
            } else {
                let g = ctx.createRadialGradient(p.x-r*0.3, p.y-r*0.3, r*0.1, p.x, p.y, r);
                g.addColorStop(0, hexToRgba(e.color, 1)); g.addColorStop(1, hexToRgba(e.color, 0.1));
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
            }
        } else if(item.type === 'sph') {
            ctx.fillStyle = item.obj.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 4 * p.scale, 0, Math.PI*2); ctx.fill();
        } else if(item.type === 'v') {
            ctx.fillStyle = item.obj.color; ctx.globalAlpha = item.obj.life / item.obj.maxLife;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2 * p.scale, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }
    ctx.shadowBlur = 0;
}


// --- 8. GAME LOOP & UI ---
let lastTime = performance.now();
let frames = 0, lastFps = lastTime;

function runSim() {
    let now = performance.now();
    let wallDt = (now - lastTime) / 1000;
    lastTime = now;

    frames++;
    if(now - lastFps >= 1000) {
        document.getElementById('hud-fps').innerText = frames;
        frames = 0; lastFps = now;
    }
    document.getElementById('hud-count').innerText = ENTITIES.length;
    document.getElementById('hud-sph').innerText = SPH_PARTICLES.length;

    // Exponent scale: value 0 = 1x, value 5 = 10^5
    let tsVal = parseFloat(document.getElementById('sim-speed').value);
    let timeMult = tsVal >= 0 ? Math.pow(10, tsVal) : -Math.pow(10, Math.abs(tsVal));

    // Substepping for stability if timeMult is large
    let dt = wallDt * timeMult;
    let substeps = Math.max(1, Math.min(10, Math.floor(Math.abs(tsVal))));
    let stepDt = dt / substeps;

    for(let s=0; s<substeps; s++) stepPhysics(stepDt);

    render();
    requestAnimationFrame(runSim);
}

// Interactivity
let isDragging = false, lastMouse = {x:0, y:0}, touchDist = 0;

canvas.addEventListener('mousedown', e => { isDragging=true; lastMouse={x:e.clientX, y:e.clientY}; });
canvas.addEventListener('mousemove', e => {
    if(!isDragging) return;
    camera.rotY -= (e.clientX - lastMouse.x) * 0.005;
    camera.rotX -= (e.clientY - lastMouse.y) * 0.005;
    camera.rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotX));
    lastMouse = {x:e.clientX, y:e.clientY};
});
window.addEventListener('mouseup', () => isDragging=false);
canvas.addEventListener('wheel', e => { camera.zoom *= (1 - e.deltaY*0.001); camera.zoom = Math.max(1e-10, Math.min(1e5, camera.zoom)); document.getElementById('hud-zoom').innerText = camera.zoom.toExponential(1)+'x'; });

canvas.addEventListener('touchstart', e => {
    if(e.touches.length===1) { isDragging=true; lastMouse={x:e.touches[0].clientX, y:e.touches[0].clientY}; }
    else if(e.touches.length===2) { isDragging=false; let dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; touchDist=Math.sqrt(dx*dx+dy*dy); }
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(e.touches.length===1 && isDragging) {
        camera.rotY -= (e.touches[0].clientX - lastMouse.x) * 0.005;
        camera.rotX -= (e.touches[0].clientY - lastMouse.y) * 0.005;
        camera.rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotX));
        lastMouse = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    } else if(e.touches.length===2) {
        let dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        let d=Math.sqrt(dx*dx+dy*dy);
        if(touchDist>0) { camera.zoom *= (touchDist/d); camera.zoom = Math.max(1e-10, Math.min(1e5, camera.zoom)); }
        touchDist=d; document.getElementById('hud-zoom').innerText = camera.zoom.toExponential(1)+'x';
    }
}, {passive:false});
canvas.addEventListener('touchend', () => { isDragging=false; touchDist=0; });

function getSpawnPos() {
    let dist = camera.pos.z * 0.8;
    let p = new Vec3(0,0,-dist);
    let cx = Math.cos(-camera.rotX), sx = Math.sin(-camera.rotX);
    let y1 = p.y*cx - p.z*sx, z1 = p.y*sx + p.z*cx;
    let cy = Math.cos(-camera.rotY), sy = Math.sin(-camera.rotY);
    let x2 = p.x*cy - z1*sy, z2 = p.x*sy + z1*cy;
    return new Vec3(x2, y1, z2).add(camera.pos);
}

});
