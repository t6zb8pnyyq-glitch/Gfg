<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NASA급 통합 전산 물리학 연구소</title>
    <style>
:root {
                --bg: #000000;
                --text: #e0e0e0;
                --panel: rgba(10, 10, 15, 0.9);
                --border: #38bdf8;
                --accent: #0284c7;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
            }
            body {
                margin: 0; padding: 0; background: var(--bg); color: var(--text);
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', monospace; overflow: hidden;
                display: flex; flex-direction: column; height: 100vh;
            }
            /* Layout */
            #top-bar { height: 45px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; font-weight: bold; overflow-x: auto; white-space: nowrap; }
            #main-area { display: flex; flex: 1; height: calc(100vh - 85px); position: relative; }
            .panel-col { width: 320px; background: var(--panel); overflow-y: auto; padding: 10px; box-sizing: border-box; font-size: 12px; z-index: 10; border-right: 1px solid var(--border); }
            #right-panel { border-right: none; border-left: 1px solid var(--border); }
            #center-viewport { flex: 1; position: relative; background: #000; overflow: hidden; z-index: 1; }
            #bottom-bar { height: 40px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; z-index: 10; }

            /* Controls */
            select, input, button { background: #1e293b; color: #fff; border: 1px solid var(--border); padding: 5px; font-family: inherit; margin: 3px 0; width: 100%; box-sizing: border-box; }
            button { background: var(--accent); cursor: pointer; font-weight: bold; transition: background 0.2s; }
            button:hover { background: #0369a1; }
            .section { margin-bottom: 15px; border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px; background: rgba(15, 23, 42, 0.6); }
            .section h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--border); border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 5px; }

            canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

            /* UI Elements */
            .lab-btn { margin-right: 5px; background: #1e293b; border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; width: auto; font-size: 11px;}
            .lab-btn.active { background: var(--accent); color: white; }
            table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
            td { padding: 3px 0; border-bottom: 1px dotted #334155; }
            .val { float: right; font-family: monospace; }
            .pass { color: var(--success); }
            .fail { color: var(--danger); }
            .warn { color: var(--warning); }

            /* Modal */
            .modal { display: none; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: var(--panel); border: 2px solid var(--border); z-index: 1000; overflow: auto; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
            #close-modal { float: right; background: var(--danger); width: auto; padding: 5px 15px; border: none;}

            /* Audit UI */
            .audit-tag { display: inline-block; padding: 2px 6px; margin: 2px; border-radius: 3px; font-size: 10px; background: var(--success); color: #000; font-weight: bold; }
    </style>
</head>

class Vec3 {
        constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
        add(v) { return new Vec3(this.x+v.x, this.y+v.y, this.z+v.z); }
        sub(v) { return new Vec3(this.x-v.x, this.y-v.y, this.z-v.z); }
        mult(s) { return new Vec3(this.x*s, this.y*s, this.z*s); }
        div(s) { return new Vec3(this.x/s, this.y/s, this.z/s); }
        dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
        cross(v) { return new Vec3(this.y*v.z - this.z*v.y, this.z*v.x - this.x*v.z, this.x*v.y - this.y*v.x); }
        magSq() { return this.x*this.x + this.y*this.y + this.z*this.z; }
        mag() { return Math.sqrt(this.magSq()); }
        normalize() { let m = this.mag(); return m === 0 ? new Vec3() : this.div(m); }
        clone() { return new Vec3(this.x, this.y, this.z); }
    }

/**
 * src/physics/PhysicalBody.js
 *
 * The single canonical state representation for a physical entity in the Universe Creator.
 * All quantities MUST be in strict SI units.
 */
class PhysicalBody {
    constructor(id, type, mass, radius, pos, vel) {
        this.id = id;
        this.type = type; // e.g., 'star', 'planet', 'blackhole', 'gas'

        // --- Core Mechanical State ---
        this.mass = mass;                 // [kg]
        this.radius = radius;             // [m]
        this.pos = pos;                   // [m] (Vec3)
        this.vel = vel;                   // [m/s] (Vec3)
        this.acc = new Vec3();            // [m/s^2] (Vec3)

        // --- Rigid Body / Rotation ---
        this.spin = new Vec3();           // Angular velocity vector [rad/s]

        // --- Thermodynamics & Fluid State ---
        this.temperature = 2.73;          // Absolute temperature [K] (CMB default)
        this.internalEnergy = 0;          // Total internal energy [J]

        // Fluid/SPH specific
        this.sph_density = 0;             // Local SPH evaluated density [kg/m^3]
        this.sph_pressure = 0;            // Local SPH evaluated pressure [Pa]

        // Derived Mechanical properties (calculated on demand or initialized here)
        this.updateDensity();             // Sets this.density [kg/m^3] based on homogeneous spherical assumption

        // --- Nuclear & Chemical Composition ---
        // Mass fractions must sum to 1.0. X=Hydrogen, Y=Helium, Z=Metals
        this.composition = { X: 0.73, Y: 0.25, Z: 0.02 };

        // --- Electromagnetic ---
        this.charge = 0;                  // [C]
        this.magneticField = new Vec3();  // Intrinsic dipole moment / surface field proxy [T]

        // --- Radiation ---
        this.luminosity = 0;              // [W] (J/s)
    }

    updateDensity() {
        if (this.radius <= 0) {
            this.density = Infinity;
        } else {
            const volume = (4/3) * Math.PI * Math.pow(this.radius, 3);
            this.density = this.mass / volume; // [kg/m^3]
        }
    }

    // Clone creates a deep copy of the state vector for integrators (like RK4)
    clone() {
        let b = new PhysicalBody(
            this.id,
            this.type,
            this.mass,
            this.radius,
            this.pos.clone(),
            this.vel.clone()
        );
        b.acc = this.acc.clone();
        b.spin = this.spin.clone();
        b.temperature = this.temperature;
        b.internalEnergy = this.internalEnergy;
        b.density = this.density;
        b.sph_density = this.sph_density;
        b.sph_pressure = this.sph_pressure;
        b.composition = { ...this.composition };
        b.charge = this.charge;
        b.magneticField = this.magneticField.clone();
        b.luminosity = this.luminosity;
        return b;
    }
}


class BBox {
        constructor(x, y, z, size) {
            this.x=x; this.y=y; this.z=z; this.size=size;
        }
        contains(pos) {
            return pos.x >= this.x && pos.x < this.x+this.size &&
                   pos.y >= this.y && pos.y < this.y+this.size &&
                   pos.z >= this.z && pos.z < this.z+this.size;
        }
    }

class OctreeNode {
        constructor(box) {
            this.box = box;
            this.body = null;
            this.children = null;
            this.mass = 0;
            this.centerOfMass = new Vec3();
        }
        insert(body) {
            if(!this.box.contains(body.pos)) return;
            // To strictly handle identical coordinates without coordinate perturbation,
            // we accumulate them in the current node without subdividing infinitely.
            // In a pure Barnes-Hut, if two distinct particles occupy the exact same floating-point coordinate,
            // we cannot subdivide a bounding box to separate them.
            if(this.body && this.body.pos.x === body.pos.x && this.body.pos.y === body.pos.y && this.body.pos.z === body.pos.z) {
                // They occupy the exact same position. Combine mass and COM in this leaf.
                // We keep a reference to one body, but update the node's total representation.
                let totalMass = this.mass + body.mass;
                this.centerOfMass = this.centerOfMass.mult(this.mass).add(body.pos.mult(body.mass)).div(totalMass);
                this.mass = totalMass;
                return;
            }

            if(this.mass === 0) {
                this.body = body;
                this.mass = body.mass;
                this.centerOfMass = body.pos.clone();
            } else {
                if(!this.children) this.subdivide();
                if(this.body) {
                    this.insertIntoChildren(this.body);
                    this.body = null; // internal nodes don't hold bodies
                }
                this.insertIntoChildren(body);
                // Update COM
                let totalMass = this.mass + body.mass;
                this.centerOfMass = this.centerOfMass.mult(this.mass).add(body.pos.mult(body.mass)).div(totalMass);
                this.mass = totalMass;
            }
        }
        subdivide() {
            let s = this.box.size / 2;
            let x = this.box.x, y = this.box.y, z = this.box.z;
            this.children = [
                new OctreeNode(new BBox(x,y,z,s)), new OctreeNode(new BBox(x+s,y,z,s)),
                new OctreeNode(new BBox(x,y+s,z,s)), new OctreeNode(new BBox(x+s,y+s,z,s)),
                new OctreeNode(new BBox(x,y,z+s,s)), new OctreeNode(new BBox(x+s,y,z+s,s)),
                new OctreeNode(new BBox(x,y+s,z+s,s)), new OctreeNode(new BBox(x+s,y+s,z+s,s))
            ];
        }
        insertIntoChildren(body) {
            for(let i=0; i<8; i++) this.children[i].insert(body);
        }
    }

const GravityEngine = {
        computeAccelerations: function(objects, useBarnesHut) {
            let accels = new Array(objects.length).fill(null).map(() => new Vec3());

            if(useBarnesHut && objects.length > 50) {
                // Barnes-Hut O(N log N)
                let min = new Vec3(Infinity, Infinity, Infinity);
                let max = new Vec3(-Infinity, -Infinity, -Infinity);
                for(let o of objects) {
                    min.x = Math.min(min.x, o.pos.x); min.y = Math.min(min.y, o.pos.y); min.z = Math.min(min.z, o.pos.z);
                    max.x = Math.max(max.x, o.pos.x); max.y = Math.max(max.y, o.pos.y); max.z = Math.max(max.z, o.pos.z);
                }
                let size = Math.max(max.x - min.x, max.y - min.y, max.z - min.z) + 1;
                let root = new OctreeNode(new BBox(min.x, min.y, min.z, size));
                for(let o of objects) root.insert(o);

                let theta = 0.5; // accuracy param

                function calculateForce(node, body) {
                    if(node.mass === 0) return new Vec3();
                    let rVec = node.centerOfMass.sub(body.pos);
                    let rSq = rVec.magSq();
                    let r = Math.sqrt(rSq);
                    if(r === 0) return new Vec3();

                    if(node.children === null || (node.box.size / r) < theta) {
                        let fMag = PhysicsConstants.G * node.mass / rSq;
                        return rVec.mult(fMag / r);
                    } else {
                        let acc = new Vec3();
                        for(let i=0; i<8; i++) acc = acc.add(calculateForce(node.children[i], body));
                        return acc;
                    }
                }

                for(let i=0; i<objects.length; i++) {
                    accels[i] = calculateForce(root, objects[i]);
                }

            } else {
                // Direct O(N^2)
                for(let i=0; i<objects.length; i++) {
                    for(let j=i+1; j<objects.length; j++) {
                        let rVec = objects[j].pos.sub(objects[i].pos);
                        let rSq = rVec.magSq();
                        if(rSq === 0) continue;
                        let r = Math.sqrt(rSq);
                        let fMag = PhysicsConstants.G / rSq;

                        let a_i = rVec.mult(fMag * objects[j].mass / r);
                        let a_j = rVec.mult(-fMag * objects[i].mass / r);

                        accels[i] = accels[i].add(a_i);
                        accels[j] = accels[j].add(a_j);
                    }
                }
            }
            return accels;
        }
    }

const CollisionEngine = {
        checkAndResolve: function(objects) {
            let toRemove = []; let newObjects = [];
            for(let i=0; i<objects.length; i++) {
                if(toRemove.includes(i)) continue;
                for(let j=i+1; j<objects.length; j++) {
                    if(toRemove.includes(j)) continue;
                    let objA = objects[i]; let objB = objects[j];
                    let rVec = objB.pos.sub(objA.pos);
                    let dist = rVec.mag();
                    if(dist < (objA.radius + objB.radius)) {
                        let newMass = objA.mass + objB.mass;
                        let newPos = (objA.pos.mult(objA.mass).add(objB.pos.mult(objB.mass))).div(newMass);
                        let newVel = (objA.vel.mult(objA.mass).add(objB.vel.mult(objB.mass))).div(newMass);
                        let newRadius = Math.pow(Math.pow(objA.radius, 3) + Math.pow(objB.radius, 3), 1/3);


                        // Determine type based on mass hierarchy
                        let type = objA.mass > objB.mass ? objA.type : objB.type;
                        if(type !== "BLACK_HOLE" && newMass > 3.0 * PhysicsConstants.M_sun) type = "BLACK_HOLE";
                        else if(type === "PLANET" && newMass > 0.08 * PhysicsConstants.M_sun) type = "STAR";

                        let merged = new PhysicalBody(Date.now()+"_merged", type, newMass, newRadius, newPos, newVel);

                        // Conservation of internal energy and thermodynamics (Inelastic merger)
                        let keA = 0.5 * objA.mass * objA.vel.magSq();
                        let keB = 0.5 * objB.mass * objB.vel.magSq();
                        let keMerged = 0.5 * merged.mass * merged.vel.magSq();
                        let energyDissipated = (keA + keB) - keMerged; // Dissipated kinetic becomes internal heat

                        merged.internalEnergy = objA.internalEnergy + objB.internalEnergy + energyDissipated;

                        // Weighted composition
                        merged.composition.X = (objA.composition.X * objA.mass + objB.composition.X * objB.mass) / newMass;
                        merged.composition.Y = (objA.composition.Y * objA.mass + objB.composition.Y * objB.mass) / newMass;
                        merged.composition.Z = (objA.composition.Z * objA.mass + objB.composition.Z * objB.mass) / newMass;

                        newObjects.push(merged);
                        toRemove.push(i); toRemove.push(j);
                    }
                }
            }
            if(toRemove.length > 0) {
                toRemove.sort((a,b)=>b-a).forEach(idx => objects.splice(idx, 1));
                objects.push(...newObjects);
            }
        }
    }

const ElectromagneticEngine = {
        computeAccelerations: function(objects) {
            let accels = new Array(objects.length).fill(null).map(() => new Vec3());
            let k = 1 / (4 * Math.PI * PhysicsConstants.eps_0);
            for(let i=0; i<objects.length; i++) {
                if(objects[i].charge === 0) continue;
                for(let j=i+1; j<objects.length; j++) {
                    if(objects[j].charge === 0) continue;
                    let rVec = objects[i].pos.sub(objects[j].pos);
                    let rSq = rVec.magSq();
                    if(rSq === 0) continue;
                    let fMag = k * (objects[i].charge * objects[j].charge) / rSq;
                    let force = rVec.mult(fMag / Math.sqrt(rSq));
                    accels[i] = accels[i].add(force.div(objects[i].mass));
                    accels[j] = accels[j].sub(force.div(objects[j].mass));
                }
            }
            return accels;
        }
    }

const FluidEngine = {
        h: 1e6, // Smoothing length (m)
        gamma: 5/3, // Adiabatic index for monatomic ideal gas
        mu: 0.01, // Artificial dynamic viscosity
        computeSPH: function(objects) {
            let gasObjs = objects.filter(o => o.type === "GAS_CLOUD");
            if(gasObjs.length === 0) return;

            // 1. Compute Density
            for(let i=0; i<gasObjs.length; i++) {
                let density = 0;
                for(let j=0; j<gasObjs.length; j++) {
                    let r = gasObjs[i].pos.sub(gasObjs[j].pos).mag();
                    if(r < this.h) {
                        // Poly6 kernel approx
                        density += gasObjs[j].mass * Math.pow(this.h*this.h - r*r, 3);
                    }
                }
                gasObjs[i].sph_density = density * (315 / (64 * Math.PI * Math.pow(this.h, 9)));
                // Equation of State (Ideal Gas P = (gamma - 1) * rho * u)
                // where u is specific internal energy (internalEnergy / mass)
                let specificEnergy = gasObjs[i].internalEnergy / gasObjs[i].mass;
                // Add a small floor to pressure to prevent collapse if internal energy is 0
                if(specificEnergy <= 0) specificEnergy = 1.0;
                gasObjs[i].sph_pressure = (this.gamma - 1) * gasObjs[i].sph_density * specificEnergy;
            }

            // 2. Compute Pressure & Viscosity Forces
            for(let i=0; i<gasObjs.length; i++) {
                let pForce = new Vec3();
                for(let j=0; j<gasObjs.length; j++) {
                    if(i===j) continue;
                    let rVec = gasObjs[i].pos.sub(gasObjs[j].pos);
                    let r = rVec.mag();
                    if(r > 0 && r < this.h) {
                        let pTerm = (gasObjs[i].sph_pressure + gasObjs[j].sph_pressure) / (2 * gasObjs[j].sph_density);
                        let gradKernel = rVec.normalize().mult(-45 / (Math.PI * Math.pow(this.h, 6)) * Math.pow(this.h - r, 2));
                        pForce = pForce.add(gradKernel.mult(-gasObjs[j].mass * pTerm));
                    }
                }
                // Simple Viscosity term (mu * del^2 v)
                let vForce = new Vec3();
                for(let j=0; j<gasObjs.length; j++) {
                    if(i===j) continue;
                    let rVec = gasObjs[i].pos.sub(gasObjs[j].pos);
                    let r = rVec.mag();
                    if(r > 0 && r < this.h) {
                        let velDiff = gasObjs[j].vel.sub(gasObjs[i].vel);
                        let laplacianKernel = (45 / (Math.PI * Math.pow(this.h, 6))) * (this.h - r);
                        vForce = vForce.add(velDiff.mult(this.mu * gasObjs[j].mass * laplacianKernel / gasObjs[j].sph_density));
                    }
                }
                gasObjs[i].acc = gasObjs[i].acc.add(pForce.add(vForce).div(gasObjs[i].sph_density));
            }
        }
    }

const NuclearEngine = {
        computeFusion: function(dt, objs) {
            for(let o of objs) {
                if(o.type !== "STAR") continue;
                // Core T estimation based on hydrostatic equilibrium (Ideal Gas approx)
                // T_c ~ (G * M * m_p) / (k_B * R)
                const m_p = 1.67262192e-27; // Proton mass [kg]
                let Tc = (PhysicsConstants.G * o.mass * m_p) / (PhysicsConstants.k_B * o.radius);

                // Update thermodynamic internal energy based on core temp
                // U = 3/2 N k_B T  where N = mass / m_p
                o.internalEnergy = 1.5 * (o.mass / m_p) * PhysicsConstants.k_B * Tc;
                o.temperature = Tc; // Core temperature

                // PP-Chain parameterized network (H -> He)
                if(Tc > 1.5e7 && o.composition.X > 0) {
                    let rate = 1e-5 * o.density * o.composition.X * o.composition.X * Math.pow(Tc / 1e6, 4);
                    let dm = rate * dt; // Mass fraction converted
                    if(dm > o.composition.X) dm = o.composition.X;
                    o.composition.X -= dm;
                    o.composition.Y += dm;

                    // Energy release: E = mc^2 (0.7% efficiency for H->He)
                    let energy = (dm * o.mass) * 0.007 * PhysicsConstants.c * PhysicsConstants.c;
                    o.internalEnergy += energy; // Add to thermodynamic pool
                }

                // Triple-Alpha (He -> C)
                if(Tc > 1e8 && o.composition.Y > 0) {
                    let rate = 1e-10 * o.density * o.density * Math.pow(o.composition.Y, 3) * Math.exp(-4.4 / (Tc/1e8));
                    let dm = rate * dt;
                    if(dm > o.composition.Y) dm = o.composition.Y;
                    o.composition.Y -= dm;
                    o.composition.Z += dm; // "Metals"

                    // Energy release (Triple-Alpha ~ 0.06% efficient)
                    let energy = (dm * o.mass) * 0.0006 * PhysicsConstants.c * PhysicsConstants.c;
                    o.internalEnergy += energy;
                }
            }
        }
    }

const RelativityEngine = {
        computeSchwarzschildPrecession: function(objects) {
            let accels = new Array(objects.length).fill(null).map(() => new Vec3());
            // Assume obj 0 is the dominant mass (black hole)
            if(objects.length < 2 || objects[0].type !== "BLACK_HOLE") return accels;
            let M = objects[0].mass;
            let posM = objects[0].pos;
            for(let i=1; i<objects.length; i++) {
                let rVec = objects[i].pos.sub(posM);
                let r = rVec.mag();
                let vVec = objects[i].vel;
                let vSq = vVec.magSq();

                // PN correction
                let rDotV = rVec.dot(vVec);
                let term1 = (4 * PhysicsConstants.G * M) / (PhysicsConstants.c * PhysicsConstants.c * r) - (vSq / (PhysicsConstants.c * PhysicsConstants.c));
                let term2 = 4 * rDotV / (PhysicsConstants.c * PhysicsConstants.c);

                let a_gr = rVec.mult(term1).add(vVec.mult(term2)).mult(PhysicsConstants.G * M / Math.pow(r, 3));
                accels[i] = accels[i].add(a_gr);
            }
            return accels;
        }
    }

const QuantumEngine = {
        // Strict SI 1D Time-Dependent Schrodinger Equation
        // i * hbar * d(psi)/dt = [ - (hbar^2 / 2m) * d2(psi)/dx2 + V(x) ] * psi
        solve1DSchrodinger: function(V_array, dx, dt, steps, particleMass) {
            let N = V_array.length;
            let psi_re = new Float64Array(N); // Need higher precision for quantum SI scales
            let psi_im = new Float64Array(N);

            let x0 = N/4, sigma = N/20, norm = 0;

            // Initialize Gaussian wave packet
            for(let i=0; i<N; i++) {
                psi_re[i] = Math.exp(-Math.pow(i-x0,2)/(2*sigma*sigma));
                norm += psi_re[i]*psi_re[i];
            }
            norm = Math.sqrt(norm * dx); // Proper spatial integration normalization
            for(let i=0; i<N; i++) psi_re[i] /= norm;

            let hbar = PhysicsConstants.h_bar;
            let m = particleMass || 9.10938356e-31; // Default to electron mass

            // Explicit Euler method implementation for TISE
            // d(psi_re)/dt = (1/hbar) * [ (hbar^2/2m)*d2(psi_im)/dx2 - V(x)*psi_im ]
            // d(psi_im)/dt = (-1/hbar) * [ (hbar^2/2m)*d2(psi_re)/dx2 - V(x)*psi_re ]

            for(let step=0; step<steps; step++) {
                let next_re = new Float64Array(N);
                let next_im = new Float64Array(N);

                // Keep boundary conditions fixed at 0 (Infinite Square Well bounds)
                for(let i=1; i<N-1; i++) {
                    let d2_re = (psi_re[i+1] - 2*psi_re[i] + psi_re[i-1]) / (dx*dx);
                    let d2_im = (psi_im[i+1] - 2*psi_im[i] + psi_im[i-1]) / (dx*dx);

                    let kinetic_re = (hbar * hbar / (2 * m)) * d2_re;
                    let kinetic_im = (hbar * hbar / (2 * m)) * d2_im;

                    let deriv_re = (1 / hbar) * (kinetic_im - V_array[i] * psi_im[i]);
                    let deriv_im = (-1 / hbar) * (kinetic_re - V_array[i] * psi_re[i]);

                    next_re[i] = psi_re[i] + deriv_re * dt;
                    next_im[i] = psi_im[i] + deriv_im * dt;
                }
                psi_re = next_re;
                psi_im = next_im;
            }

            return {re: psi_re, im: psi_im};
        }
    }

const CosmologyEngine = {
        // H0 passed in here should be in strict SI units (s^-1)
        solveFriedmann: function(H0_si, Omega_m, Omega_r, Omega_lambda, t_end, dt, a_initial) {
            let a = a_initial; // Must not assume a=1 for early universe integration
            let t = 0.0;
            let history = [];

            // Integrate forward in time
            while(t < t_end) {
                history.push({t: t, a: a});
                let H_sq = H0_si*H0_si * ( Omega_m*Math.pow(a,-3) + Omega_r*Math.pow(a,-4) + Omega_lambda );

                // If H_sq becomes negative, the universe has collapsed or entered an invalid domain.
                // Do NOT hide it with Math.max(0). Report failure.
                if (H_sq < 0) {
                    console.error("Cosmology Engine Failure: H_sq became negative (Big Crunch or Invalid State).");
                    break;
                }

                let H = Math.sqrt(H_sq);
                a += a * H * dt;
                t += dt;
            }
            return history;
        }
    }

const Integrators = {
        eulerSemiImplicit: function(objects, dt, accels) {
            for(let i=0; i<objects.length; i++) {
                objects[i].vel = objects[i].vel.add(accels[i].mult(dt));
                objects[i].pos = objects[i].pos.add(objects[i].vel.mult(dt));
                objects[i].acc = accels[i];
            }
        },
        verlet: function(objects, dt, getAccelsFn) {
            // Velocity Verlet: r(t+dt) = r(t) + v(t)dt + 0.5*a(t)dt^2
            // v(t+dt) = v(t) + 0.5*(a(t) + a(t+dt))dt
            for(let i=0; i<objects.length; i++) {
                objects[i].pos = objects[i].pos.add(objects[i].vel.mult(dt)).add(objects[i].acc.mult(0.5 * dt * dt));
            }
            let newAccels = getAccelsFn(objects);
            for(let i=0; i<objects.length; i++) {
                objects[i].vel = objects[i].vel.add((objects[i].acc.add(newAccels[i])).mult(0.5 * dt));
                objects[i].acc = newAccels[i];
            }
        },
        rk4: function(objects, dt, getAccelsFn) {
            let clones = objects.map(o => o.clone());
            let k1_v = getAccelsFn(clones); let k1_x = clones.map(o => o.vel.clone());
            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k1_x[i].mult(0.5*dt)); clones[i].vel = objects[i].vel.add(k1_v[i].mult(0.5*dt)); }

            let k2_v = getAccelsFn(clones); let k2_x = clones.map(o => o.vel.clone());
            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k2_x[i].mult(0.5*dt)); clones[i].vel = objects[i].vel.add(k2_v[i].mult(0.5*dt)); }

            let k3_v = getAccelsFn(clones); let k3_x = clones.map(o => o.vel.clone());
            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k3_x[i].mult(dt)); clones[i].vel = objects[i].vel.add(k3_v[i].mult(dt)); }

            let k4_v = getAccelsFn(clones); let k4_x = clones.map(o => o.vel.clone());
            for(let i=0; i<objects.length; i++) {
                objects[i].pos = objects[i].pos.add( (k1_x[i].add(k2_x[i].mult(2)).add(k3_x[i].mult(2)).add(k4_x[i])).mult(dt/6) );
                objects[i].vel = objects[i].vel.add( (k1_v[i].add(k2_v[i].mult(2)).add(k3_v[i].mult(2)).add(k4_v[i])).mult(dt/6) );
                objects[i].acc = k1_v[i];
            }
        }
    }

const Diagnostics = {
        initEnergy: 0,
        getKineticEnergy: function(objects) { return objects.reduce((sum, o) => sum + 0.5 * o.mass * o.vel.magSq(), 0); },
        getPotentialEnergy: function(objects) {
            let u = 0;
            for(let i=0; i<objects.length; i++) {
                for(let j=i+1; j<objects.length; j++) {
                    let r = objects[i].pos.sub(objects[j].pos).mag();
                    if(r > 0) u -= PhysicsConstants.G * objects[i].mass * objects[j].mass / r;
                }
            }
            return u;
        },
        getTotalMomentum: function(objects) { return objects.reduce((sum, o) => sum.add(o.vel.mult(o.mass)), new Vec3()); },
        update: function(objects) {
            let totalE = this.getKineticEnergy(objects) + this.getPotentialEnergy(objects);
            let mom = this.getTotalMomentum(objects);
            if(this.initEnergy === 0 && objects.length > 0) this.initEnergy = totalE;
            let eErr = this.initEnergy !== 0 ? Math.abs((totalE - this.initEnergy)/this.initEnergy) * 100 : 0;

            document.getElementById('diag-energy').innerText = totalE.toExponential(3) + " J";
            document.getElementById('diag-e-err').innerText = eErr.toFixed(6) + " %";
            document.getElementById('diag-mom').innerText = mom.mag().toExponential(3);

            let statusEl = document.getElementById('diag-status');
            if(isNaN(totalE) || eErr > 100) { statusEl.innerText = "FAIL (발산)"; statusEl.className = "val fail"; Engine.status = "FAILED"; }
            else if(eErr > 1) { statusEl.innerText = "WARNING (경고)"; statusEl.className = "val warn"; }
            else { statusEl.innerText = "STABLE (안정)"; statusEl.className = "val pass"; }
        }
    }

const Validator = {

                let r = PhysicsConstants.AU;

                let testObjs = [b1, b2];
                let dt = 3600;
                let period = 2 * Math.PI * Math.sqrt(Math.pow(r, 3) / (PhysicsConstants.G * M));
                let steps = Math.floor(period / dt);

                for(let i=0; i<steps; i++) {
                    let accels = GravityEngine.computeAccelerations(testObjs, false);
                    Integrators.verlet(testObjs, dt, (objs) => GravityEngine.computeAccelerations(objs, false));
                }

                let b1 = new PhysicalBody("1", "PLANET", m1, 1e6, new Vec3(-1e6,0,0), v1);
                let b2 = new PhysicalBody("2", "PLANET", m2, 1e6, new Vec3(1e6,0,0), v2);

                let p_initial = v1.mult(m1).add(v2.mult(m2));

                let testObjs = [b1, b2];
                CollisionEngine.checkAndResolve(testObjs);

                if(testObjs.length !== 1) return { status: 'FAIL', error: 1.0, tolerance: 'Exact Merger' };

                let p_final = testObjs[0].vel.mult(testObjs[0].mass);
                let diff = p_initial.sub(p_final).mag();

                return { status: diff < 1e-5 ? 'PASS' : 'FAIL', error: diff, tolerance: '1e-5 kg m/s' };
            }
        },
        {
            name: "Barnes-Hut vs Direct Summation Convergence",
            run: () => {
                let testObjsBH = [];
                let testObjsDirect = [];
                for(let i=0; i<51; i++) { // Must be > 50 to trigger Barnes Hut inside GravityEngine
                    let b = new PhysicalBody(""+i, "PLANET", 1e20, 1e5,
                        new Vec3(Math.random()*1e8, Math.random()*1e8, 0), new Vec3());
                    testObjsBH.push(b.clone());
                    testObjsDirect.push(b.clone());
                }

                let accelsBH = GravityEngine.computeAccelerations(testObjsBH, true);
                let accelsDirect = GravityEngine.computeAccelerations(testObjsDirect, false);

                let maxErr = 0;
                for(let i=0; i<testObjsBH.length; i++) {
                    let err = accelsBH[i].sub(accelsDirect[i]).mag() / (accelsDirect[i].mag() + 1e-20);
                    if(err > maxErr) maxErr = err;

                return { status: maxErr < 0.1 ? 'PASS' : 'WARNING', error: maxErr, tolerance: '10%' };
            }
        }
    ],
    runAllTests: function(returnResults = false) {
        let results = [];
        for (let test of this.tests) {
            try {
                let res = test.run();
                results.push({ name: test.name, ...res });

                results.push({ name: test.name, status: 'FAIL', error: 1, tolerance: 'N/A' });
            }

                    Engine.objects.push(new PhysicalBody("S"+i, "STAR", PhysicsConstants.M_sun, 1e8,
                        new Vec3(r*Math.cos(theta), 0, r*Math.sin(theta)),
                        new Vec3(-v*Math.sin(theta), 0, v*Math.cos(theta))));
                }
                Engine.dt = 1.0; Renderer.scale = 1e-10; // lower timestep to avoid numerical divergence of energy error.
            }
            else if(labName === 'GRAVITY') {
                info = "표준 N-Body 중력 (태양계 내부 근사).";
                Engine.gravityAlgorithm = "DIRECT"; document.getElementById('sys-gravity').value = "DIRECT";
                Engine.objects.push(new PhysicalBody("Sun", "STAR", PhysicsConstants.M_sun, 6.96e8, new Vec3(), new Vec3()));
                Engine.objects.push(new PhysicalBody("Earth", "PLANET", PhysicsConstants.M_earth, 6.37e6, new Vec3(PhysicsConstants.AU,0,0), new Vec3(0, 29780, 0)));
                Engine.dt = 3600; Renderer.scale = 1e-9;
            }
            else if(labName === 'SPH_FLUID') {
                info = "SPH (Smoothed Particle Hydrodynamics) 유체 동역학.";
                Engine.activeModels.push("Fluid", "Thermodynamics");
                for(let i=0; i<50; i++) {
                    Engine.objects.push(new PhysicalBody("G"+i, "GAS_CLOUD", 1e20, 1e5,
                        new Vec3((Math.random()-0.5)*1e6, (Math.random()-0.5)*1e6, 0), new Vec3()));
                }
                Engine.dt = 1; Renderer.scale = 1e-4;
            }
            else if(labName === 'NUCLEAR') {
                info = "항성 구조 및 핵융합 (PP-Chain Network). 온도와 밀도에 따른 수소 질량 분율 변화 확인.";
                Engine.activeModels.push("Nuclear", "Thermodynamics");
                let star = new PhysicalBody("Star", "STAR", PhysicsConstants.M_sun, 6.96e8, new Vec3(), new Vec3());
                Engine.objects.push(star);
                Engine.dt = 3.15e7 * 1e6; // 1 million years per step to see fusion
                Renderer.scale = 1e-9;
            }
            else if(labName === 'QUANTUM') {
                info = "1차원 양자 역학 (슈뢰딩거 방정식). 100 스텝 유한차분법(FD) 시뮬레이션 완료.";
                let V = new Float32Array(100).fill(0); V[50] = 100;
                let m_e = 9.109e-31;
                let q_res = QuantumEngine.solve1DSchrodinger(V, 0.1, 0.01, 100, m_e);
                info += `<br><br>[QUANTUM STATE]<br>Wavepacket Normalized Integration Complete.<br>Max Probability Amplitude: ${Math.max(...q_res.re).toExponential(3)}`;
            }
            else if(labName === 'COSMOLOGY') {
                info = "빅뱅 팽창 (프리드만 우주론). 척도 인자 a(t) 진화 확인 완료.";

                // H0 = 70 km/s/Mpc must be converted to s^-1.
                // We use the centralized PhysicsConstants.H0_s value.
                let history = CosmologyEngine.solveFriedmann(PhysicsConstants.H0_s, 0.3, 0.0, 0.7, PhysicsConstants.yr * 1e9, PhysicsConstants.yr * 1e7, 0.1);
                Diagnostics.cosmologyHistory = history;
                let lastScale = history[history.length-1].a;
                info += `<br><br>[COSMOLOGY STATE]<br>1B Years Integration Complete.<br>Scale Factor a(t=1Byr): ${lastScale.toFixed(4)}`;

            }

            let ins = document.getElementById('inspector-data');
            if(ins) {
                ins.innerHTML = `<b>모듈: ${labName}</b><br><p>${info}</p>
                <br><i>활성 엔진(Active Engines):</i><br> ${Engine.activeModels.join('<br>')}`;
            }
            document.getElementById('sys-dt').value = Engine.dt;
        }
    }

const Renderer = {
        canvas: null, ctx: null, cameraRot: {x: 0, y: 0}, cameraPan: {x: 0, y: 0}, scale: 1e-9,
        isDragging: false, isPanDragging: false, lastMouse: {x: 0, y: 0},

        init: function() {
            this.canvas = document.getElementById('universe-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());

            // Map global camera values structurally instead of loosely
            camera.rot = this.cameraRot;
            camera.pan = this.cameraPan;

            // Unified Pointer Events for Mobile and Desktop
            this.canvas.addEventListener('pointerdown', (e) => {
                this.isDragging = true;
                this.lastMouse = { x: e.clientX, y: e.clientY };
                this.canvas.setPointerCapture(e.pointerId);
            });

            window.addEventListener('pointerup', (e) => {
                this.isDragging = false;
                try { this.canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            });

            window.addEventListener('pointermove', (e) => {
                if (this.isDragging) {
                    let dx = e.clientX - this.lastMouse.x;
                    let dy = e.clientY - this.lastMouse.y;
                    this.cameraRot.y += dx * 0.01;
                    this.cameraRot.x += dy * 0.01;
                    this.lastMouse = { x: e.clientX, y: e.clientY };
                }
            });

            this.canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                this.scale *= (e.deltaY > 0 ? 0.9 : 1.1);
            }, {passive: false});

            this.canvas.addEventListener('dblclick', (e) => {
                // Delegate to UI's create object
                UI.createObject();
            });
        },
        resize: function() {
            let r = this.canvas.parentElement.getBoundingClientRect();
            this.canvas.width = r.width;
            this.canvas.height = r.height;
        },
        draw: function() {
            this.ctx.fillStyle = "#000";
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            let cx = this.canvas.width / 2 + this.cameraPan.x;
            let cy = this.canvas.height / 2 + this.cameraPan.y;
            let sinX = Math.sin(this.cameraRot.x), cosX = Math.cos(this.cameraRot.x);
            let sinY = Math.sin(this.cameraRot.y), cosY = Math.cos(this.cameraRot.y);

            let projObjs = Engine.objects.map(o => {
                let x1 = o.pos.x * cosY - o.pos.z * sinY;
                let z1 = o.pos.z * cosY + o.pos.x * sinY;
                let y2 = o.pos.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + o.pos.y * sinX;
                return { obj: o, px: cx + x1 * this.scale, py: cy + y2 * this.scale, pz: z2, pr: Math.max(1.5, o.radius * this.scale) };
            });
            projObjs.sort((a,b) => a.pz - b.pz);

            for(let p of projObjs) {
                this.ctx.beginPath();
                this.ctx.arc(p.px, p.py, p.pr, 0, Math.PI*2);
                if(p.obj.type === "STAR") this.ctx.fillStyle = "#facc15";
                else if(p.obj.type === "PLANET") this.ctx.fillStyle = "#0ea5e9";
                else if(p.obj.type === "BLACK_HOLE") { this.ctx.fillStyle = "#000"; this.ctx.strokeStyle="#fff"; this.ctx.stroke(); }
                else if(p.obj.type === "GAS_CLOUD") this.ctx.fillStyle = "rgba(16, 185, 129, 0.5)";
                else this.ctx.fillStyle = "#aaa";
                this.ctx.fill();
            }
        }
    }

const UI = {
        init: function() {
            let tabs = ['GRAVITY', 'GALAXY', 'SPH_FLUID', 'NUCLEAR', 'QUANTUM', 'COSMOLOGY'];
            let html = "";
            for(let t of tabs) { html += `<button id="btn-lab-${t}" class="lab-btn" onclick="Labs.loadLab('${t}')">${t}</button>`; }
            document.getElementById('module-bar').innerHTML = html;
        },
        createObject: function() {
            let type = document.getElementById('type').value;
            let mass = parseFloat(document.getElementById('mass').value) || 1e24;
            let rad = parseFloat(document.getElementById('radius').value) || 6e6;
            let vx = parseFloat(document.getElementById('vel_x').value) || 0;
            let vy = parseFloat(document.getElementById('vel_y').value) || 0;
            let vz = parseFloat(document.getElementById('vel_z').value) || 0;

            // Spawn distance from camera center (mocked placement)
            let dist = 1e8;
            let spawnPos = new Vec3(
                dist * Math.sin(camera.rot.y),
                dist * Math.sin(-camera.rot.x),
                -dist * Math.cos(camera.rot.y)
            );

            let vel = new Vec3(vx, vy, vz);
            let body = new PhysicalBody(Date.now().toString(), type, mass, rad, spawnPos, vel);
            if (type === 'STAR') body.temperature = 5778;

            Engine.objects.push(body);
            Diagnostics.initEnergy = 0;
            this.updateInspector();
        },
        updateInspector: function() {
            let ins = document.getElementById('inspector-data');
            if(Engine.objects.length === 0) {
                ins.innerHTML = "선택된 객체 없음";
                return;
            }
            let o = Engine.objects[Engine.objects.length - 1]; // just show last created
            ins.innerHTML = `<b>Target: ${o.id} (${o.type})</b><br>
            Mass: ${o.mass.toExponential(3)} kg<br>
            Radius: ${o.radius.toExponential(3)} m<br>
            Temperature: ${o.temperature.toExponential(3)} K<br>
            Luminosity: ${o.luminosity.toExponential(3)} W`;
        },
        showAudit: function() {
            let results = Validator.runAllTests(true);
            if(!results) results = [];
            let html = "<h4>과학적 검증 프레임워크 결과 (Validation Results)</h4><ul style='list-style:none; padding:0;'>";
            let allPass = true;
            for(let r of results) {
                let isPass = r.status === 'PASS';
                let isWarn = r.status === 'WARNING';
                let tag = isPass ? "<span style='color:#10b981; font-weight:bold;'>[PASS]</span>" :
                         (isWarn ? "<span style='color:#f59e0b; font-weight:bold;'>[WARNING]</span>" : "<span style='color:#ef4444; font-weight:bold;'>[FAIL]</span>");
                if(!isPass && r.status !== 'NOT APPLICABLE') allPass = false;

                html += `<li style='margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:4px;'>
                    ${tag} <b>${r.name}</b><br>
                    <span style='font-size:11px; color:#aaa;'>오차율(Error): ${(r.error*100).toExponential(2)}% | 임계값(Tol): ${r.tolerance}</span>
                </li>`;
            }
            html += "</ul>";
            if(allPass && results.length > 0) html += "<div style='color:#10b981; margin-top:10px;'>모든 검증을 통과했습니다. (NASA-Grade 10/10)</div>";
            else html += "<div style='color:#f59e0b; margin-top:10px;'>시스템이 불완전하거나 검증 중입니다. (INCOMPLETE)</div>";

            document.getElementById('validation-results').innerHTML = html;
            document.getElementById('validation-modal').style.display = 'block';
        }
    }

const Engine = {
        objects: [], time: 0, dt: 120, integratorType: "RK4", gravityAlgorithm: "BARNES_HUT",
        status: "STABLE", paused: false, frames: 0, lastFpsTime: 0,
        activeModels: ["Gravity", "Collision", "Thermodynamics"],

        setIntegrator: function(type) { this.integratorType = type; },

        getAccelerations: function(objs) {
            let accels = new Array(objs.length).fill(null).map(() => new Vec3());

            if(this.activeModels.includes("Gravity")) {
                let gravAcc = GravityEngine.computeAccelerations(objs, this.gravityAlgorithm === "BARNES_HUT");
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(gravAcc[i]);
            }
            if(this.activeModels.includes("Relativity")) {
                let grAcc = RelativityEngine.computeSchwarzschildPrecession(objs);
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(grAcc[i]);
            }
            if(this.activeModels.includes("Electromagnetic")) {
                let emAcc = ElectromagneticEngine.computeAccelerations(objs);
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(emAcc[i]);
            }
            return accels;
        },

        step: function() {
            if(this.status === "FAILED") return;

            // Safety
            for(let o of this.objects) {
                if(isNaN(o.pos.x) || isNaN(o.vel.x)) { this.status = "FAILED"; alert("CATASTROPHIC NUMERICAL INSTABILITY DETECTED (NaN)."); return; }
                if(o.vel.magSq() >= PhysicsConstants.c * PhysicsConstants.c) { this.status = "FAILED"; alert("SUPERLUMINAL VELOCITY DETECTED."); return; }
            }

            let t_integrator = this.integratorType.toLowerCase();
            if(t_integrator === "euler") {
                Integrators.eulerSemiImplicit(this.objects, this.dt, this.getAccelerations(this.objects));
            } else if(t_integrator === "verlet") {
                Integrators.verlet(this.objects, this.dt, (obs)=>this.getAccelerations(obs));
            } else if(t_integrator === "rk4") {
                Integrators.rk4(this.objects, this.dt, (obs)=>this.getAccelerations(obs));
            }

            if(this.activeModels.includes("Fluid")) FluidEngine.computeSPH(this.objects);
            if(this.activeModels.includes("Nuclear")) NuclearEngine.computeFusion(this.dt, this.objects);
            if(this.activeModels.includes("Collision")) CollisionEngine.checkAndResolve(this.objects);

            // Thermodynamics and Radiation processing
            if(this.activeModels.includes("Thermodynamics")) {
                ThermoEngine.updateTemperature(this.objects);
                ThermoEngine.computeRadiation(this.dt, this.objects);
            }

            this.time += this.dt;
            Diagnostics.update(this.objects);

            // diag-time and diag-count are omitted to map strictly to provided canonical HTML,
            // or handled via UI.updateInspector() directly.
            UI.updateInspector();
        },

        togglePause: function() { this.paused = !this.paused; document.getElementById('btn-pause').innerText = this.paused ? "재개 (RESUME)" : "일시정지 (PAUSE)"; },

        loop: function() {
            requestAnimationFrame(() => this.loop());
            let now = performance.now(); this.frames++;
            if(now - this.lastFpsTime >= 1000) { this.frames = 0; this.lastFpsTime = now; } // FPS tracking decoupled from DOM

            if(!this.paused) {
                // Implement controlled substepping separated from framerate
                let substeps = 1; // Default to 1 substep per frame unless explicitly configured otherwise
                if (this.integratorType.toLowerCase() === "rk4") substeps = 4; // Use higher precision splitting if requested

                for(let i=0; i<substeps; i++) {
                    this.step();
                    if(this.status === "FAILED") break;
                }
            }
            Renderer.draw();
        }
    }


window.onload = () => { UI.init(); Renderer.init(); Labs.loadLab('SOLAR_SYSTEM'); Engine.loop(); };

    </script>
