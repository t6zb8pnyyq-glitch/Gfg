<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universe Creator — Scientific Computational Physics Laboratory</title>
    <style>
:root {
                --bg: #000000;
                --text: #e0e0e0;
                --panel: rgba(10, 10, 15, 0.9);
                --border: #38bdf8;
                --accent: #0284c7;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
            }
            body {
                margin: 0; padding: 0; background: var(--bg); color: var(--text);
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', monospace; overflow: hidden;
                display: flex; flex-direction: column; height: 100vh;
            }
            /* Layout */
            #top-bar { height: 45px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; font-weight: bold; overflow-x: auto; white-space: nowrap; }
            #main-area { display: flex; flex: 1; height: calc(100vh - 85px); position: relative; }
            .panel-col { width: 320px; background: var(--panel); overflow-y: auto; padding: 10px; box-sizing: border-box; font-size: 12px; z-index: 10; border-right: 1px solid var(--border); }
            #right-panel { border-right: none; border-left: 1px solid var(--border); }
            #center-viewport { flex: 1; position: relative; background: #000; overflow: hidden; z-index: 1; }
            #bottom-bar { height: 40px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; z-index: 10; }

            /* Controls */
            select, input, button { background: #1e293b; color: #fff; border: 1px solid var(--border); padding: 5px; font-family: inherit; margin: 3px 0; width: 100%; box-sizing: border-box; }
            button { background: var(--accent); cursor: pointer; font-weight: bold; transition: background 0.2s; }
            button:hover { background: #0369a1; }
            .section { margin-bottom: 15px; border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px; background: rgba(15, 23, 42, 0.6); }
            .section h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--border); border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 5px; }

            canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

            /* UI Elements */
            .lab-btn { margin-right: 5px; background: #1e293b; border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; width: auto; font-size: 11px;}
            .lab-btn.active { background: var(--accent); color: white; }
            table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
            td { padding: 3px 0; border-bottom: 1px dotted #334155; }
            .val { float: right; font-family: monospace; }
            .pass { color: var(--success); }
            .fail { color: var(--danger); }
            .warn { color: var(--warning); }

            /* Modal */
            .modal { display: none; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: var(--panel); border: 2px solid var(--border); z-index: 1000; overflow: auto; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
            #close-modal { float: right; background: var(--danger); width: auto; padding: 5px 15px; border: none;}

            /* Audit UI */
            .audit-tag { display: inline-block; padding: 2px 6px; margin: 2px; border-radius: 3px; font-size: 10px; background: var(--success); color: #000; font-weight: bold; }

/* Universe Creator runtime layout: these IDs are the canonical standalone HTML surface. */
html,body,#layout-container{width:100%;height:100%;min-width:0;min-height:0}
#layout-container{position:relative;display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr) minmax(220px,280px);grid-template-rows:auto minmax(0,1fr) auto;background:#000;overflow:hidden;isolation:isolate}
#module-bar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;overflow-y:hidden;padding:5px 7px;background:rgba(10,10,15,.96);border-bottom:1px solid var(--border);z-index:30;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#module-bar .lab-module{flex:0 0 auto;width:auto;min-width:max-content;margin:0;padding:8px 10px;border-radius:4px;touch-action:manipulation}
#viewport-container{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:#000;z-index:1}
#universe-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
#diagnostics-overlay{position:absolute;top:8px;left:8px;z-index:5;pointer-events:none;font-size:11px;white-space:pre-line;text-shadow:0 1px 2px #000}
.side-panel{position:relative;z-index:20;min-width:0;overflow-y:auto;overflow-x:hidden;padding:10px;background:var(--panel);font-size:12px;box-sizing:border-box;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#creator-panel{grid-column:1;grid-row:2;border-right:1px solid var(--border)}
#inspector-panel{grid-column:3;grid-row:2;border-left:1px solid var(--border)}
#control-bar{grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;padding:5px 7px;background:rgba(10,10,15,.96);border-top:1px solid var(--border);z-index:30;box-sizing:border-box;touch-action:pan-x}
#control-bar>*{flex:0 0 auto}.model-row{display:flex;align-items:center;gap:6px;padding:4px 0;touch-action:manipulation}.model-row input{width:18px;height:18px;margin:0;flex:0 0 auto}
#control-bar button,#control-bar select,#control-bar input{width:auto;margin:0}
#validation-modal{position:fixed!important;z-index:10000!important;box-sizing:border-box;overscroll-behavior:contain;touch-action:pan-y}
#validation-modal button{touch-action:manipulation}
@media (max-width:900px){
  #layout-container{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #viewport-container{grid-column:1;grid-row:2}
  #creator-panel,#inspector-panel{position:absolute;top:0;bottom:0;width:min(86vw,330px);z-index:40;box-shadow:0 0 24px #000;transform:translateX(-105%);transition:transform .16s ease}
  #creator-panel{left:0}
  #inspector-panel{right:0;transform:translateX(105%)}
  #control-bar{grid-column:1;grid-row:3}
}
@media (max-width:600px){
  #module-bar{padding:4px}
  #module-bar .lab-module{padding:9px 11px;font-size:12px}
  #control-bar{gap:4px;padding:4px}
  #control-bar button,#control-bar select,#control-bar input{min-height:38px}
  #validation-modal{top:3%!important;left:3%!important;width:94%!important;height:94%!important;padding:12px!important}
  input,select,button{font-size:16px}
}

.mobile-drawer-btn{display:none!important}@media(max-width:900px){.mobile-drawer-btn{display:block!important;flex:0 0 auto!important;min-width:58px!important;background:#334155!important}.side-panel[data-open="true"]{transform:translateX(0)!important}}

    <script>
    class Vec3 {
        constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
        add(v) { return new Vec3(this.x+v.x, this.y+v.y, this.z+v.z); }
        sub(v) { return new Vec3(this.x-v.x, this.y-v.y, this.z-v.z); }
        mult(s) { return new Vec3(this.x*s, this.y*s, this.z*s); }
        div(s) { return new Vec3(this.x/s, this.y/s, this.z/s); }
        dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
        cross(v) { return new Vec3(this.y*v.z - this.z*v.y, this.z*v.x - this.x*v.z, this.x*v.y - this.y*v.x); }
        magSq() { return this.x*this.x + this.y*this.y + this.z*this.z; }
        mag() { return Math.sqrt(this.magSq()); }
        normalize() { let m = this.mag(); return m === 0 ? new Vec3() : this.div(m); }
        clone() { return new Vec3(this.x, this.y, this.z); }
    }

    // Hubble parameter
    // Represented in s^-1 for internal integration (H0 = 70 km/s/Mpc)
    H0_s: 2.2685e-18            // Hubble constant [s^-1]
};

const UnitConverter = {
    toAU: (meters) => meters / PhysicsConstants.AU,
    fromAU: (au) => au * PhysicsConstants.AU,
    toSolarMass: (kg) => kg / PhysicsConstants.M_sun,
    fromSolarMass: (sm) => sm * PhysicsConstants.M_sun,
    toYears: (seconds) => seconds / PhysicsConstants.yr,
    fromYears: (years) => years * PhysicsConstants.yr
};

 *
 * The single canonical state representation for a physical entity in the Universe Creator.
 * All quantities MUST be in strict SI units.
 */
class PhysicalBody {
    constructor(id, type, mass, radius, pos, vel) {
        this.id = id;
        this.type = type; // e.g., 'star', 'planet', 'blackhole', 'gas'

        // --- Core Mechanical State ---
        this.mass = mass;                 // [kg]
        this.radius = radius;             // [m]
        this.pos = pos;                   // [m] (Vec3)
        this.vel = vel;                   // [m/s] (Vec3)
        this.acc = new Vec3();            // [m/s^2] (Vec3)

        // --- Rigid Body / Rotation ---
        this.spin = new Vec3();           // Angular velocity vector [rad/s]

        // --- Thermodynamics & Fluid State ---
        this.temperature = 2.73;          // Absolute temperature [K] (CMB default)
        this.internalEnergy = 0;          // Total internal energy [J]

        // Fluid/SPH specific
        this.sph_density = 0;             // Local SPH evaluated density [kg/m^3]
        this.sph_pressure = 0;            // Local SPH evaluated pressure [Pa]

        // Derived Mechanical properties (calculated on demand or initialized here)
        this.updateDensity();             // Sets this.density [kg/m^3] based on homogeneous spherical assumption

        // --- Nuclear & Chemical Composition ---
        // Mass fractions must sum to 1.0. X=Hydrogen, Y=Helium, Z=Metals
        this.composition = { X: 0.73, Y: 0.25, Z: 0.02 };

        // --- Electromagnetic ---
        this.charge = 0;                  // [C]
        this.magneticField = new Vec3();  // Intrinsic dipole moment / surface field proxy [T]

        // --- Radiation ---
        this.luminosity = 0;              // [W] (J/s)
    }

    updateDensity() {
        if (this.radius <= 0) {
            this.density = Infinity;
        } else {
            const volume = (4/3) * Math.PI * Math.pow(this.radius, 3);
            this.density = this.mass / volume; // [kg/m^3]
        }
    }

    // Clone creates a deep copy of the state vector for integrators (like RK4)
    clone() {
        let b = new PhysicalBody(
            this.id,
            this.type,
            this.mass,
            this.radius,
            this.pos.clone(),
            this.vel.clone()
        );
        b.acc = this.acc.clone();
        b.spin = this.spin.clone();
        b.temperature = this.temperature;
        b.internalEnergy = this.internalEnergy;
        b.density = this.density;
        b.sph_density = this.sph_density;
        b.sph_pressure = this.sph_pressure;
        b.composition = { ...this.composition };
        b.charge = this.charge;
        b.magneticField = this.magneticField.clone();
        b.luminosity = this.luminosity;
        return b;
    }
}


class BBox {
        constructor(x, y, z, size) {
            this.x=x; this.y=y; this.z=z; this.size=size;
        }
        contains(pos) {
            return pos.x >= this.x && pos.x < this.x+this.size &&
                   pos.y >= this.y && pos.y < this.y+this.size &&
                   pos.z >= this.z && pos.z < this.z+this.size;
        }
    }

class OctreeNode {
        constructor(box) {
            this.box = box;
            this.body = null;
            this.children = null;
            this.mass = 0;
            this.centerOfMass = new Vec3();
        }
        insert(body) {
            if(!this.box.contains(body.pos)) return;
            // To strictly handle identical coordinates without coordinate perturbation,
            // we accumulate them in the current node without subdividing infinitely.
            // In a pure Barnes-Hut, if two distinct particles occupy the exact same floating-point coordinate,
            // we cannot subdivide a bounding box to separate them.
            if(this.body && this.body.pos.x === body.pos.x && this.body.pos.y === body.pos.y && this.body.pos.z === body.pos.z) {
                // They occupy the exact same position. Combine mass and COM in this leaf.
                // We keep a reference to one body, but update the node's total representation.
                let totalMass = this.mass + body.mass;
                this.centerOfMass = this.centerOfMass.mult(this.mass).add(body.pos.mult(body.mass)).div(totalMass);
                this.mass = totalMass;
                return;
            }

            if(this.mass === 0) {
                this.body = body;
                this.mass = body.mass;
                this.centerOfMass = body.pos.clone();
            } else {
                if(!this.children) this.subdivide();
                if(this.body) {
                    this.insertIntoChildren(this.body);
                    this.body = null; // internal nodes don't hold bodies
                }
                this.insertIntoChildren(body);
                // Update COM
                let totalMass = this.mass + body.mass;
                this.centerOfMass = this.centerOfMass.mult(this.mass).add(body.pos.mult(body.mass)).div(totalMass);
                this.mass = totalMass;
            }
        }
        subdivide() {
            let s = this.box.size / 2;
            let x = this.box.x, y = this.box.y, z = this.box.z;
            this.children = [
                new OctreeNode(new BBox(x,y,z,s)), new OctreeNode(new BBox(x+s,y,z,s)),
                new OctreeNode(new BBox(x,y+s,z,s)), new OctreeNode(new BBox(x+s,y+s,z,s)),
                new OctreeNode(new BBox(x,y,z+s,s)), new OctreeNode(new BBox(x+s,y,z+s,s)),
                new OctreeNode(new BBox(x,y+s,z+s,s)), new OctreeNode(new BBox(x+s,y+s,z+s,s))
            ];
        }
        insertIntoChildren(body) {
            for(let i=0; i<8; i++) this.children[i].insert(body);
        }
    }

const CollisionEngine = {
    checkAndResolve(objects) {
        const consumed = new Set();
        const mergedBodies = [];

        for(let i=0;i<objects.length;i++){
            if(consumed.has(i)) continue;
            for(let j=i+1;j<objects.length;j++){
                if(consumed.has(j)) continue;
                const a=objects[i], b=objects[j];
                const d=a.pos.sub(b.pos).mag();
                if(!(d < a.radius+b.radius)) continue;

                const M=a.mass+b.mass;
                const pos=a.pos.mult(a.mass).add(b.pos.mult(b.mass)).div(M);
                const vel=a.vel.mult(a.mass).add(b.vel.mult(b.mass)).div(M);
                const R=Math.cbrt(a.radius**3+b.radius**3);

                let type=a.mass>=b.mass?a.type:b.type;
                if(type!=="BLACK_HOLE" && M>3*PhysicsConstants.M_sun) type="BLACK_HOLE";
                else if(type==="PLANET" && M>0.08*PhysicsConstants.M_sun) type="STAR";

                const merged=new PhysicalBody("merge-"+Date.now()+"-"+i+"-"+j,type,M,R,pos,vel);
                const keA=.5*a.mass*a.vel.magSq(), keB=.5*b.mass*b.vel.magSq(), keM=.5*M*vel.magSq();
                merged.internalEnergy=Math.max(0,a.internalEnergy+b.internalEnergy+Math.max(0,keA+keB-keM));
                merged.composition.X=(a.composition.X*a.mass+b.composition.X*b.mass)/M;
                merged.composition.Y=(a.composition.Y*a.mass+b.composition.Y*b.mass)/M;
                merged.composition.Z=(a.composition.Z*a.mass+b.composition.Z*b.mass)/M;

                // Preserve total angular momentum by converting unresolved orbital/spin
                // angular momentum into rigid-body spin of the merged sphere.
                const LA=a.pos.sub(pos).cross(a.vel.sub(vel).mult(a.mass));
                const LB=b.pos.sub(pos).cross(b.vel.sub(vel).mult(b.mass));
                const IA=(2/5)*a.mass*a.radius*a.radius, IB=(2/5)*b.mass*b.radius*b.radius;
                const spinAngularMomentum=a.spin.mult(IA).add(b.spin.mult(IB));
                const L=LA.add(LB).add(spinAngularMomentum);
                const I=(2/5)*M*R*R;
                merged.spin=I>0?L.div(I):new Vec3();

                if(type==="BLACK_HOLE"){
                    merged.radius=2*PhysicsConstants.G*M/(PhysicsConstants.c**2);
                    merged.updateDensity();
                }
                consumed.add(i); consumed.add(j);
                mergedBodies.push(merged);
                break;
            }
        }
        if(consumed.size){
            const survivors=objects.filter((_,idx)=>!consumed.has(idx));
            objects.length=0;
            objects.push(...survivors,...mergedBodies);
        }
    }
};


const ElectromagneticEngine = {
        computeAccelerations: function(objects) {
            let accels = new Array(objects.length).fill(null).map(() => new Vec3());
            let k = 1 / (4 * Math.PI * PhysicsConstants.eps_0);
            for(let i=0; i<objects.length; i++) {
                if(objects[i].charge === 0) continue;
                for(let j=i+1; j<objects.length; j++) {
                    if(objects[j].charge === 0) continue;
                    let rVec = objects[i].pos.sub(objects[j].pos);
                    let rSq = rVec.magSq();
                    if(rSq === 0) continue;
                    let fMag = k * (objects[i].charge * objects[j].charge) / rSq;
                    let force = rVec.mult(fMag / Math.sqrt(rSq));
                    accels[i] = accels[i].add(force.div(objects[i].mass));
                    accels[j] = accels[j].sub(force.div(objects[j].mass));
                }
            }
            return accels;
        }
    }

const EOS = {
    radiationConstant: 4*PhysicsConstants.sigma_sb/PhysicsConstants.c,
    atomicMassUnit: 1.66053906660e-27,

    meanMolecularWeight(comp={X:0.73,Y:0.25,Z:0.02}, ionized=true) {
        const X=comp.X??0, Y=comp.Y??0, Z=comp.Z??0;
        if(ionized) return 1/Math.max(1e-30,2*X+0.75*Y+0.5*Z);
        return 1/Math.max(1e-30,X/2+Y/4+Z/16);
    },

    idealGasPressure(rho,T,mu) {
        return rho*PhysicsConstants.k_B*T/(mu*this.atomicMassUnit);
    },

    radiationPressure(T) { return this.radiationConstant*T**4/3; },

    pressure(rho,T,comp) {
        const mu=this.meanMolecularWeight(comp,true);
        return this.idealGasPressure(rho,T,mu)+this.radiationPressure(T);
    },

    specificInternalEnergy(rho,T,comp) {
        const mu=this.meanMolecularWeight(comp,true);
        return 1.5*PhysicsConstants.k_B*T/(mu*this.atomicMassUnit)+this.radiationConstant*T**4/rho;
    },

    soundSpeed(rho,T,comp) {
        const mu=this.meanMolecularWeight(comp,true);
        const p=this.pressure(rho,T,comp);
        return Math.sqrt(Math.max(0,(5/3)*p/rho));
    },

    kramersOpacity(rho,T,X=0.73,Z=0.02) {
        const Tg=Math.max(T,1);
        return 4.0e25*(Z*(1+X))*rho*Tg**-3.5;
    },

    electronScatteringOpacity(X=0.73) { return 0.2*(1+X); },

    opacity(rho,T,comp={X:0.73,Y:0.25,Z:0.02}) {
        return Math.max(0,this.electronScatteringOpacity(comp.X)+this.kramersOpacity(rho,T,comp.X,comp.Z));
    }
};


const ThermoEngine = {
    gamma: 5/3,
    cvPerMass(body) {
        const mu = EOS.meanMolecularWeight(body.composition || {X:0.73,Y:0.25,Z:0.02}, true);
        return 1.5 * PhysicsConstants.k_B / (mu * EOS.atomicMassUnit);
    },
    updateTemperature(objects) {
        for (const o of objects) {
            if (!(o.mass > 0)) continue;
            const cv = this.cvPerMass(o);
            if (!(o.internalEnergy > 0)) {
                o.internalEnergy = Math.max(0, o.mass * cv * Math.max(o.temperature, 2.73));
            }
            o.temperature = Math.max(2.73, o.internalEnergy / (o.mass * cv));
            o.updateDensity();
            o.sph_pressure = EOS.pressure(o.density, o.temperature, o.composition);
        }
    },
    computeRadiation(dt, objects) {
        if (!(dt >= 0)) throw new Error("Negative thermodynamic timestep");
        const sigma = PhysicsConstants.sigma_sb;
        for (const o of objects) {
            if (!(o.radius > 0) || !(o.temperature >= 0)) continue;
            const area = 4 * Math.PI * o.radius * o.radius;
            const blackbody = sigma * area * Math.pow(o.temperature,4);
            o.luminosity = Number.isFinite(blackbody) ? blackbody : 0;
            const emitted = Math.min(o.internalEnergy, o.luminosity * dt);
            o.radiatedEnergy = (o.radiatedEnergy || 0) + emitted;
            o.internalEnergy = Math.max(0, o.internalEnergy - emitted);
        }
    }
};
function kBPressure(T,rho) {
    const kB=1.380649e-23, mp=1.67262192369e-27, mu=0.61;
    return kB*T/(mu*mp);
}


const NuclearNetwork = {
    // Analytic stellar-rate approximations in SI. They are deliberately exposed as
    // approximations, not tabulated laboratory cross sections.
    ppEnergyRate(rho,T,X) {
        const T6=Math.max(T,1)/1e6;
        const ergPerGramPerSecond=2.4e4*rho/1e3*X*X*Math.pow(T6,-2/3)*Math.exp(-33.8*Math.pow(T6,-1/3));
        return Math.max(0,ergPerGramPerSecond*1e-4);
    },

    cnoEnergyRate(rho,T,X,Zcno=0.01) {
        const T6=Math.max(T,1)/1e6;
        const ergPerGramPerSecond=8.7e27*rho/1e3*X*Zcno*Math.pow(T6,-2/3)*Math.exp(-152.28*Math.pow(T6,-1/3));
        return Math.max(0,ergPerGramPerSecond*1e-4);
    },

    tripleAlphaEnergyRate(rho,T,Y) {
        const T8=Math.max(T,1)/1e8;
        const ergPerGramPerSecond=5.1e8*(rho/1e5)**2*Y**3*T8**-3*Math.exp(-44.027/T8);
        return Math.max(0,ergPerGramPerSecond*1e-4);
    },

    rates(rho,T,comp) {
        return {
            pp:this.ppEnergyRate(rho,T,comp.X),
            cno:this.cnoEnergyRate(rho,T,comp.X,comp.Z),
            tripleAlpha:this.tripleAlphaEnergyRate(rho,T,comp.Y)
        };
    },

    hydrogenBurning(rho,T,comp,dt) {
        const rates=this.rates(rho,T,comp);
        const q=0.007*PhysicsConstants.c**2;
        const burned=Math.min(comp.X,Math.max(0,(rates.pp+rates.cno)*dt/q));
        return {
            rates,
            dX:-burned,
            dY:burned,
            energy:burned*rho*q
        };
    }
};

const Diagnostics = {
    initEnergy: null,
    initialMomentum: null,
    initialAngularMomentum: null,

    getKineticEnergy(objects) {
        return objects.reduce((sum, o) => sum + 0.5 * o.mass * o.vel.magSq(), 0);
    },

    getPotentialEnergy(objects) {
        let u = 0;
        for (let i = 0; i < objects.length; i++) {
            for (let j = i + 1; j < objects.length; j++) {
                const r = objects[i].pos.sub(objects[j].pos).mag();
                if (r > 0) u -= PhysicsConstants.G * objects[i].mass * objects[j].mass / r;
            }
        }
        return u;
    },

    getTotalMomentum(objects) {
        return objects.reduce((sum, o) => sum.add(o.vel.mult(o.mass)), new Vec3());
    },

    getAngularMomentum(objects) {
        return objects.reduce((sum,o)=>{
            const orbital=o.pos.cross(o.vel.mult(o.mass));
            const I=(2/5)*o.mass*o.radius*o.radius;
            const spin=o.spin?o.spin.mult(I):new Vec3();
            return sum.add(orbital).add(spin);
        },new Vec3());
    },

    begin(objects) {
        this.initEnergy = this.getKineticEnergy(objects) + this.getPotentialEnergy(objects);
        this.initialMomentum = this.getTotalMomentum(objects);
        this.initialAngularMomentum = this.getAngularMomentum(objects);
    },

    relativeError(value, reference, floor = 1e-300) {
        return Math.abs(value - reference) / Math.max(Math.abs(reference), floor);
    },

    vectorRelativeError(v, ref, floor = 1e-300) {
        return v.sub(ref).mag() / Math.max(ref.mag(), floor);
    },

    sample(objects) {
        const totalE = this.getKineticEnergy(objects) + this.getPotentialEnergy(objects);
        const mom = this.getTotalMomentum(objects);
        const ang = this.getAngularMomentum(objects);
        return {
            energy: totalE,
            energyRelativeError: this.initEnergy == null ? 0 : this.relativeError(totalE, this.initEnergy),
            momentumRelativeError: this.initialMomentum == null ? 0 : this.vectorRelativeError(mom, this.initialMomentum),
            angularMomentumRelativeError: this.initialAngularMomentum == null ? 0 : this.vectorRelativeError(ang, this.initialAngularMomentum)
        };
    },

    update(objects) {
        if (this.initEnergy == null && objects.length) this.begin(objects);
        const s = this.sample(objects);
        const finite = [s.energy, s.energyRelativeError, s.momentumRelativeError, s.angularMomentumRelativeError].every(Number.isFinite);
        const statusEl = document.getElementById('diag-status');
        const energyEl = document.getElementById('diag-energy');
        const errEl = document.getElementById('diag-e-err');
        const momEl = document.getElementById('diag-mom');
        if (energyEl) energyEl.innerText = Number(s.energy).toExponential(6) + " J";
        if (errEl) errEl.innerText = (s.energyRelativeError * 100).toExponential(6) + " %";
        if (momEl) momEl.innerText = (momEl.dataset && momEl.dataset.vector === "true")
            ? s.momentumRelativeError.toExponential(6)
            : this.getTotalMomentum(objects).mag().toExponential(6);
        if (statusEl) {
            if (!finite) {
                statusEl.innerText = "FAIL (비유한값)";
                statusEl.className = "val fail";
                Engine.status = "FAILED";
            } else if (s.energyRelativeError > 1e-2) {
                statusEl.innerText = "WARNING (오차)";
                statusEl.className = "val warn";
            } else {
                statusEl.innerText = "STABLE";
                statusEl.className = "val pass";
            }
        }
        return s;
    }
};

const end=e=>{if(e.pointerId!==this.pointerId)return;const click=!this.dragMoved;this.isDragging=false;this.pointerId=null;try{this.canvas.releasePointerCapture(e.pointerId)}catch(_){}if(click&&e.type==="pointerup")UI.handleCanvasTap(e.clientX,e.clientY);};this.canvas.addEventListener("pointerup",end);this.canvas.addEventListener("pointercancel",end);

        const type=(document.getElementById("type")||{value:"PLANET"}).value,num=(id,f)=>{const e=document.getElementById(id),v=Number(e&&e.value);return Number.isFinite(v)?v:f;};
        const mass=num("mass",5.972e24),rad=num("radius",6.371e6);if(!(mass>0)||!(rad>0))throw new Error("mass/radius must be positive");
        let p;if(Number.isFinite(clientX)&&Number.isFinite(clientY))p=this.screenToWorld(clientX,clientY,0);else{const r=Renderer.canvas.getBoundingClientRect();p=this.screenToWorld(r.left+r.width/2,r.top+r.height/2,0);}
        const body=new PhysicalBody("user-"+Date.now()+"-"+Engine.objects.length,type,mass,rad,p,new Vec3(num("vel_x",0),num("vel_y",0),num("vel_z",0)));
        if(type==="STAR")body.temperature=5778;
        Engine.objects.push(body);this.selectedId=body.id;Diagnostics.initEnergy=null;Diagnostics.initialMomentum=null;Diagnostics.initialAngularMomentum=null;Diagnostics.begin(Engine.objects);this.updateInspector();return body;
    },
    handleCanvasTap:function(clientX,clientY){
        const r=Renderer.canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;let best=null,bestD=Infinity;
        for(const p of Renderer.projectObjects()){const d=Math.hypot(p.px-x,p.py-y),hit=Math.max(12,p.pr+6);if(d<=hit&&d<bestD){best=p;bestD=d;}}
        if(best){this.selectedId=best.obj.id;this.updateInspector();return{action:"select",object:best.obj};}
        return{action:"create",object:this.createObject(clientX,clientY)};
    },
    selectAtScreen:function(clientX,clientY){const r=Renderer.canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;let best=null,bestD=Infinity;for(const p of Renderer.projectObjects()){const d=Math.hypot(p.px-x,p.py-y),hit=Math.max(12,p.pr+6);if(d<=hit&&d<bestD){best=p;bestD=d;}}this.selectedId=best?best.obj.id:null;this.updateInspector();},
    syncModelControls:function(){document.querySelectorAll("[data-model]").forEach(e=>{e.checked=Engine.activeModels.includes(e.dataset.model);});},\n    toggleModel:function(name,enabled){Engine.setModel(name,enabled);this.syncModelControls();},\n    updateInspector:function(){const ins=document.getElementById("inspector-data");if(!ins||typeof Engine==="undefined")return;const o=this.selectedId?Engine.objects.find(x=>x.id===this.selectedId):Engine.objects[Engine.objects.length-1];if(!o){ins.textContent="선택된 객체 없음";return;}const f=(v,u)=>Number.isFinite(v)?v.toExponential(6)+" "+u:"—";ins.innerHTML="<b>Target: "+o.id+" ("+o.type+")</b><br>Mass: "+f(o.mass,"kg")+"<br>Radius: "+f(o.radius,"m")+"<br>Position: ["+f(o.pos.x,"m")+", "+f(o.pos.y,"m")+", "+f(o.pos.z,"m")+"]<br>Velocity: ["+f(o.vel.x,"m/s")+", "+f(o.vel.y,"m/s")+", "+f(o.vel.z,"m/s")+"]<br>Temperature: "+f(o.temperature,"K")+"<br>Luminosity: "+f(o.luminosity,"W");},
    togglePanel:function(which){const el=document.getElementById(which==="creator"?"creator-panel":"inspector-panel");if(!el)return;const open=el.dataset.open==="true";el.dataset.open=open?"false":"true";el.style.transform=which==="creator"?(open?"translateX(-105%)":"translateX(0)"):(open?"translateX(105%)":"translateX(0)");},
    showAudit:function(){const results=Validator.runAllTests(true)||[];let html="<h4>과학적 검증 프레임워크</h4><ul style='list-style:none;padding:0'>",allPass=results.length>0;for(const r of results){const pass=r.status==="PASS",warn=r.status==="WARNING";if(!pass)allPass=false;html+="<li><b>"+(pass?"[PASS]":warn?"[WARNING]":"[FAIL]")+"</b> "+r.name+"<br><span style='font-size:11px;color:#aaa'>Error: "+(Number.isFinite(r.error)?r.error.toExponential(3):String(r.error))+" | Tol: "+r.tolerance+"</span></li>"}html+="</ul><div>"+(allPass?"등록된 검증 항목 PASS":"검증 실패 또는 미완료 항목 존재")+"</div>";document.getElementById("validation-results").innerHTML=html;document.getElementById("validation-modal").style.display="block";}
};

const Engine={objects:[],time:0,dt:120,integratorType:"RK4",gravityAlgorithm:"BARNES_HUT",status:"STABLE",paused:false,frames:0,lastFpsTime:0,adaptiveDt:false,minDt:1e-6,maxDt:1e12,safety:.2,activeModels:["Gravity","Collision","Nuclear","Thermodynamics"],
setIntegrator:function(type){this.integratorType=String(type).toUpperCase();},
getAccelerations:function(objs){const a=new Array(objs.length).fill(null).map(()=>new Vec3());if(this.activeModels.includes("Gravity")){const g=GravityEngine.computeAccelerations(objs,this.gravityAlgorithm==="BARNES_HUT");for(let i=0;i<objs.length;i++)a[i]=a[i].add(g[i]);}if(this.activeModels.includes("Relativity")){const g=RelativityEngine.computeSchwarzschildPrecession(objs);for(let i=0;i<objs.length;i++)a[i]=a[i].add(g[i]);}if(this.activeModels.includes("Electromagnetic")){const g=ElectromagneticEngine.computeAccelerations(objs);for(let i=0;i<objs.length;i++)a[i]=a[i].add(g[i]);}return a;},
step:function(){if(this.status==="FAILED"||this.paused)return;for(const o of this.objects){if(![o.pos.x,o.pos.y,o.pos.z,o.vel.x,o.vel.y,o.vel.z].every(Number.isFinite)){this.status="FAILED";throw new Error("Non-finite state detected");}if(o.vel.magSq()>=PhysicsConstants.c**2){this.status="FAILED";throw new Error("Superluminal velocity detected");}}if(!(this.dt>0&&Number.isFinite(this.dt)&&this.dt>=this.minDt&&this.dt<=this.maxDt)){this.status="FAILED";throw new Error("Invalid timestep");}const t=String(this.integratorType).toLowerCase();if(t==="euler")Integrators.eulerSemiImplicit(this.objects,this.dt,this.getAccelerations(this.objects));else if(t==="verlet")Integrators.verlet(this.objects,this.dt,obs=>this.getAccelerations(obs));else if(t==="rk4")Integrators.rk4(this.objects,this.dt,obs=>this.getAccelerations(obs));else{this.status="FAILED";throw new Error("Unknown integrator: "+this.integratorType);}if(this.activeModels.includes("Fluid"))FluidEngine.computeSPH(this.objects);if(this.activeModels.includes("Nuclear"))NuclearEngine.computeFusion(this.dt,this.objects);if(this.activeModels.includes("Collision"))CollisionEngine.checkAndResolve(this.objects);if(this.activeModels.includes("Thermodynamics")){ThermoEngine.updateTemperature(this.objects);ThermoEngine.computeRadiation(this.dt,this.objects);}if(this.adaptiveDt){let amin=Infinity;for(const o of this.objects){const a=o.acc.mag();if(a>0)amin=Math.min(amin,Math.sqrt(Math.max(o.radius,1)/a));}if(Number.isFinite(amin))this.dt=Math.max(this.minDt,Math.min(this.maxDt,this.safety*amin));}this.time+=this.dt;Diagnostics.update(this.objects);UI.updateInspector();},
togglePause:function(){if(this.status==="FAILED"){this.status="STABLE";this.paused=false;Diagnostics.begin(this.objects);}else this.paused=!this.paused;this.syncPauseButton();},
resetFailure:function(){this.status="STABLE";this.paused=false;Diagnostics.begin(this.objects);this.syncPauseButton();},
syncPauseButton:function(){const b=document.getElementById("btn-pause");if(b)b.innerText=this.paused?"재개 (RESUME)":"일시정지 (PAUSE)";},
setModel:function(name,enabled){const i=this.activeModels.indexOf(name);if(enabled&&i<0)this.activeModels.push(name);if(!enabled&&i>=0)this.activeModels.splice(i,1);},
loop:function(){requestAnimationFrame(()=>this.loop());if(!this.paused){try{this.step();}catch(e){this.status="FAILED";this.paused=true;this.syncPauseButton();const statusEl=document.getElementById("diag-status");if(statusEl){statusEl.innerText="FAILED";statusEl.className="val fail";}}}Renderer.draw();}};

window.addEventListener('DOMContentLoaded', () => { UI.init(); Renderer.init(); Labs.loadLab('GRAVITY'); Engine.loop(); });

    </script>
