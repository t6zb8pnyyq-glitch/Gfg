<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ab Initio Universe Engine - Phase 1 Kernel</title>
    <style>
        :root { --bg: #0a0a0c; --panel-bg: #15151a; --text: #e0e0e0; --accent: #4a90e2; --border: #333; --success: #2ecc71; --danger: #e74c3c; }
        body { background-color: var(--bg); color: var(--text); font-family: monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;}
        h1 { color: var(--accent); font-size: 20px; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
        .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold;}
        button:hover { background: #357abd; }
        #log-output { background: #000; color: #0f0; padding: 15px; border: 1px solid var(--border); overflow-y: auto; flex-grow: 1; border-radius: 4px; white-space: pre-wrap; font-size: 12px;}
        .log-sys { color: #888; }
        .log-err { color: var(--danger); }
        .log-ok { color: var(--success); }
    </style>
</head>
<body>

    <h1>[PHASE 1] High-Performance Tensor & Linear Algebra Kernel</h1>
    <div class="panel">
        <p>Zero Heuristics. Strict TypedArray Math. Float64 / Complex64 Engine.</p>
        <button id="btn-run-tests">Run Kernel Diagnostics</button>
        <button id="btn-init-webgpu">Initialize WebGPU Context</button>
    </div>

    <div id="log-output">System initialized. Awaiting commands...
</div>

<script>
    const logOutput = document.getElementById('log-output');
    function log(msg, type='') {
        let span = document.createElement('span');
        if(type) span.className = 'log-' + type;
        span.textContent = msg + '\n';
        logOutput.appendChild(span);
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    // ------------------------------------------------------------------
    // TENSOR & COMPLEX ARRAY KERNEL
    // ------------------------------------------------------------------
    class Complex64Array {
        constructor(size) {
            this.size = size;
            this.real = new Float64Array(size);
            this.imag = new Float64Array(size);
        }
    }

    class Tensor3D {
        constructor(nx, ny, nz) {
            this.nx = nx; this.ny = ny; this.nz = nz;
            this.data = new Complex64Array(nx * ny * nz);
        }

        getIdx(x, y, z) {
            return x + this.nx * (y + this.ny * z);
        }
    }

    // ------------------------------------------------------------------
    // FAST FOURIER TRANSFORM (Cooley-Tukey Radix-2)
    // ------------------------------------------------------------------
    function fft1d(real, imag, dir) {
        let n = real.length;
        if ((n & (n - 1)) !== 0) throw new Error("FFT size must be power of 2");

        // Bit-reversal permutation
        let j = 0;
        for (let i = 0; i < n - 1; i++) {
            if (i < j) {
                let tr = real[i]; real[i] = real[j]; real[j] = tr;
                let ti = imag[i]; imag[i] = imag[j]; imag[j] = ti;
            }
            let m = n >> 1;
            while (j >= m) { j -= m; m >>= 1; }
            j += m;
        }

        // Cooley-Tukey
        for (let l = 2; l <= n; l <<= 1) {
            let half = l >> 1;
            let theta = (dir === 1 ? -2.0 : 2.0) * Math.PI / l;
            let wpr = Math.cos(theta);
            let wpi = Math.sin(theta);
            for (let i = 0; i < n; i += l) {
                let wr = 1.0;
                let wi = 0.0;
                for (let k = 0; k < half; k++) {
                    let idx = i + k;
                    let idxh = idx + half;
                    let tr = wr * real[idxh] - wi * imag[idxh];
                    let ti = wr * imag[idxh] + wi * real[idxh];
                    real[idxh] = real[idx] - tr;
                    imag[idxh] = imag[idx] - ti;
                    real[idx] += tr;
                    imag[idx] += ti;

                    let wtemp = wr;
                    wr = wtemp * wpr - wi * wpi;
                    wi = wi * wpr + wtemp * wpi;
                }
            }
        }

        if (dir === -1) {
            for (let i = 0; i < n; i++) {
                real[i] /= n;
                imag[i] /= n;
            }
        }
    }

    function fft3d(tensor, dir) {
        let nx = tensor.nx, ny = tensor.ny, nz = tensor.nz;
        let real = tensor.data.real;
        let imag = tensor.data.imag;

        // X-axis
        for (let y = 0; y < ny; y++) {
            for (let z = 0; z < nz; z++) {
                let rowR = new Float64Array(nx);
                let rowI = new Float64Array(nx);
                for (let x = 0; x < nx; x++) {
                    let idx = x + nx * (y + ny * z);
                    rowR[x] = real[idx]; rowI[x] = imag[idx];
                }
                fft1d(rowR, rowI, dir);
                for (let x = 0; x < nx; x++) {
                    let idx = x + nx * (y + ny * z);
                    real[idx] = rowR[x]; imag[idx] = rowI[x];
                }
            }
        }

        // Y-axis
        for (let x = 0; x < nx; x++) {
            for (let z = 0; z < nz; z++) {
                let colR = new Float64Array(ny);
                let colI = new Float64Array(ny);
                for (let y = 0; y < ny; y++) {
                    let idx = x + nx * (y + ny * z);
                    colR[y] = real[idx]; colI[y] = imag[idx];
                }
                fft1d(colR, colI, dir);
                for (let y = 0; y < ny; y++) {
                    let idx = x + nx * (y + ny * z);
                    real[idx] = colR[y]; imag[idx] = colI[y];
                }
            }
        }

        // Z-axis
        for (let x = 0; x < nx; x++) {
            for (let y = 0; y < ny; y++) {
                let colR = new Float64Array(nz);
                let colI = new Float64Array(nz);
                for (let z = 0; z < nz; z++) {
                    let idx = x + nx * (y + ny * z);
                    colR[z] = real[idx]; colI[z] = imag[idx];
                }
                fft1d(colR, colI, dir);
                for (let z = 0; z < nz; z++) {
                    let idx = x + nx * (y + ny * z);
                    real[idx] = colR[z]; imag[idx] = colI[z];
                }
            }
        }
    }

    // ------------------------------------------------------------------
    // SPARSE MATRIX (CSR) & SpMV
    // ------------------------------------------------------------------
    class CSRMatrix {
        constructor(rows, cols, values, col_indices, row_ptr) {
            this.rows = rows;
            this.cols = cols;
            this.values = values;         // Float64Array
            this.col_indices = col_indices; // Int32Array
            this.row_ptr = row_ptr;         // Int32Array
        }

        multiply(vec) {
            let result = new Float64Array(this.rows);
            for (let i = 0; i < this.rows; i++) {
                let sum = 0;
                let start = this.row_ptr[i];
                let end = this.row_ptr[i+1];
                for (let j = start; j < end; j++) {
                    sum += this.values[j] * vec[this.col_indices[j]];
                }
                result[i] = sum;
            }
            return result;
        }
    }

    // ------------------------------------------------------------------
    // LANCZOS EIGENSOLVER
    // ------------------------------------------------------------------
    function dot(v1, v2) {
        let sum = 0;
        for (let i = 0; i < v1.length; i++) sum += v1[i] * v2[i];
        return sum;
    }

    function norm(v) {
        return Math.sqrt(dot(v, v));
    }

    function lanczosTridiagonalize(matrix, m) {
        let n = matrix.rows;
        let alpha = new Float64Array(m);
        let beta = new Float64Array(m);

        let v_prev = new Float64Array(n);
        let v_curr = new Float64Array(n);

        // Deterministic pseudo-random start for reproducibility
        for (let i = 0; i < n; i++) v_curr[i] = (i % 2 === 0 ? 1 : -1) * (i + 1) / n;
        let nrm = norm(v_curr);
        for (let i = 0; i < n; i++) v_curr[i] /= nrm;

        let w = new Float64Array(n);

        for (let j = 0; j < m; j++) {
            w = matrix.multiply(v_curr);
            alpha[j] = dot(w, v_curr);

            for (let i = 0; i < n; i++) {
                w[i] = w[i] - alpha[j] * v_curr[i] - (j > 0 ? beta[j-1] * v_prev[i] : 0);
            }

            beta[j] = norm(w);

            if (j < m - 1) {
                if (beta[j] < 1e-12) {
                    // Breakdown (Invariant subspace found)
                    alpha = alpha.subarray(0, j+1);
                    beta = beta.subarray(0, j);
                    break;
                }
                for (let i = 0; i < n; i++) {
                    v_prev[i] = v_curr[i];
                    v_curr[i] = w[i] / beta[j];
                }
            }
        }

        return { alpha, beta: beta.subarray(0, beta.length === m ? m-1 : beta.length) };
    }

    function qrEigenvalues(alpha, beta) {
        let n = alpha.length;
        let d = new Float64Array(alpha);
        let e = new Float64Array(beta);
        const eps = 1e-15;

        for (let l = 0; l < n; l++) {
            let iter = 0;
            while (true) {
                let m;
                for (m = l; m < n - 1; m++) {
                    if (Math.abs(e[m]) <= eps * (Math.abs(d[m]) + Math.abs(d[m+1]))) break;
                }
                if (m === l) break;

                if (iter++ > 100) break; // prevent infinite loop

                let g = (d[l+1] - d[l]) / (2.0 * e[l]);
                let r = Math.sqrt(g * g + 1.0);
                g = d[m] - d[l] + e[l] / (g + (g >= 0 ? Math.abs(r) : -Math.abs(r)));

                let s = 1.0; let c = 1.0; let p = 0.0;

                for (let i = m - 1; i >= l; i--) {
                    let f = s * e[i];
                    let b = c * e[i];
                    r = Math.sqrt(f * f + g * g);
                    e[i+1] = r;
                    if (r === 0.0) { d[i+1] -= p; e[m] = 0.0; break; }
                    s = f / r;
                    c = g / r;
                    g = d[i+1] - p;
                    r = (d[i] - g) * s + 2.0 * c * b;
                    p = s * r;
                    d[i+1] = g + p;
                    g = c * r - b;
                }

                if (r === 0.0 && iter > 0) continue;
                d[l] -= p; e[l] = g; e[m] = 0.0;
            }
        }
        return d.sort((a,b) => b-a);
    }

    // ------------------------------------------------------------------
    // WEBGPU BOILERPLATE (PHASE 4 PREP)
    // ------------------------------------------------------------------
    async function initWebGPU() {
        log("Initializing WebGPU context...", "sys");
        if (!navigator.gpu) {
            log("WebGPU not supported on this browser/environment.", "err");
            return;
        }

        try {
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) throw new Error("No WebGPU adapter found.");

            const device = await adapter.requestDevice();
            log("WebGPU Adapter & Device acquired successfully.", "ok");

            // Dummy shader creation to verify WebGPU compilation
            const shaderCode = `
                @group(0) @binding(0) var<storage, read_write> data: array<f32>;
                @compute @workgroup_size(64)
                fn main(@builtin(global_invocation_id) global_id: vec3<u32>) {
                    let index = global_id.x;
                    if (index < arrayLength(&data)) {
                        data[index] = data[index] * 2.0;
                    }
                }
            `;
            const shaderModule = device.createShaderModule({ code: shaderCode });
            const pipeline = device.createComputePipeline({
                layout: 'auto',
                compute: { module: shaderModule, entryPoint: 'main' }
            });
            log("WebGPU dummy compute pipeline compiled successfully. Ready for Phase 4.", "ok");

        } catch (e) {
            log("WebGPU Init failed: " + e.message, "err");
        }
    }

    // ------------------------------------------------------------------
    // UI HANDLERS & TESTS
    // ------------------------------------------------------------------
    document.getElementById('btn-init-webgpu').addEventListener('click', initWebGPU);

    document.getElementById('btn-run-tests').addEventListener('click', () => {
        log("\n--- RUNNING DIAGNOSTICS ---", "sys");

        try {
            // TEST 1: 1D FFT
            log("Testing 1D Radix-2 FFT (N=8)...");
            let r1 = new Float64Array([1, 1, 1, 1, 0, 0, 0, 0]);
            let i1 = new Float64Array(8);
            fft1d(r1, i1, 1);
            if(Math.abs(r1[0] - 4) < 1e-10) log("1D FFT (Forward) passed.", "ok");
            else {
                log("1D FFT failed.", "err");
                throw new Error("1D FFT failed");
            }

            // TEST 2: 3D FFT
            log("Testing 3D FFT (N=4x4x4)...");
            let t3 = new Tensor3D(4, 4, 4);
            t3.data.real[t3.getIdx(0,0,0)] = 1.0;
            fft3d(t3, 1);
            if(Math.abs(t3.data.real[t3.getIdx(3,3,3)] - 1.0) < 1e-10) log("3D FFT passed.", "ok");
            else log("3D FFT failed.", "err");

            // TEST 3: CSR SpMV
            log("Testing CSR Matrix-Vector Multiplication...");
            // Diagonal matrix [2, 0, 0; 0, 3, 0; 0, 0, 4]
            let values = new Float64Array([2, 3, 4]);
            let col_ind = new Int32Array([0, 1, 2]);
            let row_ptr = new Int32Array([0, 1, 2, 3]);
            let A = new CSRMatrix(3, 3, values, col_ind, row_ptr);
            let x = new Float64Array([1, 1, 1]);
            let y = A.multiply(x);
            if(y[0]===2 && y[1]===3 && y[2]===4) log("CSR SpMV passed.", "ok");
            else log("CSR SpMV failed.", "err");

            // TEST 4: Lanczos Eigensolver
            log("Testing Lanczos Eigensolver (N=500)...");
            // Create a larger sparse symmetric matrix (1D Laplacian)
            let N = 500;
            let valArr = [], colArr = [], rowPtr = [0];
            for(let i=0; i<N; i++) {
                if(i > 0) { valArr.push(-1); colArr.push(i-1); }
                valArr.push(2); colArr.push(i);
                if(i < N-1) { valArr.push(-1); colArr.push(i+1); }
                rowPtr.push(valArr.length);
            }
            let L = new CSRMatrix(N, N, new Float64Array(valArr), new Int32Array(colArr), new Int32Array(rowPtr));

            let t0 = performance.now();
            let tridiag = lanczosTridiagonalize(L, 50); // m=50 steps
            let eigs = qrEigenvalues(tridiag.alpha, tridiag.beta);
            let t1 = performance.now();

            log(`Lanczos + QR completed in ${(t1-t0).toFixed(2)}ms`, "ok");
            log(`Top Eigenvalues: ${eigs[0].toFixed(4)}, ${eigs[1].toFixed(4)}, ${eigs[2].toFixed(4)}`, "ok");

            log("--- ALL TESTS PASSED ---", "ok");
        } catch (e) {
            log("Error during tests: " + e.message, "err");
        }
    });
</script>

</body>
</html>
