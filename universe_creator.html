<!DOCTYPE html>
<html lang="ko">

    <meta charset="UTF-8">

    <style>
:root {
                --bg: #000000;
                --text: #e0e0e0;
                --panel: rgba(10, 10, 15, 0.9);
                --border: #38bdf8;
                --accent: #0284c7;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
            }
            body {
                margin: 0; padding: 0; background: var(--bg); color: var(--text);
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', monospace; overflow: hidden;
                display: flex; flex-direction: column; height: 100vh;
            }
            /* Layout — canonical DOM mapping */
            html, body { width:100%; height:100%; }
            body { overflow:hidden; }
            #layout-container { position:relative; width:100%; height:100dvh; min-height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; isolation:isolate; }
            #module-bar { grid-row:1; min-height:44px; display:flex; align-items:center; gap:6px; padding:4px 8px; box-sizing:border-box; overflow-x:auto; overflow-y:hidden; white-space:nowrap; background:var(--panel); border-bottom:1px solid var(--border); position:relative; z-index:50; touch-action:pan-x; }
            #viewport-container { grid-row:2; position:relative; min-width:0; min-height:0; overflow:hidden; background:#000; z-index:1; contain:layout paint; }
            #universe-canvas { position:absolute; inset:0; display:block; width:100%; height:100%; z-index:1; pointer-events:auto; touch-action:none; }
            #diagnostics-overlay { position:absolute; left:8px; top:8px; z-index:5; pointer-events:none; }
            .side-panel { position:absolute; top:0; bottom:0; width:min(320px,30vw); box-sizing:border-box; overflow-x:hidden; overflow-y:auto; padding:10px; background:var(--panel); z-index:20; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
            #creator-panel { left:0; border-right:1px solid var(--border); }
            #inspector-panel { right:0; border-left:1px solid var(--border); }
            #control-bar { grid-row:3; min-height:48px; display:flex; align-items:center; gap:6px; padding:4px 8px; box-sizing:border-box; overflow-x:auto; overflow-y:hidden; background:var(--panel); border-top:1px solid var(--border); position:relative; z-index:50; -webkit-overflow-scrolling:touch; }
            #control-bar > * { flex:0 0 auto; }
            #control-bar select, #control-bar input { width:auto; }
            button, select, input, label { position:relative; z-index:2; }
            button, select { touch-action:manipulation; }
            button { -webkit-tap-highlight-color:transparent; }
            .lab-btn, #btn-pause, #btn-audit { pointer-events:auto; }
            @media (max-width: 900px) {
                #creator-panel, #inspector-panel { width:min(42vw,280px); }
            }
            @media (max-width: 700px) {
                #module-bar { min-height:40px; }
                .side-panel { width:calc(100vw - 16px); top:auto; bottom:56px; height:min(42vh,330px); max-height:330px; border:1px solid var(--border); border-radius:8px; left:8px; right:8px; }
                #creator-panel { left:8px; }
                #inspector-panel { left:8px; right:8px; top:auto; bottom:56px; }
                #control-bar { min-height:52px; }
                #viewport-container { min-height:0; }
            }

            /* Mobile / interaction hardening */
            #module-bar, #control-bar { padding-left:max(8px, env(safe-area-inset-left)); padding-right:max(8px, env(safe-area-inset-right)); }
            #control-bar { padding-bottom:max(4px, env(safe-area-inset-bottom)); }
            button, select, input { min-height:36px; }
            button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:1px; }
            .lab-btn { min-width:max-content; }
            .mobile-panel-btn { display:none; }
            @media (max-width:700px) { .mobile-panel-btn { display:block; width:auto; min-width:64px; } }
            .side-panel h3 { position:sticky; top:-10px; z-index:3; background:var(--panel); padding:4px 0 8px; }
            #validation-modal { position:fixed !important; inset:5vh 5vw !important; width:auto !important; height:auto !important; max-height:90vh; z-index:5000 !important; border-radius:10px; box-sizing:border-box; padding:max(12px, env(safe-area-inset-top)) 16px 16px; overscroll-behavior:contain; }
            #validation-modal button { width:auto; min-width:100px; }
            @media (max-width:700px) {
                #validation-modal { inset: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)) 8px !important; max-height:none; }
                .side-panel { z-index:30; }
                #creator-panel, #inspector-panel { display:none; }
                #creator-panel.mobile-open, #inspector-panel.mobile-open { display:block; }
            }
            @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
            .sys-message { padding:6px 8px; margin:4px 0 8px; border-left:3px solid var(--border); background:rgba(15,23,42,.9); font-size:11px; }
            .sys-message.danger { border-color:var(--danger); color:#fecaca; }

            /* Layout */
            #top-bar { height: 45px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; font-weight: bold; overflow-x: auto; white-space: nowrap; }
            #main-area { display: flex; flex: 1; height: calc(100vh - 85px); position: relative; }
            .panel-col { width: 320px; background: var(--panel); overflow-y: auto; padding: 10px; box-sizing: border-box; font-size: 12px; z-index: 10; border-right: 1px solid var(--border); }
            #right-panel { border-right: none; border-left: 1px solid var(--border); }
            #center-viewport { flex: 1; position: relative; background: #000; overflow: hidden; z-index: 1; }
            #bottom-bar { height: 40px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; z-index: 10; }

            /* Controls */
            select, input, button { background: #1e293b; color: #fff; border: 1px solid var(--border); padding: 5px; font-family: inherit; margin: 3px 0; width: 100%; box-sizing: border-box; }
            button { background: var(--accent); cursor: pointer; font-weight: bold; transition: background 0.2s; }
            button:hover { background: #0369a1; }
            .section { margin-bottom: 15px; border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px; background: rgba(15, 23, 42, 0.6); }
            .section h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--border); border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 5px; }

            canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

            /* UI Elements */
            .lab-btn { margin-right: 5px; background: #1e293b; border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; width: auto; font-size: 11px;}
            .lab-btn.active { background: var(--accent); color: white; }
            table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
            td { padding: 3px 0; border-bottom: 1px dotted #334155; }
            .val { float: right; font-family: monospace; }
            .pass { color: var(--success); }
            .fail { color: var(--danger); }
            .warn { color: var(--warning); }

            /* Modal */
            .modal { display: none; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: var(--panel); border: 2px solid var(--border); z-index: 1000; overflow: auto; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }

            /* Audit UI */
            .audit-tag { display: inline-block; padding: 2px 6px; margin: 2px; border-radius: 3px; font-size: 10px; background: var(--success); color: #000; font-weight: bold; }
    </style>

class Vec3 {
        constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
        add(v) { return new Vec3(this.x+v.x, this.y+v.y, this.z+v.z); }
        sub(v) { return new Vec3(this.x-v.x, this.y-v.y, this.z-v.z); }
        mult(s) { return new Vec3(this.x*s, this.y*s, this.z*s); }
        div(s) { return new Vec3(this.x/s, this.y/s, this.z/s); }
        dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
        cross(v) { return new Vec3(this.y*v.z - this.z*v.y, this.z*v.x - this.x*v.z, this.x*v.y - this.y*v.x); }
        magSq() { return this.x*this.x + this.y*this.y + this.z*this.z; }
        mag() { return Math.sqrt(this.magSq()); }
        normalize() { let m = this.mag(); return m === 0 ? new Vec3() : this.div(m); }
        clone() { return new Vec3(this.x, this.y, this.z); }
    }

/**
 * src/physics/PhysicalBody.js
 *
 * The single canonical state representation for a physical entity in the Universe Creator.
 * All quantities MUST be in strict SI units.
 */
class PhysicalBody {
    constructor(id, type, mass, radius, pos, vel) {
        this.id = id;
        this.type = type; // e.g., 'star', 'planet', 'blackhole', 'gas'

        // --- Core Mechanical State ---
        this.mass = mass;                 // [kg]
        this.radius = radius;             // [m]
        this.pos = pos;                   // [m] (Vec3)
        this.vel = vel;                   // [m/s] (Vec3)
        this.acc = new Vec3();            // [m/s^2] (Vec3)

        // --- Rigid Body / Rotation ---
        this.spin = new Vec3();           // Angular velocity vector [rad/s]

        // --- Thermodynamics & Fluid State ---
        this.temperature = 2.73;          // Absolute temperature [K] (CMB default)
        this.internalEnergy = 0;          // Total internal energy [J]

        // Fluid/SPH specific
        this.sph_density = 0;             // Local SPH evaluated density [kg/m^3]

            // we accumulate them in the current node without subdividing infinitely.

                let totalMass = this.mass + body.mass;
                this.centerOfMass = this.centerOfMass.mult(this.mass).add(body.pos.mult(body.mass)).div(totalMass);

            for(let i=0; i<clones.length; i++) { clones[i].pos = objects[i].pos.add(k3_x[i].mult(dt)); clones[i].vel = objects[i].vel.add(k3_v[i].mult(dt)); }

            let k4_v = getAccelsFn(clones); let k4_x = clones.map(o => o.vel.clone());
            for(let i=0; i<objects.length; i++) {
                objects[i].pos = objects[i].pos.add( (k1_x[i].add(k2_x[i].mult(2)).add(k3_x[i].mult(2)).add(k4_x[i])).mult(dt/6) );
                objects[i].vel = objects[i].vel.add( (k1_v[i].add(k2_v[i].mult(2)).add(k3_v[i].mult(2)).add(k4_v[i])).mult(dt/6) );
                objects[i].acc = k1_v[i];
            }
        }
    }

const Diagnostics = {
        initEnergy: null,
        getKineticEnergy: function(objects) { return objects.reduce((sum, o) => sum + 0.5 * o.mass * o.vel.magSq(), 0); },
        getPotentialEnergy: function(objects) {
            let u = 0;
            for(let i=0; i<objects.length; i++) {
                for(let j=i+1; j<objects.length; j++) {
                    let r = objects[i].pos.sub(objects[j].pos).mag();
                    if(r > 0) u -= PhysicsConstants.G * objects[i].mass * objects[j].mass / r;
                }
            }
            return u;
        },
        getTotalMomentum: function(objects) { return objects.reduce((sum, o) => sum.add(o.vel.mult(o.mass)), new Vec3()); },
        update: function(objects) {
            let totalE = this.getKineticEnergy(objects) + this.getPotentialEnergy(objects);
            let mom = this.getTotalMomentum(objects);
            if (this.initEnergy === null && objects.length > 0) this.initEnergy = totalE;
            const denom = Math.max(Math.abs(this.initEnergy ?? 0), Number.MIN_VALUE);
            let eErr = this.initEnergy !== null ? Math.abs((totalE-this.initEnergy)/denom)*100 : 0;

            document.getElementById('diag-energy').innerText = totalE.toExponential(3) + " J";
            document.getElementById('diag-e-err').innerText = eErr.toFixed(6) + " %";
            document.getElementById('diag-mom').innerText = mom.mag().toExponential(3);

            let statusEl = document.getElementById('diag-status');
            if(!Number.isFinite(totalE) || !Number.isFinite(eErr) || eErr > 100) { statusEl.innerText = "FAIL (발산)"; statusEl.className = "val fail"; Engine.status = "FAILED"; }
            else if(eErr > 1) { statusEl.innerText = "WARNING (경고)"; statusEl.className = "val warn"; }
            else { statusEl.innerText = "STABLE (안정)"; statusEl.className = "val pass"; }
        }
    }

const Validator = {
    tests: [
        {
            name: "Gravity: Analytical Two-Body Orbital Period (Kepler)",
            run: () => {
                // Controlled State
                let M = PhysicsConstants.M_sun;
                let m = PhysicsConstants.M_earth;
                let r = PhysicsConstants.AU;
                let v = Math.sqrt(PhysicsConstants.G * M / r);

                let b1 = new PhysicalBody("S1", "STAR", M, 1e9, new Vec3(0,0,0), new Vec3(0,0,0));
                let b2 = new PhysicalBody("P1", "PLANET", m, 1e6, new Vec3(r,0,0), new Vec3(0,v,0));

                let testObjs = [b1, b2];
                let dt = 3600;
                let period = 2 * Math.PI * Math.sqrt(Math.pow(r, 3) / (PhysicsConstants.G * M));
                let steps = Math.floor(period / dt);

                for(let i=0; i<steps; i++) {
                    let accels = GravityEngine.computeAccelerations(testObjs, false);
                    Integrators.verlet(testObjs, dt, (objs) => GravityEngine.computeAccelerations(objs, false));
                }

                // After 1 period, Earth should be back near (r, 0, 0)
                let error = Math.abs(testObjs[1].pos.x - r) / r;
                return { status: error < 0.05 ? 'PASS' : 'FAIL', error: error, tolerance: '5%' };
            }
        },
        {
            name: "Collision: Inelastic Momentum Conservation",
            run: () => {
                // Controlled State
                let m1 = 1e24, m2 = 1e24;
                let v1 = new Vec3(1000, 0, 0), v2 = new Vec3(-1000, 0, 0);

                let b1 = new PhysicalBody("1", "PLANET", m1, 1e6, new Vec3(-1e6,0,0), v1);
                let b2 = new PhysicalBody("2", "PLANET", m2, 1e6, new Vec3(1e6,0,0), v2);

                let p_initial = v1.mult(m1).add(v2.mult(m2));

                let testObjs = [b1, b2];
                CollisionEngine.checkAndResolve(testObjs);

                if(testObjs.length !== 1) return { status: 'FAIL', error: 1.0, tolerance: 'Exact Merger' };

                let p_final = testObjs[0].vel.mult(testObjs[0].mass);
                let diff = p_initial.sub(p_final).mag();

                return { status: diff < 1e-5 ? 'PASS' : 'FAIL', error: diff, tolerance: '1e-5 kg m/s' };
            }
        },
        {
            name: "Barnes-Hut vs Direct Summation Accuracy",
            run: () => {
                let testObjsBH = [];
                let testObjsDirect = [];
                for(let i=0; i<51; i++) { // Deterministic validation set
                    const q=i+1;
                    let b = new PhysicalBody(""+i, "PLANET", 1e20, 1e5,
                        new Vec3((q*17%101)*1e8/101, (q*43%97)*1e8/97, (q*29%89)*1e8/89), new Vec3());
                    testObjsBH.push(b.clone());
                    testObjsDirect.push(b.clone());
                }

                let accelsBH = GravityEngine.computeAccelerations(testObjsBH, true);
                let accelsDirect = GravityEngine.computeAccelerations(testObjsDirect, false);

                let maxErr = 0;
                for(let i=0; i<testObjsBH.length; i++) {
                    let err = accelsBH[i].sub(accelsDirect[i]).mag() / (accelsDirect[i].mag() + 1e-20);
                    if(err > maxErr) maxErr = err;
                }

                return { status: maxErr < 0.1 ? 'PASS' : 'WARNING', error: maxErr, tolerance: '10%' };
            }
        }
    ],
    runAllTests: function(returnResults = false) {
        let results = [];
        for (let test of this.tests) {
            try {
                let res = test.run();
                results.push({ name: test.name, ...res });
            } catch(e) {
                results.push({ name: test.name, status: 'FAIL', error: 1, tolerance: 'N/A' });
            }
        }
        return results;
    }
};

const Renderer = {
        canvas: null, ctx: null, cameraRot: {x: 0, y: 0}, cameraPan: {x: 0, y: 0}, scale: 1e-9,
        isDragging: false, isPanDragging: false, lastMouse: {x: 0, y: 0},

        init: function() {
            this.canvas = document.getElementById('universe-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());

            // Map global camera values structurally instead of loosely
            camera.rot = this.cameraRot;
            camera.pan = this.cameraPan;

            // Unified Pointer Events for Mobile and Desktop
            this.canvas.addEventListener('pointerdown', (e) => {
                this.isDragging = true;
                this.lastMouse = { x: e.clientX, y: e.clientY };
                this.canvas.setPointerCapture(e.pointerId);
            });

            window.addEventListener('pointerup', (e) => {
                this.isDragging = false;
                try { this.canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            });

            window.addEventListener('pointermove', (e) => {
                if (this.isDragging) {
                    let dx = e.clientX - this.lastMouse.x;
                    let dy = e.clientY - this.lastMouse.y;
                    this.cameraRot.y += dx * 0.01;
                    this.cameraRot.x += dy * 0.01;
                    this.lastMouse = { x: e.clientX, y: e.clientY };
                }
            });

            this.canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                this.scale *= (e.deltaY > 0 ? 0.9 : 1.1);
            }, {passive: false});

            let lastTap = 0;
            this.canvas.addEventListener('dblclick', (e) => {
                if (e.target !== this.canvas) return;
                UI.createObject();
            });
            this.canvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length !== 1) return;
                const now = performance.now();
                if (now - lastTap < 280) {
                    e.preventDefault();
                    UI.createObject();
                    lastTap = 0;
                } else lastTap = now;
            }, {passive:false});
        },
        resize: function() {
            const r = this.canvas.parentElement.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            this.canvas.width = Math.max(1, Math.round(r.width * dpr));
            this.canvas.height = Math.max(1, Math.round(r.height * dpr));
            this.canvas.style.width = r.width + 'px';
            this.canvas.style.height = r.height + 'px';
            this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        },
        draw: function() {
            this.ctx.fillStyle = "#000";
            const cssW = this.canvas.clientWidth || (this.canvas.width / (window.devicePixelRatio || 1));
            const cssH = this.canvas.clientHeight || (this.canvas.height / (window.devicePixelRatio || 1));
            this.ctx.fillRect(0, 0, cssW, cssH);
            let cx = (this.canvas.clientWidth || this.canvas.width) / 2 + this.cameraPan.x;
            let cy = (this.canvas.clientHeight || this.canvas.height) / 2 + this.cameraPan.y;
            let sinX = Math.sin(this.cameraRot.x), cosX = Math.cos(this.cameraRot.x);
            let sinY = Math.sin(this.cameraRot.y), cosY = Math.cos(this.cameraRot.y);

            let projObjs = Engine.objects.map(o => {
                let x1 = o.pos.x * cosY - o.pos.z * sinY;
                let z1 = o.pos.z * cosY + o.pos.x * sinY;
                let y2 = o.pos.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + o.pos.y * sinX;
                return { obj: o, px: cx + x1 * this.scale, py: cy + y2 * this.scale, pz: z2, pr: Math.max(1.5, o.radius * this.scale) };
            });
            projObjs.sort((a,b) => a.pz - b.pz);

            for(let p of projObjs) {
                this.ctx.beginPath();
                this.ctx.arc(p.px, p.py, p.pr, 0, Math.PI*2);
                if(p.obj.type === "STAR") this.ctx.fillStyle = "#facc15";
                else if(p.obj.type === "PLANET") this.ctx.fillStyle = "#0ea5e9";
                else if(p.obj.type === "BLACK_HOLE") { this.ctx.fillStyle = "#000"; this.ctx.strokeStyle="#fff"; this.ctx.stroke(); }
                else if(p.obj.type === "GAS_CLOUD") this.ctx.fillStyle = "rgba(16, 185, 129, 0.5)";
                else this.ctx.fillStyle = "#aaa";
                this.ctx.fill();
            }
        }
    }

const Engine = {
        objects: [], time: 0, dt: 120, integratorType: "RK4", gravityAlgorithm: "BARNES_HUT",
        status: "STABLE", paused: false, frames: 0, lastFpsTime: 0,
        activeModels: ["Gravity", "Collision", "Thermodynamics"],

        setIntegrator: function(type) { this.integratorType = String(type).toLowerCase(); },
        setDt: function(value) {
            const v = Number(value);
            if (!Number.isFinite(v) || v <= 0) return false;
            this.dt = v;
            return true;
        },

        getAccelerations: function(objs) {
            let accels = new Array(objs.length).fill(null).map(() => new Vec3());

            if(this.activeModels.includes("Gravity")) {
                let gravAcc = GravityEngine.computeAccelerations(objs, this.gravityAlgorithm === "BARNES_HUT");
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(gravAcc[i]);
            }
            if(this.activeModels.includes("Relativity")) {
                let grAcc = RelativityEngine.computeSchwarzschildPrecession(objs);
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(grAcc[i]);
            }
            if(this.activeModels.includes("Electromagnetic")) {
                let emAcc = ElectromagneticEngine.computeAccelerations(objs);
                for(let i=0; i<objs.length; i++) accels[i] = accels[i].add(emAcc[i]);
            }
            return accels;
        },

        step: function() {
            if(this.status === "FAILED") return;

            // Safety
            for(let o of this.objects) {
                if(isNaN(o.pos.x) || isNaN(o.vel.x)) { this.status = "FAILED"; alert("CATASTROPHIC NUMERICAL INSTABILITY DETECTED (NaN)."); return; }
                if(o.vel.magSq() >= PhysicsConstants.c * PhysicsConstants.c) { this.status = "FAILED"; alert("SUPERLUMINAL VELOCITY DETECTED."); return; }
            }

            if (!Number.isFinite(this.dt) || this.dt <= 0) { this.status="FAILED"; throw new Error("Invalid simulation timestep"); }
            let t_integrator = this.integratorType.toLowerCase();
            if(t_integrator === "euler") {
                Integrators.eulerSemiImplicit(this.objects, this.dt, this.getAccelerations(this.objects));
            } else if(t_integrator === "verlet") {
                Integrators.verlet(this.objects, this.dt, (obs)=>this.getAccelerations(obs));
            } else if(t_integrator === "rk4") {
                Integrators.rk4(this.objects, this.dt, (obs)=>this.getAccelerations(obs));
            }

            if(this.activeModels.includes("Fluid")) FluidEngine.computeSPH(this.objects);
            if(this.activeModels.includes("Nuclear")) NuclearEngine.computeFusion(this.dt, this.objects);
            if(this.activeModels.includes("Collision")) CollisionEngine.checkAndResolve(this.objects);

            // Thermodynamics and Radiation processing
            if(this.activeModels.includes("Thermodynamics")) {
                ThermoEngine.updateTemperature(this.objects);
                ThermoEngine.computeRadiation(this.dt, this.objects);
            }

            this.time += this.dt;
            Diagnostics.update(this.objects);

            // diag-time and diag-count are omitted to map strictly to provided canonical HTML,
            // or handled via UI.updateInspector() directly.
            UI.updateInspector();
        },

        togglePause: function() {
            this.paused = !this.paused;
            const b = document.getElementById('btn-pause');
            if (b) {
                b.textContent = this.paused ? "재개 (RESUME)" : "일시정지 (PAUSE)";
                b.setAttribute('aria-pressed', String(this.paused));
            }
        },

        loop: function() {
            requestAnimationFrame(() => this.loop());
            let now = performance.now(); this.frames++;
            if(now - this.lastFpsTime >= 1000) { this.frames = 0; this.lastFpsTime = now; } // FPS tracking decoupled from DOM

            if(!this.paused) {
                const substeps = 1;
                for(let i=0;i<substeps;i++){
                    try {
                        this.step();
                    } catch(err) {
                        this.status="FAILED";
                        this.paused=true;
                        const msg=err&&err.message?err.message:String(err);
                        const statusEl=document.getElementById('diag-status');
                        if(statusEl){statusEl.textContent="FAILED (계산 중단)";statusEl.className="val fail";}
                        if(window.UI&&UI.setMessage)UI.setMessage("수치 계산 중단: "+msg,"danger");
                        break;
                    }
                    if(this.status==="FAILED")break;
                }
            }
            Renderer.draw();
        }
    }



function bindControls() {
    const dt = document.getElementById('sys-dt');
    const integrator = document.getElementById('integrator');
    const gravity = document.getElementById('sys-gravity');
    const pause = document.getElementById('btn-pause');
    const audit = document.getElementById('btn-audit');
    const create = document.getElementById('btn-create');
    if (dt) dt.addEventListener('change', () => { if (!Engine.setDt(dt.value)) dt.value = Engine.dt; });
    if (integrator) integrator.addEventListener('change', () => Engine.setIntegrator(integrator.value));
    if (gravity) gravity.addEventListener('change', () => Engine.gravityAlgorithm = gravity.value);
    if (pause) pause.addEventListener('click', () => Engine.togglePause());
    if (audit) audit.addEventListener('click', () => UI.showAudit());
    if (create) create.addEventListener('click', () => UI.createObject());
    if (pause) pause.setAttribute('aria-pressed','false');
}

window.addEventListener('load', () => {
    UI.init();
    Renderer.init();
    bindControls();
    Labs.loadLab('GRAVITY');
    Engine.loop();
});

    </script>
