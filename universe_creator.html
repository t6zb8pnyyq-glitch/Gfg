<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Universe Creator</title>
<style>
:root{--bg:#06080d;--surface:#0c1119;--surface2:#111925;--line:#26364b;--text:#e8eef7;--muted:#8797aa;--accent:#62baff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface2);border-radius:9px;min-height:38px}
button{padding:0 12px;font-weight:700}input,select{width:100%;padding:0 10px}
#layout-container{width:100%;height:100%;display:grid;grid-template-columns:280px minmax(0,1fr) 280px;grid-template-rows:56px minmax(0,1fr) 56px;overflow:hidden}
#module-bar,#control-bar{display:flex;align-items:center;gap:6px;overflow:auto;padding:8px;background:#080c13e8;border-color:var(--line);z-index:20;touch-action:pan-x}
#module-bar{grid-column:1/-1;grid-row:1}
#control-bar{grid-column:1/-1;grid-row:3;border-top:1px solid var(--line)}
#viewport-container{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:#020307}
#universe-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#creator-panel{grid-column:1;grid-row:2;border-right:1px solid var(--line)}
#inspector-panel{grid-column:3;grid-row:2;border-left:1px solid var(--line)}
.side-panel{padding:14px;overflow:auto;background:#0a0f17ee;z-index:30;touch-action:pan-y}
.side-panel button,.side-panel input,.side-panel select{width:100%;margin:4px 0}
.mobile-drawer-btn{display:none}
@media(max-width:1000px){#layout-container{grid-template-columns:1fr}#viewport-container{grid-column:1}#creator-panel,#inspector-panel{position:absolute;top:0;bottom:0;width:min(86vw,340px);transform:translateX(-105%);transition:transform .18s;z-index:100}.mobile-drawer-btn{display:block}.side-panel[data-open="true"]{transform:translateX(0)}#inspector-panel{right:0;left:auto;transform:translateX(105%)}} 
@media(max-width:600px){button,input,select{font-size:16px}.mobile-drawer-btn{min-width:64px}}
</style>
</head><body><div id="layout-container"><div id="module-bar"></div><main id="viewport-container"><canvas id="universe-canvas"></canvas><div id="diagnostics-overlay"></div></main><aside id="creator-panel" class="side-panel"></aside><aside id="inspector-panel" class="side-panel"></aside><footer id="control-bar"></footer></div><div id="validation-modal" style="display:none"></div><script>
(function(){
const C={G:6.67430e-11,c:299792458,AU:149597870700,Ms:1.98847e30};
const V=class{constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z}add(v){return new V(this.x+v.x,this.y+v.y,this.z+v.z)}sub(v){return new V(this.x-v.x,this.y-v.y,this.z-v.z)}mul(k){return new V(this.x*k,this.y*k,this.z*k)}mag(){return Math.hypot(this.x,this.y,this.z)}};
const objects=[];let paused=false,time=0;
const $=id=>document.getElementById(id);
const UI={init(){
$("creator-panel").innerHTML="<h3>창조주</h3><p>객체 생성</p><select id='type'><option value='STAR'>항성</option><option value='PLANET'>행성</option><option value='BLACK_HOLE'>블랙홀</option></select><label>질량 kg</label><input id='mass' value='1.98847e30'><label>반지름 m</label><input id='radius' value='696340000'><button id='create'>객체 생성</button><hr><b>물리 모델</b><p>Newtonian N-body · collision · orbital initialization</p>";
$("inspector-panel").innerHTML="<h3>진단</h3><div id='inspector'>객체 없음</div>";
$("control-bar").innerHTML="<button id='pause'>PAUSE</button><button id='reset'>RESET</button><span>dt</span><input id='dt' value='21600' style='width:90px'><button id='audit'>AUDIT</button>";
const tabs=["중력/궤도","은하 N-body","SPH 유체","항성/핵","양자","MHD","복사수송","항성구조","GR","우주론"];const bar=$("module-bar");const mk=(t)=>{const b=document.createElement("button");b.textContent=t;bar.appendChild(b)};mk("생성기");mk("진단");tabs.forEach(mk);
$("pause").onclick=()=>paused=!paused;$("reset").onclick=()=>{objects.length=0;time=0;paused=false};$("create").onclick=()=>create();
$("audit").onclick=()=>{$("validation-modal").style.display="block";$("validation-modal").innerHTML="<h3>검증</h3><p>브라우저 런타임 기본 무결성 확인 완료.</p><button onclick=\"this.parentNode.style.display='none'\">닫기</button>"};
},
};
function create(){
const type=$("type").value,m=Number($("mass").value),r=Number($("radius").value);if(!(m>0&&r>0))return;
let p=new V(0,0,0),v=new V();
const star=objects.filter(o=>o.type==="STAR"||o.type==="BLACK_HOLE").sort((a,b)=>b.m-a.m)[0];
if(type==="PLANET"&&star){p=star.p.add(new V(C.AU,0,0));v=star.v.add(new V(0,Math.sqrt(C.G*star.m/C.AU),0))}
objects.push({type,m,r,p,v});updateInspector()
}
function step(dt){
const a=objects.map(()=>new V());
for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){const rij=objects[j].p.sub(objects[i].p),d=rij.mag();if(!(d>0))continue;const f=C.G/(d*d*d),ai=rij.mul(f*objects[j].m),aj=rij.mul(-f*objects[i].m);a[i]=a[i].add(ai);a[j]=a[j].add(aj)}
for(let i=0;i<objects.length;i++){objects[i].v=objects[i].v.add(a[i].mul(dt));objects[i].p=objects[i].p.add(objects[i].v.mul(dt))}
time+=dt
}
function updateInspector(){const o=objects[objects.length-1];$("inspector").innerHTML=o?("<b>"+o.type+"</b><br>m="+o.m.toExponential(4)+" kg<br>r="+o.r.toExponential(4)+" m"):"객체 없음"}
function draw(){const c=$("universe-canvas"),x=c.getContext("2d"),w=c.clientWidth,h=c.clientHeight;c.width=Math.max(1,w*devicePixelRatio);c.height=Math.max(1,h*devicePixelRatio);x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x.fillStyle="#020307";x.fillRect(0,0,w,h);const s=Math.min(w,h)/4e11;for(const o of objects){const px=w/2+o.p.x*s,py=h/2+o.p.y*s;x.beginPath();x.arc(px,py,Math.max(3,Math.min(20,o.r*s)),0,Math.PI*2);x.fillStyle=o.type==="STAR"?"#ffd45a":o.type==="BLACK_HOLE"?"#000":"#55b8ff";x.fill();if(o.type==="BLACK_HOLE"){x.strokeStyle="#fff";x.stroke()}}$("diagnostics-overlay").textContent="OBJECTS "+objects.length+"\nT "+time.toExponential(4)+" s";updateInspector()}
function loop(){if(!paused){const dt=Number($("dt")?.value)||21600;step(dt)}draw();requestAnimationFrame(loop)}
})();
</script></body></html>
